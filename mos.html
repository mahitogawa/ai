<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOS対策ドリル（ワード・エクセル 一般）</title>
<meta name="description" content="MOS(Microsoft Office Specialist) ワード・エクセル一般レベルの用語・操作を4択クイズで予備学習できるドリルアプリ。">
<meta name="theme-color" content="#0a1a2e">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --navy:#0a1a2e; --navy-dark:#050d18;
  --teal:#22d3ee; --teal-hover:#0891b2;
  --word:#2b7de9; --excel:#1e9e5a;
  --ink:#e0f7ff; --muted:rgba(255,255,255,.65);
  --line:rgba(148,163,184,.2);
  --danger:#f87171; --good:#34d399;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(34,211,238,.12) 0%, transparent 60%),
    linear-gradient(170deg, var(--navy) 0%, var(--navy-dark) 45%);
  background-attachment:fixed;
  color:var(--ink); min-height:100vh;
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none;font-family:inherit;}

#topHeader{background:var(--navy);padding:16px;border-bottom:1px solid rgba(34,211,238,.25);text-align:center;}
#topHeader h1{font-size:22px;margin:0;color:#e0f7ff;font-weight:900;letter-spacing:.01em;}
#topHeader .tagline{font-size:14px;color:#9fd8e8;margin:6px 0 0;font-weight:700;}

.wrap{max-width:680px;margin:0 auto;padding:18px 14px 80px;}

#crosslink{text-align:center;padding:7px 16px;background:var(--navy-dark);border-bottom:1px solid var(--line);}
#crosslink a{color:var(--teal);font-size:13.5px;font-weight:700;text-decoration:none;margin:0 8px;}

/* メニュー */
#menu-screen{
  background:
    linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px) 0 0/22px 22px,
    radial-gradient(ellipse at 50% 0%, rgba(34,211,238,0.16) 0%, transparent 60%),
    linear-gradient(170deg, #0a1a2e 0%, #050d18 100%);
  border-radius:20px; padding:18px 14px 22px;
  box-shadow:0 8px 32px rgba(34,211,238,0.14), 0 2px 40px rgba(0,0,0,0.6);
  position:relative; overflow:hidden;
}
.stat-line{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px;font-weight:700;}
.sub-heading{font-size:14px;font-weight:900;color:var(--teal);margin:16px 0 8px;padding-left:2px;}
.sub-heading.excel{color:#4ade80;}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:4px;}
.menu button{
  background:radial-gradient(ellipse at 50% 20%, rgba(34,211,238,0.12) 0%, transparent 70%), linear-gradient(170deg, #0a1a2e 0%, #071019 100%);
  color:#d7f5fb; font-size:14.5px; padding:16px 10px; border-radius:14px;
  border:1px solid rgba(34,211,238,.28); font-weight:700; line-height:1.45;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  position:relative; transition:transform .12s, box-shadow .12s, border-color .12s;
}
.menu button:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.7);}
.menu button:active{transform:scale(.96);}
.menu button.wide{grid-column:1/-1;}
.menu button.mini{
  background:radial-gradient(ellipse at 50% 0%, rgba(34,211,238,.18) 0%, transparent 70%), linear-gradient(170deg, #0a1a2e 0%, #071019 100%);
  border:2px solid var(--teal); padding-top:20px;
  box-shadow:0 0 0 1px rgba(34,211,238,.25) inset, 0 0 22px rgba(34,211,238,.3), 0 8px 20px rgba(0,0,0,.4);
}
.menu button.excel-cat{border-color:rgba(74,222,128,.3);}
.menu button.excel-cat:hover{border-color:rgba(74,222,128,.7);}
.gicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:7px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.4);}
.excel-cat .gicon{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.4);}
.mtitle{margin:0;}
.msub{display:block;font-weight:500;font-size:.82em;opacity:.75;margin-top:3px;}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#1a0e08;font-size:11px;font-weight:800;padding:3px 12px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);}

/* クイズ画面 */
#quiz-screen{display:none;}
#quiz-screen.show{display:block;}
.quiz-back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:10px;padding:0;}
.quiz-back:active{color:var(--teal);}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.quiz-progress{font-size:13px;font-weight:800;color:var(--teal);}
.quiz-score{font-size:13px;font-weight:800;color:var(--good);}
.progress-bar-wrap{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.progress-bar{height:100%;background:linear-gradient(to right,var(--teal),#67e8f9);border-radius:999px;transition:.3s ease;}
.q-card{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.35);}
.q-cat-tag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--teal);background:rgba(34,211,238,.1);border-radius:999px;padding:3px 10px;margin-bottom:10px;}
.q-text{font-size:16.5px;font-weight:700;line-height:1.6;color:#f0feff;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:14.5px;font-weight:700;color:var(--ink);
  text-align:left;transition:.12s;
}
.choice-btn:active{transform:scale(.98);}
.choice-btn .cl{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--teal);}
.choice-btn.correct{background:rgba(52,211,153,.15);border-color:var(--good);}
.choice-btn.correct .cl{background:var(--good);border-color:var(--good);color:#04211c;}
.choice-btn.wrong{background:rgba(248,113,113,.15);border-color:var(--danger);}
.choice-btn.wrong .cl{background:var(--danger);border-color:var(--danger);color:#fff;}
.choice-btn.disabled{pointer-events:none;opacity:.75;}
.choice-btn.disabled.correct,.choice-btn.disabled.wrong{opacity:1;}
.next-btn{display:none;width:100%;padding:15px;margin-top:14px;background:var(--teal);color:#04141f;border:none;border-radius:14px;font-size:16px;font-weight:900;box-shadow:0 4px 16px rgba(34,211,238,.35);}
.next-btn.show{display:block;}

/* 結果画面 */
#end-screen{display:none;}
#end-screen.show{display:block;}
.end-card{background:var(--navy);border:1px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center;margin-bottom:16px;}
.end-score{font-size:44px;font-weight:900;color:var(--teal);margin:6px 0;}
.end-msg{font-size:14.5px;color:var(--muted);font-weight:700;line-height:1.7;}
.detail-title{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 0 6px;text-align:left;}
.detail-wrap{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}
.detail-table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:left;}
.detail-table th{background:rgba(34,211,238,.1);color:var(--ink);padding:6px 8px;position:sticky;top:0;}
.detail-table td{padding:6px 8px;border-top:1px solid var(--line);}
.act-row{display:flex;gap:10px;margin-top:16px;}
.act-btn{flex:1;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:900;}
.act-again{background:var(--teal);color:#04141f;}
.act-menu{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);}

.site-footer{text-align:center;padding:20px 16px;color:var(--muted);font-size:12.5px;font-weight:700;border-top:1px solid var(--line);margin-top:20px;}
.site-footer a{color:var(--teal);text-decoration:none;font-weight:800;}
#gc-visits{display:block;margin-top:6px;}

/* PC（広い画面）向けに拡大表示 */
@media (min-width:900px){
  .wrap{max-width:980px;}
  #topHeader h1{font-size:26px;}
  #topHeader .tagline{font-size:15px;}
  .stat-line{font-size:14.5px;}
  .sub-heading{font-size:16px;}
  .menu button{font-size:16px;padding:20px 14px;}
  .gicon{font-size:24px;margin-bottom:8px;}
  .msub{font-size:.85em;}
  .q-cat-tag{font-size:13px;padding:4px 12px;}
  .q-text{font-size:19px;}
  .q-card{padding:24px;}
  .choice-btn{font-size:16px;padding:16px 18px;}
  .choice-btn .cl{width:30px;height:30px;font-size:15px;}
  .next-btn{font-size:18px;padding:17px;}
  .quiz-progress,.quiz-score{font-size:14px;}
  .end-score{font-size:50px;}
  .end-msg{font-size:15.5px;}
  .detail-table{font-size:14px;}
  .act-btn{font-size:16px;padding:16px;}
}
</style>
</head>
<body>

<div id="topHeader">
  <h1>📊 MOS対策ドリル</h1>
  <p class="tagline">ワード・エクセル 一般レベル｜用語・操作の4択クイズ</p>
</div>

<div id="crosslink">
  <a href="mos-sim.html">🖱️ 操作シミュレーション版（PC推奨）</a>
  <a href="index.html">🐱 生成AIパスポート</a>
  <a href="it-passport.html">🐈 ITパスポート</a>
</div>

<div class="wrap">

  <div id="menu-screen">
    <div class="stat-line" id="statLine">これまでの累計：読み込み中...</div>

    <div class="menu" id="topMenu">
      <button class="wide mini" onclick="startMode('mini')"><span class="badge">⭐ おすすめ・混合15問</span><div class="gicon">🎯</div><div class="mtitle">ワード＋エクセル ミニ復習</div><div class="msub">（混合15問・結果がすぐ出る）</div></button>
    </div>

    <div class="sub-heading">📝 ワード（Word）一般</div>
    <div class="menu" id="wordMenu"></div>

    <div class="sub-heading excel">📈 エクセル（Excel）一般</div>
    <div class="menu" id="excelMenu"></div>

    <div class="menu" style="margin-top:10px;">
      <button class="wide" onclick="startMode('all')"><div class="gicon">🔁</div><div class="mtitle">全問ランダム総復習</div><div class="msub">（ワード・エクセル 全80問）</div></button>
    </div>
  </div>

  <div id="quiz-screen">
    <div class="quiz-top">
      <div class="quiz-progress" id="quizProgress">1 / 15</div>
      <div class="quiz-score" id="quizScore">正解 0</div>
    </div>
    <button class="quiz-back" onclick="exitQuiz()">← メニューに戻る（途中でやめる）</button>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%;"></div></div>
    <div class="q-card">
      <span class="q-cat-tag" id="qCatTag">ワード</span>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="choices" id="qChoices"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次へ →</button>
  </div>

  <div id="end-screen">
    <div class="end-card">
      <div style="font-size:14px;color:var(--muted);font-weight:700;">結果</div>
      <div class="end-score" id="endScore">0%</div>
      <div class="end-msg" id="endMsg"></div>
    </div>
    <div class="detail-title">📋 回答詳細（問題・あなたの解答・正誤）</div>
    <div class="detail-wrap">
      <table class="detail-table">
        <tr><th>問題</th><th>あなたの解答</th><th>正誤</th></tr>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
    <div class="act-row">
      <button class="act-btn act-again" onclick="showMenu()">🔄 メニューに戻る</button>
    </div>
  </div>

</div>

<div class="site-footer">
  © Mahito｜MOSは Microsoft の登録商標です。本アプリは非公式の学習用ドリルであり、公式試験問題ではありません。
  <span id="gc-visits">👀 訪問者数：読み込み中...</span>
</div>

<script>
// ===== カテゴリ定義 =====
const CATS = [
  {id:'w0', subject:'word',  icon:'📁', label:'文書管理・基本操作'},
  {id:'w1', subject:'word',  icon:'🔤', label:'文字・段落の書式設定'},
  {id:'w2', subject:'word',  icon:'📋', label:'表とリスト'},
  {id:'w3', subject:'word',  icon:'📑', label:'参考資料の作成と管理'},
  {id:'w4', subject:'word',  icon:'🖼', label:'グラフィック要素'},
  {id:'e0', subject:'excel', icon:'📗', label:'ワークシート・ブック管理'},
  {id:'e1', subject:'excel', icon:'🔢', label:'セルとデータ管理'},
  {id:'e2', subject:'excel', icon:'🗂', label:'テーブルの管理'},
  {id:'e3', subject:'excel', icon:'🧮', label:'数式・関数'},
  {id:'e4', subject:'excel', icon:'📉', label:'グラフの作成・管理'},
];

// ===== 問題データ（4択・全80問） =====
const QUESTIONS = [
// --- w0 文書管理・基本操作 ---
{cat:'w0', q:'Wordで作成した文書を「以前のバージョンのWordでも開ける形式」で保存したいとき、名前を付けて保存の「ファイルの種類」で選ぶべき形式は？', choices:['Word 97-2003 文書 (.doc)','PDF (.pdf)','Word テンプレート (.dotx)','Web ページ (.htm)'], a:0},
{cat:'w0', q:'文書内の総ページ数と現在のページ番号を確認できる場所は？', choices:['クイックアクセスツールバー','ステータスバー','リボンの「表示」タブのみ','タイトルバー'], a:1},
{cat:'w0', q:'印刷前に、実際の見た目を確認できる機能は？', choices:['印刷プレビュー（ファイル＞印刷）','校閲','スペルチェック','変更履歴'], a:0},
{cat:'w0', q:'文書のプロパティ（作成者、タイトルなど）を確認・編集できる場所は？', choices:['ホームタブ','ファイル＞情報','挿入タブ','レイアウトタブ'], a:1},
{cat:'w0', q:'作業中の文書を誤って閉じてしまった場合に、自動保存されたファイルを探す機能は？', choices:['自動回復（文書の管理）','ごみ箱','クリップボード','テンプレート'], a:0},
{cat:'w0', q:'複数のウィンドウで同じ文書を並べて表示し、別の箇所を同時に編集・比較したいときに使う機能は？', choices:['ウィンドウの分割（表示タブ）','ページ設定','セクション区切り','差し込み印刷'], a:0},
{cat:'w0', q:'文書をテンプレートとして保存する際の拡張子は？', choices:['.docx','.dotx','.docm','.pdf'], a:1},
{cat:'w0', q:'よく使うコマンドを常に表示させておきたいときに追加する場所は？', choices:['クイックアクセスツールバー','ステータスバー','ルーラー','ナビゲーションウィンドウ'], a:0},
// --- w1 文字・段落の書式設定 ---
{cat:'w1', q:'文字に取り消し線を引く書式ボタンがあるのは？', choices:['ホームタブのフォントグループ','挿入タブ','レイアウトタブ','校閲タブ'], a:0},
{cat:'w1', q:'段落の先頭行だけを字下げする設定は？', choices:['ぶら下げインデント','1行目のインデント','均等割り付け','行間設定'], a:1},
{cat:'w1', q:'見出しに統一感を持たせ、後で目次を自動作成できるようにするために使うべき機能は？', choices:['スタイル（見出し1・見出し2など）','蛍光ペン','ワードアート','透かし'], a:0},
{cat:'w1', q:'段落と段落の間の余白（段落前・段落後）を設定するダイアログを開くには？', choices:['「段落」ダイアログ','「フォント」ダイアログ','「ページ設定」ダイアログ','「タブとリーダー」ダイアログ'], a:0},
{cat:'w1', q:'特定の文字列だけを検索して別の文字列に一括で置き換える機能は？', choices:['置換（Ctrl+H）','スペルチェック','ナビゲーション','校閲'], a:0},
{cat:'w1', q:'行の途中で強制的に改行するが、新しい段落にはしたくないときに使うキー操作は？', choices:['Shift + Enter','Ctrl + Enter','Enter','Ctrl + Shift + Enter'], a:0},
{cat:'w1', q:'文字の色や背景色ではなく、「蛍光ペンで線を引いたような強調」をする機能は？', choices:['蛍光ペンの色（ホームタブ）','フォントの色','罫線','スタイル'], a:0},
{cat:'w1', q:'書式のみをコピーして他の文字に適用する機能は？', choices:['書式のコピー/貼り付け（ハケのアイコン）','形式を選択して貼り付け','テキストのみ保持','リンク貼り付け'], a:0},
// --- w2 表とリスト ---
{cat:'w2', q:'文章の一部を選択して、Wordの表に変換する機能は？', choices:['「挿入」タブ→表→文字列を表にする','「デザイン」タブ','「校閲」タブ','「参考資料」タブ'], a:0},
{cat:'w2', q:'表の行を数値の昇順などで並べ替える機能はどこにある？', choices:['表ツールの「レイアウト」タブの「並べ替え」','「ホーム」タブ','「挿入」タブ','「校閲」タブ'], a:0},
{cat:'w2', q:'番号付きリストの途中の番号を「1」以外から始めたいときは？', choices:['「番号の設定」から開始番号を指定する','リストを削除して作り直す','フォントサイズを変える','インデントを増やす'], a:0},
{cat:'w2', q:'表の複数のセルを1つに結合する機能がある場所は？', choices:['表ツールの「レイアウト」タブ','「デザイン」タブ','「挿入」タブ','「校閲」タブ'], a:0},
{cat:'w2', q:'箇条書きの行頭記号（●や■など）を変更する機能は？', choices:['「箇条書き」ボタンの▼から記号を選択','フォントを変更','段落記号を表示','スタイルの管理'], a:0},
{cat:'w2', q:'表の各列の幅をすべて均等にそろえる機能は？', choices:['表ツールの「レイアウト」タブの「幅を揃える」','「デザイン」タブの「飾り枠」','セルの結合','表のスタイル'], a:0},
{cat:'w2', q:'Excelの表データをWord文書に「元のExcelとリンクした状態」で貼り付ける方法は？', choices:['形式を選択して貼り付け→リンク貼り付け','通常の貼り付け（Ctrl+V）','テキストのみ保持','図として貼り付け（リンクなし）'], a:0},
{cat:'w2', q:'表全体に統一されたデザイン（色・罫線）を一括で適用する機能は？', choices:['表のスタイル（表ツールの「デザイン」タブ）','セルの網かけを1つずつ設定','段落スタイル','テーマの変更のみ'], a:0},
// --- w3 参考資料の作成と管理 ---
{cat:'w3', q:'見出しスタイルを使った文書から、自動で目次を作成する機能はどのタブにある？', choices:['参考資料タブの「目次」','挿入タブ','レイアウトタブ','校閲タブ'], a:0},
{cat:'w3', q:'文中の用語について、ページ下部に説明を追加する機能は？', choices:['脚注（参考資料タブ）','コメント','相互参照','ハイパーリンク'], a:0},

const choiceLabels = ['ア','イ','ウ','エ'];

// ===== 状態 =====
let current = [];      // 出題中の問題配列
let idx = 0;
let score = 0;
let answers = [];      // 各問の選択インデックス

// ===== メニュー描画 =====
function catCount(id){ return QUESTIONS.filter(q=>q.cat===id).length; }

function renderMenus(){
  const wordCats = CATS.filter(c=>c.subject==='word');
  const excelCats = CATS.filter(c=>c.subject==='excel');
  document.getElementById('wordMenu').innerHTML = wordCats.map(c=>`
    <button onclick="startCategory('${c.id}')"><div class="gicon">${c.icon}</div><div class="mtitle">${c.label}</div><div class="msub">（${catCount(c.id)}問）</div></button>
  `).join('');
  document.getElementById('excelMenu').innerHTML = excelCats.map(c=>`
    <button class="excel-cat" onclick="startCategory('${c.id}')"><div class="gicon">${c.icon}</div><div class="mtitle">${c.label}</div><div class="msub">（${catCount(c.id)}問）</div></button>
  `).join('');
}

function catLabel(catId){
  const c = CATS.find(x=>x.id===catId);
  return c ? (c.subject==='word' ? '📝 '+c.label : '📈 '+c.label) : '';
}

// ===== 統計（累計） =====
function loadStats(){
  try{ return JSON.parse(localStorage.getItem('mosStats')||'{}'); }catch(e){ return {}; }
}
function saveStats(s){
  try{ localStorage.setItem('mosStats', JSON.stringify(s)); }catch(e){}
}
function renderStatLine(){
  const s = loadStats();
  const total = s.total||0, correct = s.correct||0;
  const rate = total ? Math.round(correct/total*100) : 0;
  document.getElementById('statLine').textContent = total
    ? `これまでの累計：${total}問中${correct}問正解（正答率${rate}%）`
    : 'これまでの累計：まだ記録がないにゃ。まずは1問やってみよう！';
}

// ===== 出題開始 =====
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function cloneQ(q){ return Object.assign({}, q); }

function startCategory(catId){
  current = shuffle(QUESTIONS.filter(q=>q.cat===catId)).map(cloneQ);
  beginQuiz();
}
function startMode(mode){
  if(mode==='mini') current = shuffle(QUESTIONS).slice(0,15).map(cloneQ);
  else if(mode==='all') current = shuffle(QUESTIONS).map(cloneQ);
  beginQuiz();
}

function beginQuiz(){
  idx = 0; score = 0; answers = [];
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('quiz-screen').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
  renderQuestion();
}

function renderQuestion(){
  const q = current[idx];
  // 選択肢の表示順をシャッフル（正解が常に「ア」になって当てずっぽうで解けてしまうのを防ぐ）
  q._order = shuffle([0,1,2,3]);
  document.getElementById('quizProgress').textContent = `${idx+1} / ${current.length}`;
  document.getElementById('quizScore').textContent = `正解 ${score}`;
  document.getElementById('progressBar').style.width = Math.round((idx)/current.length*100)+'%';
  document.getElementById('qCatTag').textContent = catLabel(q.cat);
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qChoices').innerHTML = q._order.map((origIdx,pos)=>`
    <button class="choice-btn" onclick="selectAnswer(${pos})"><span class="cl">${choiceLabels[pos]}</span><span>${q.choices[origIdx]}</span></button>
  `).join('');
  document.getElementById('nextBtn').classList.remove('show');
}

function selectAnswer(pos){
  const q = current[idx];
  const origIdx = q._order[pos];
  const correctPos = q._order.indexOf(q.a);
  const btns = document.querySelectorAll('#qChoices .choice-btn');
  btns.forEach(b=>b.classList.add('disabled'));
  btns[correctPos].classList.add('correct');
  if(pos !== correctPos) btns[pos].classList.add('wrong');
  else score++;
  answers.push(origIdx);
  document.getElementById('quizScore').textContent = `正解 ${score}`;
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').textContent = (idx+1 < current.length) ? '次へ →' : '結果を見る →';
}

function nextQuestion(){
  idx++;
  if(idx < current.length){ renderQuestion(); }
  else { showResult(); }
}

function showResult(){
  document.getElementById('quiz-screen').classList.remove('show');
  document.getElementById('end-screen').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});

  const total = current.length;
  const rate = Math.round(score/total*100);
  document.getElementById('endScore').textContent = `${rate}% (${score}/${total}問)`;
  let msg = '';
  if(rate>=90) msg = 'すごいにゃ！ほぼ完璧、この調子で本番に近い操作練習も進めよう🐱';
  else if(rate>=70) msg = 'いい感じにゃ！間違えた問題を下の表で見直そう。';
  else msg = 'まずは用語に慣れるところから。下の表で間違えた問題を復習してにゃ。';
  document.getElementById('endMsg').textContent = msg;

  document.getElementById('detailBody').innerHTML = current.map((q,i)=>{
    const picked = answers[i];
    const correct = picked === q.a;
    return `<tr>
      <td>${i+1}. ${q.q}</td>
      <td>${q.choices[picked]}</td>
      <td style="color:${correct?'#34d399':'#f87171'};font-weight:800;">${correct?'○':'×'}</td>
    </tr>`;
  }).join('');

  const s = loadStats();
  s.total = (s.total||0) + total;
  s.correct = (s.correct||0) + score;
  saveStats(s);
  renderStatLine();
}

function exitQuiz(){
  document.getElementById('quiz-screen').classList.remove('show');
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('menu-screen').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function showMenu(){
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('quiz-screen').classList.remove('show');
  document.getElementById('menu-screen').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 初期化 =====
renderMenus();
renderStatLine();

fetch('https://mahito.goatcounter.com/counter/TOTAL.json')
  .then(r=>r.json())
  .then(d=>{ document.getElementById('gc-visits').textContent = '👀 訪問者数：'+d.count+' 人'; })
  .catch(()=>{ document.getElementById('gc-visits').textContent = '👀 訪問者数：集計中'; });
</script>
