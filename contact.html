<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Zen Maru Gothic',-apple-system,'Hiragino Sans',sans-serif;
  background:#fdf8f3;color:#2c2118;min-height:100vh;line-height:1.8;
}
.hd{background:#2d6a4f;padding:env(safe-area-inset-top,0) 0 0;position:sticky;top:0;z-index:100;}
.hd-inner{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:640px;margin:0 auto;}
.hd-icon{font-size:1.6rem;}
.hd-title{font-size:1.1rem;font-weight:900;color:#fff;flex:1;}
.hd-back{font-size:0.85rem;font-weight:700;color:rgba(255,255,255,.85);text-decoration:none;white-space:nowrap;}
.hd-back:active{opacity:.7;}
.main{max-width:640px;margin:0 auto;padding:24px 16px 48px;}
.page-title{font-size:1.4rem;font-weight:900;color:#2d6a4f;margin-bottom:6px;}
.page-sub{font-size:13px;font-weight:700;color:#8b7355;margin-bottom:24px;line-height:1.8;}
.card{
  background:#fff;border-radius:20px;padding:20px;
  margin-bottom:16px;border:1px solid #e8ddd0;
  box-shadow:0 2px 12px rgba(44,33,24,.06);
}
.card-title{font-size:15px;font-weight:900;color:#2d6a4f;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #e8f5ef;}
.card p{font-size:13px;font-weight:700;color:#5c4a38;line-height:1.9;margin-bottom:8px;}
.card p:last-child{margin-bottom:0;}
.form-wrap{
  width:100%;border:none;border-radius:16px;overflow:hidden;
  box-shadow:0 2px 12px rgba(44,33,24,.08);
  background:#fff;
}
.form-wrap iframe{
  width:100%;min-height:600px;border:none;display:block;
}
.note{font-size:12px;font-weight:700;color:#b8a898;text-align:center;margin-top:10px;}
.footer{text-align:center;font-size:12px;font-weight:700;color:#b8a898;margin-top:32px;padding-top:20px;border-top:1px solid #e8ddd0;}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-inner">
    <div class="hd-icon">🐱</div>

    🐈 TOPに戻る
  </a>

  <div class="footer">© Mahi-Mahi / 生成AIパスポート最強ドリル</div>

</html>
