<html lang="ja">
<head>

<title>ITパスポート試験 対策ドリル（全200問）</title>
<style>
html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f4f7fa; margin:0; padding:0; color:#222; font-size:16px;
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor:pointer; user-select:none; -webkit-user-select:none; font-family:inherit; }

#topHeader { background:#fff; border-bottom:1px solid #e2e8f0; padding:14px 16px; }
#topHeader .eyebrow { font-size:12px; color:#64748b; margin:0 0 2px; }
#topHeader h1 { font-size:22px; margin:0; color:#0071ec; font-weight:800; }
#subnav { background:#3a3f4b; color:#fff; padding:10px 16px; font-size:13px; font-weight:700; letter-spacing:.02em; }

.wrap { max-width:720px; margin:0 auto; padding:16px; }
.breadcrumb { font-size:13px; color:#0071ec; margin-bottom:14px; }
.breadcrumb span { color:#94a3b8; }

.sample-badge { display:inline-block; margin-bottom:14px; padding:5px 12px; border-radius:4px; font-size:12px; font-weight:700; background:#e8f3ff; color:#0b4d94; border:1px solid #bcdcff; }

.menu { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
.menu button { background:#fff; color:#0071ec; font-size:14px; padding:16px 8px; border-radius:6px; border:1px solid #cfe0f5; font-weight:bold; line-height:1.5; }
.menu button.wide { grid-column: 1 / -1; }
.menu button.primary { background:#0071ec; color:#fff; border-color:#0071ec; }
.menu button.secondary { background:#fff7e6; color:#92400e; border-color:#fde3a7; }
.menu-note { font-size:12.5px; color:#5b6b7d; margin:2px 0 18px; line-height:1.6; }

.qcard { background:#fff; border:1px solid #dbe6f2; border-radius:6px; padding:0; overflow:hidden; margin-bottom:14px; }
.qcard .qhead { background:#eaf3fc; padding:12px 18px; border-bottom:2px solid #0071ec; }
.qhead .catline { font-size:13px; color:#3a6ea5; font-weight:700; margin:0 0 4px; }
.qhead .progress { font-size:12px; color:#64748b; float:right; }
#question { font-size:17px; font-weight:700; line-height:1.8; padding:18px; margin:0; color:#1a1a1a; }

#answers { display:flex; flex-direction:column; }
#answers .choice-item { display:flex; align-items:flex-start; gap:14px; background:#fff; border-top:1px solid #eef2f7; padding:16px 18px; cursor:pointer; transition:background .15s; }
#answers .choice-item:hover { background:#f5faff; }
#answers .choice-item .choice-label { flex-shrink:0; width:30px; height:30px; border:1px solid #9db8d8; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#3a6ea5; background:#f7fbff; }
#answers .choice-item .choice-text { font-size:15.5px; line-height:1.7; color:#222; word-break:break-word; padding-top:4px; }
#answers .choice-item.correct { background:#eafaf1; }
#answers .choice-item.correct .choice-label { background:#16a34a; border-color:#16a34a; color:#fff; }
#answers .choice-item.correct .choice-text { color:#166534; font-weight:700; }
#answers .choice-item.wrong { background:#fdf1f1; }
#answers .choice-item.wrong .choice-label { background:#dc2626; border-color:#dc2626; color:#fff; }
#answers .choice-item.wrong .choice-text { color:#991b1b; }
#answers .choice-item.disabled-item { pointer-events:none; }

#result { margin:0 0 14px; font-size:14.5px; padding:16px 18px; border-radius:6px; display:none; line-height:1.8; background:#f7f9fb; border:1px solid #e2e8f0; color:#334155; }
#result b { color:#0071ec; }

#nextBtn { display:none; width:100%; background:#0071ec; color:#fff; border:none; padding:15px; border-radius:6px; font-size:16px; font-weight:bold; margin-bottom:8px; }
#backBtn { display:none; width:100%; background:none; border:1px solid #cbd5e1; color:#64748b; font-size:13px; padding:10px; border-radius:6px; }

.end-msg { background:#fff; border:1px solid #dbe6f2; border-radius:6px; padding:28px 18px; text-align:center; font-size:16px; line-height:1.8; margin-bottom:14px; }

footer { text-align:center; color:#5b6b7d; font-size:11.5px; margin-top:10px; line-height:1.7; padding:0 8px 20px; }
</style>
</head>
<body>
<div id="topHeader">
  <p class="eyebrow">ITパスポート試験 対策ドリル</p>
  <h1>🖥️ ITパスポート対策ドリル</h1>
</div>
<div id="subnav">分野別演習　｜　本番形式ランダム　｜　全200問ランダム</div>

<div class="wrap">
  <div class="sample-badge">全200問収録</div>

  <div id="menu-screen">
    <div class="menu">
      <button class="wide primary" onclick="startMode('exam')">🎯 本番形式ランダム（100問・35:20:45の実際の出題比率で抽出）</button>
      <button onclick="startCategory('strategy')">📊 ストラテジ系<br>（70問）</button>
      <button onclick="startCategory('management')">🗂️ マネジメント系<br>（40問）</button>
      <button onclick="startCategory('technology')">⚙️ テクノロジ系<br>（90問）</button>
      <button class="wide secondary" onclick="startMode('all')">🎲 全200問ランダム（腰を据えて総復習）</button>
    </div>
    <p class="menu-note">本番のITパスポート試験は100問・120分、出題比率はストラテジ系35%・マネジメント系20%・テクノロジ系45%だよ。「本番形式ランダム」はその比率のまま200問の中から100問を毎回ランダムに抽出するモード。</p>
  </div>

  <div id="quiz-screen" style="display:none;">
    <div class="breadcrumb"><span id="crumb"></span></div>
    <div class="qcard">
      <div class="qhead">
        <span class="progress" id="score"></span>
        <p class="catline" id="catBadge"></p>
      </div>
      <p id="question"></p>
      <div id="answers"></div>
    </div>
    <div id="result"></div>
    <button id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
    <button id="backBtn" onclick="backToMenu()">分野選択に戻る</button>
  </div>

  <div id="end-screen" style="display:none;">
    <div class="end-msg" id="endMsg"></div>
    <button id="endBackBtn" style="display:block;width:100%;background:#0071ec;color:#fff;border:none;padding:15px;border-radius:6px;font-size:16px;font-weight:bold;" onclick="backToMenu()">分野選択に戻る</button>
  </div>
</div>
<footer>※IPA公開のITパスポート試験シラバス・出題分野を参考に、Claudeが独自の言い回しで作成したオリジナル問題です（IPA公式の過去問そのものではありません）<br>UIは「ITパスポート試験ドットコム」の見た目を参考にデザインしています</footer>

<script>
const catLabels = { strategy:'ストラテジ系', management:'マネジメント系', technology:'テクノロジ系' };
const choiceLabels = ['ア','イ','ウ','エ'];

const quizData = [{"q": "業務改善の手法で、計画→実行→評価→改善のサイクルを繰り返して継続的に品質を高めていく考え方として最も適切なのはどれか。", "a": ["PDCAサイクル", "SWOT分析", "5フォース分析", "バリューチェーン分析"], "cat": "strategy", "c": 0, "d": "「PDCA」はPlan（計画）→Do（実行）→Check（評価）→Act（改善）の頭文字。一度で終わりにせず、ぐるぐる回し続けて少しずつ改善していくのがポイント。品質管理の土台になる基本的な考え方。"}, {"q": "自社の強み・弱みと、外部環境の機会・脅威を4つの軸で整理する経営分析手法として最も適切なのはどれか。", "a": ["SWOT分析", "PPM分析", "PEST分析", "バランススコアカード"], "cat": "strategy", "c": 0, "d": "「SWOT」はStrength（強み）・Weakness（弱み）・Opportunity（機会）・Threat（脅威）の頭文字。自社内部の要因と外部環境の要因を分けて書き出すことで、今後の戦略が立てやすくなる。"}, {"q": "売上高と総費用がちょうど一致し、利益も損失も出ない売上高の水準を表す言葉として最も適切なのはどれか。", "a": ["損益分岐点", "限界利益", "キャッシュフロー", "減価償却"], "cat": "strategy", "c": 0, "d": "「損益分岐点」はそれ以上売れば黒字、それ以下だと赤字になる境目のライン。固定費と変動費を分けて計算する。新しい商売を始めるときに『最低いくつ売れば元が取れるか』を見積もる基本の考え方。"}, {"q": "日本の著作権法における、プログラムの著作物の保護に関する記述として最も適切なのはどれか。", "a": ["プログラムの著作物として、創作した時点で自動的に著作権が発生する", "プログラムを保護するには特許庁への出願・登録が必須である", "アルゴリズムやプログラミング言語の規則そのものも著作権で保護される", "無償で公開されたプログラムには著作権が発生しない"], "cat": "strategy", "c": 0, "d": "著作権は作った瞬間に自動で発生し、特許のような出願・登録の手続きは不要（無方式主義）。一方でアルゴリズムやプログラミング言語の規則そのものは保護対象外という点も、あわせて問われやすい。"}, {"q": "個人情報保護法における『個人情報』の説明として最も適切なのはどれか。", "a": ["生存する個人に関する情報で、氏名や生年月日等により特定の個人を識別できるもの", "法人の商号や所在地に関する情報", "故人に関する情報全般", "匿名化され特定の個人を識別できなくなった統計情報"], "cat": "strategy", "c": 0, "d": "対象になるのは『生存する個人』の情報で、氏名・生年月日・顔写真など単体または組み合わせで特定の個人を識別できるもの。法人の情報や、加工して個人を特定できなくしたデータは対象に含まれない。"}, {"q": "新しい技術的なアイデアの保護に関して、特許権と実用新案権の違いの説明として最も適切なのはどれか。", "a": ["特許権は審査を経て高度な発明を保護し、実用新案権は無審査で登録される考案を保護する", "特許権と実用新案権は保護対象・審査の有無ともに全く同じ制度である", "実用新案権の方が特許権より存続期間が長い", "特許権は登録不要で発生するが実用新案権は登録が必要である"], "cat": "strategy", "c": 0, "d": "特許は『発明』の高度な技術を審査してから保護するのに対し、実用新案は物品の形状・構造などの『考案』を無審査で早く登録できる制度。その分、実用新案は権利の安定性がやや弱いとされる。"}, {"q": "原材料の調達から製造・物流・販売までの一連の流れを情報でつなぎ、全体最適化を図る手法として最も適切なのはどれか。", "a": ["SCM（サプライチェーンマネジメント）", "CRM（顧客関係管理）", "ERP（統合基幹業務システム）", "BPR（業務プロセス再構築）"], "cat": "strategy", "c": 0, "d": "「SCM」は原材料調達から消費者に届くまでのモノ・情報の流れ全体を管理し、在庫の無駄や納期遅れを減らす考え方。社内の会計・人事などを統合管理するERPとは対象範囲が異なる点に注意。"}, {"q": "顧客一人ひとりの購買履歴や問い合わせ履歴を管理し、長期的な関係構築や満足度向上につなげる手法として最も適切なのはどれか。", "a": ["CRM（顧客関係管理）", "SCM（サプライチェーンマネジメント）", "POS（販売時点情報管理）", "EDI（電子データ交換）"], "cat": "strategy", "c": 0, "d": "「CRM」は顧客との関係そのものを資産として捉え、購買履歴や好みを一元管理してマーケティングや接客に活かす手法。販売データの収集に特化したPOSより扱う範囲が広い。"}, {"q": "クラウドサービスの提供形態のうち、OSやミドルウェアまで含めた実行環境を提供し、利用者はその上でアプリケーションを開発する形態として最も適切なのはどれか。", "a": ["PaaS", "SaaS", "IaaS", "DaaS"], "cat": "strategy", "c": 0, "d": "「PaaS（Platform as a Service）」はOSやデータベースなど、アプリを動かすための土台までを用意してくれるサービス。SaaSは完成したソフトそのものを、IaaSはサーバやネットワークなどのインフラだけを提供する点が異なる。"}, {"q": "情報システムの調達において、発注側が必要な機能や要件をまとめて業者に提示し、実現方法や見積りの提案を依頼する文書として最も適切なのはどれか。", "a": ["RFP（提案依頼書）", "RFI（情報提供依頼書）", "SLA（サービスレベル合意書）", "NDA（秘密保持契約書）"], "cat": "strategy", "c": 0, "d": "「RFP」は『こういうシステムが欲しい』という要件を伝え、実現方法や見積りの提案を求める文書。業者の実績や技術力を先に知りたい段階では、より手前の依頼であるRFI（情報提供依頼書）を使う。"}, {"q": "企業活動において、法令だけでなく社会規範や企業倫理に従って行動することを指す言葉として最も適切なのはどれか。", "a": ["コンプライアンス", "アカウンタビリティ", "ガバナンス", "ダイバーシティ"], "cat": "strategy", "c": 0, "d": "「コンプライアンス」は法令遵守と訳されることが多いが、法律だけでなく社内規定や社会的な倫理観に沿って行動することも含む。組織を統治・管理する仕組み自体を指す「ガバナンス」とは意味合いが違う。"}, {"q": "システム開発の手法のうち、要件定義→設計→実装→テストの各工程を順番に進め、原則として前工程には戻らない開発モデルとして最も適切なのはどれか。", "a": ["ウォーターフォールモデル", "アジャイル開発", "スパイラルモデル", "プロトタイピングモデル"], "cat": "management", "c": 0, "d": "「ウォーターフォールモデル」は水が上流から下流へ流れるように、工程を一つずつ完了させて次に進める手法。計画は立てやすい反面、後の工程で問題が見つかると手戻りのコストが大きくなりやすい。"}, {"q": "短い期間（イテレーション）で計画・設計・実装・テストを繰り返し、変化する要求に柔軟に対応しながら開発を進める手法として最も適切なのはどれか。", "a": ["アジャイル開発", "ウォーターフォールモデル", "構造化分析設計", "V字モデル"], "cat": "management", "c": 0, "d": "「アジャイル開発」は小さな単位で開発とリリースを繰り返し、都度フィードバックを反映していく手法。要求がはっきり固まっていない、変化しやすいプロジェクトに向いている。"}, {"q": "プロジェクトで行う作業を、実行可能な単位まで階層的に分解して一覧化する図・手法として最も適切なのはどれか。", "a": ["WBS（work breakdown structure）", "ガントチャート", "PERT図", "バーンダウンチャート"], "cat": "management", "c": 0, "d": "「WBS」はプロジェクト全体の作業を木構造で細かく分解したもの。作業の抜け漏れ防止や、担当・期間の割り当ての土台になる。スケジュールを横棒で表すガントチャートとはセットで使われることが多いが役割が異なる。"}, {"q": "ITサービスの利用者からの問い合わせや障害報告を一元的に受け付ける窓口として最も適切なのはどれか。", "a": ["サービスデスク", "システム監査", "インシデント管理", "キャパシティ管理"], "cat": "management", "c": 0, "d": "「サービスデスク」は利用者にとっての単一の連絡窓口。問い合わせを受けて一次対応したり、必要に応じて専門部署へ引き継いだりする役割を持つ。"}, {"q": "情報システムが安全かつ効率的に運用されているかを、独立した第三者的な立場から検証・評価する活動として最も適切なのはどれか。", "a": ["システム監査", "システム運用", "内部統制の整備", "リスクアセスメント"], "cat": "management", "c": 0, "d": "「システム監査」は監査対象から独立した監査人が、リスク管理や統制の状況を客観的に評価し、改善を助言する活動。監査する側とされる側が別であることが重要なポイント。"}, {"q": "ITサービスの提供者と利用者の間で、稼働率や障害対応時間などのサービス品質の水準を取り決める合意文書として最も適切なのはどれか。", "a": ["SLA（サービスレベル合意書）", "NDA（秘密保持契約書）", "RFP（提案依頼書）", "SOW（作業範囲記述書）"], "cat": "management", "c": 0, "d": "「SLA」はサービスの品質目標を『稼働率〇%以上』『障害復旧は〇時間以内』のように数値で約束する文書。守られているかどうかは定期的にモニタリングされる。"}, {"q": "10進数の「13」を2進数で表したものとして最も適切なのはどれか。", "a": ["1101", "1110", "1011", "1100"], "cat": "technology", "c": 0, "d": "13＝8＋4＋1なので、8の位が1・4の位が1・2の位が0・1の位が1で「1101」。基数変換はパターンさえつかめば得点源になりやすい分野。"}, {"q": "AとBという2つの条件について、両方とも真（true）のときだけ結果が真になる論理演算として最も適切なのはどれか。", "a": ["AND（論理積）", "OR（論理和）", "NOT（否定）", "XOR（排他的論理和）"], "cat": "technology", "c": 0, "d": "「AND」は入力が両方とも真のときだけ真を返す演算。「OR」はどちらか一方でも真なら真、「XOR」は入力が異なるときだけ真になる、という違いを整理しておくと図記号の問題にも対応しやすい。"}, {"q": "隣り合う要素を比較し、大小の順序が逆であれば入れ替える操作を繰り返してデータを並べ替えるアルゴリズムとして最も適切なのはどれか。", "a": ["バブルソート", "二分探索", "ハッシュ法", "線形探索"], "cat": "technology", "c": 0, "d": "「バブルソート」は隣同士を比べて交換する、というシンプルな操作を端から端まで繰り返して並べ替えるアルゴリズム。仕組みは理解しやすいが、データ量が多いと処理に時間がかかりやすい。"}, {"q": "CPUと主記憶（メインメモリ）の速度差を埋めるために、両者の間に置かれる高速・小容量の記憶装置として最も適切なのはどれか。", "a": ["キャッシュメモリ", "レジスタ", "仮想記憶", "補助記憶装置"], "cat": "technology", "c": 0, "d": "「キャッシュメモリ」はCPUがよく使うデータを一時的に保存しておく高速メモリ。主記憶より速いが、CPU内部のレジスタよりは容量が大きく速度は劣る。速度と容量・コストのバランスを取るための仕組み。"}, {"q": "複数台のハードディスクを組み合わせて、処理速度の向上やデータの冗長化（耐障害性向上）を図る技術として最も適切なのはどれか。", "a": ["RAID", "NAS", "SSD", "デフラグ"], "cat": "technology", "c": 0, "d": "「RAID」は複数のディスクをまとめて1台のように扱う技術。データを分散して読み書き速度を上げたり、同じデータを複数のディスクに書いておいて1台壊れても復旧できるようにしたりする方式がある。"}, {"q": "OS（オペレーティングシステム）の役割として最も適切なのはどれか。", "a": ["ハードウェアとアプリケーションソフトウェアの間に立ち、資源の管理や制御を行う", "文書作成や表計算など特定の業務を行うためのソフトウェアである", "ネットワーク上のデータ通信経路を物理的に切り替える装置である", "プログラムのソースコードを機械語に変換する専用ソフトウェアである"], "cat": "technology", "c": 0, "d": "「OS」はメモリやCPU、ファイルなどのハードウェア資源を管理し、その上で動くアプリが動作しやすい環境を提供する基本ソフトウェア。Windows・macOS・Linuxなどが代表例。"}, {"q": "年齢や障がいの有無、言語などにかかわらず、できるだけ多くの人が使いやすいように製品や環境を設計する考え方として最も適切なのはどれか。", "a": ["ユニバーサルデザイン", "バリアフリー", "アクセシビリティ", "UI（ユーザインタフェース）"], "cat": "technology", "c": 0, "d": "「ユニバーサルデザイン」は特定の誰かのために後から手を加えるのではなく、最初から誰にとっても使いやすい設計を目指す考え方。既存の障壁を取り除く『バリアフリー』とは出発点が違う。"}, {"q": "データベース設計において、データの重複や更新時の不整合を防ぐために表を分割・整理する作業として最も適切なのはどれか。", "a": ["正規化", "インデックス設計", "トランザクション管理", "バックアップ"], "cat": "technology", "c": 0, "d": "「正規化」は同じデータがあちこちの表に重複して存在しないよう、表を適切に分割して整理する設計作業。正規化が不十分だと、1か所を更新したときに他の場所とデータが食い違ってしまうことがある。"}, {"q": "IPアドレスのうち、ネットワーク部とホスト部の境界を示すために使われる情報として最も適切なのはどれか。", "a": ["サブネットマスク", "MACアドレス", "デフォルトゲートウェイ", "ポート番号"], "cat": "technology", "c": 0, "d": "「サブネットマスク」はIPアドレスのどこまでがネットワークを表す部分で、どこからが機器（ホスト）を表す部分かを区別するための値。同じネットワーク内かどうかの判定にも使われる。"}, {"q": "インターネット上でドメイン名（例：example.com）をIPアドレスに変換する仕組みとして最も適切なのはどれか。", "a": ["DNS（ドメインネームシステム）", "DHCP", "HTTP", "NAT"], "cat": "technology", "c": 0, "d": "「DNS」は人間が覚えやすいドメイン名と、機械が通信に使うIPアドレスを対応付ける仕組み。機器にIPアドレスを自動で割り当てるDHCPとは役割が異なる。"}, {"q": "実在する企業や金融機関を装ったメールやWebサイトで、利用者からID・パスワードやクレジットカード情報をだまし取る攻撃手法として最も適切なのはどれか。", "a": ["フィッシング", "DoS攻撃", "SQLインジェクション", "ゼロデイ攻撃"], "cat": "technology", "c": 0, "d": "「フィッシング」は本物そっくりの偽サイトやメールに誘導し、利用者自身に情報を入力させてだまし取る手口。システムの弱点を突く攻撃というより、人の心理的な隙を突く手口の一種とされる。"}, {"q": "暗号化に使う鍵と復号に使う鍵が異なり、暗号化用の鍵は公開してもよい暗号方式として最も適切なのはどれか。", "a": ["公開鍵暗号方式", "共通鍵暗号方式", "ハッシュ関数", "電子透かし"], "cat": "technology", "c": 0, "d": "「公開鍵暗号方式」は暗号化する鍵（公開鍵）と復号する鍵（秘密鍵）がペアになっていて別物、という仕組み。鍵を届ける手間は増えるが、共通鍵暗号方式より鍵管理の安全性を高めやすい。"}, {"q": "パスワード（知識情報）に加えて、スマートフォンへの通知や指紋（所持情報・生体情報）など異なる種類の要素を組み合わせて本人確認を行う方式として最も適切なのはどれか。", "a": ["多要素認証", "シングルサインオン", "ワンタイムパスワード", "アクセス制御リスト"], "cat": "technology", "c": 0, "d": "「多要素認証」は『知識情報（パスワード等）』『所持情報（スマホ等）』『生体情報（指紋等）』のうち異なる種類を2つ以上組み合わせて本人確認をする方式。パスワードが漏れただけでは突破されにくくなる。"}, {"q": "変化の激しい状況で意思決定を迅速に行うためのフレームワークで、「観察→情勢判断→意思決定→行動」というサイクルを高速に繰り返す経営管理手法として、最も適切なものはどれか。", "a": ["OODAループ", "PDCAサイクル", "バランススコアカード", "PPM(プロダクト・ポートフォリオ・マネジメント)"], "cat": "strategy", "c": 0, "d": "OODAループは、観察・情勢判断・意思決定・行動という4段階を素早く繰り返すことで、変化への対応力を高める意思決定モデルである。もともとは軍事戦略の分野で生まれた考え方だが、現在では不確実性の高いビジネスの現場でも活用されている。"}, {"q": "企業の業績を財務の視点だけでなく、顧客、内部ビジネスプロセス、学習と成長という四つの視点から評価し、戦略を具体的な行動計画へ落とし込むための経営管理手法として、最も適切なものはどれか。", "a": ["バランススコアカード", "SWOT分析", "ファイブフォース分析", "ベンチマーキング"], "cat": "strategy", "c": 0, "d": "バランススコアカードは、財務・顧客・内部ビジネスプロセス・学習と成長という四つの視点から目標と評価指標を設定し、企業のビジョンや戦略を現場の行動につなげていく手法である。財務指標だけでは見えにくい将来の成長力もあわせて把握できる点に特徴がある。"}, {"q": "製造、営業、経理などの業務の種類ごとに部門を編成する組織形態であり、専門性を高めやすい一方で部門間の連携に時間がかかりやすいものとして、最も適切なものはどれか。", "a": ["職能別組織", "事業部制組織", "マトリックス組織", "カンパニー制組織"], "cat": "strategy", "c": 0, "d": "職能別組織は、製造・営業・人事・経理といった機能ごとに部門を分ける組織形態で、業務ごとに専門知識やノウハウを蓄積しやすい利点がある。反面、部門をまたぐ意思決定や情報共有には時間がかかりやすいという弱点も併せ持つ。"}, {"q": "製品や地域、顧客層などの単位で事業部を設け、各事業部が製造・販売・開発などの機能を独自に持ち、業績の責任を負う組織形態として、最も適切なものはどれか。", "a": ["事業部制組織", "職能別組織", "マトリックス組織", "持株会社"], "cat": "strategy", "c": 0, "d": "事業部制組織は、製品ラインや地域、顧客層などを軸に編成された事業部ごとに損益責任を持たせる組織形態である。市場の変化に応じた意思決定を各事業部で迅速に行える半面、機能が事業部ごとに重複しコストが増えやすい面もある。"}, {"q": "職能別の指揮系統とプロジェクトや製品別の指揮系統を組み合わせ、従業員が複数の上司から指示を受ける形になる組織形態として、最も適切なものはどれか。", "a": ["マトリックス組織", "職能別組織", "事業部制組織", "フラット組織"], "cat": "strategy", "c": 0, "d": "マトリックス組織は、機能軸(職能別の系統)とプロジェクトや製品軸を掛け合わせて編成する組織形態で、従業員は職能部門の上司とプロジェクト責任者という複数の指揮命令系統のもとで働く。人材や資源を柔軟に配分しやすい一方、指示系統が複雑になりやすい点には注意が必要である。"}, {"q": "他の会社の株式を保有することによって、その会社の事業活動を支配・管理することを主な目的とする会社形態として、最も適切なものはどれか。", "a": ["持株会社", "合弁会社", "特例子会社", "連結子会社"], "cat": "strategy", "c": 0, "d": "持株会社は、自らは製造や販売といった事業をほとんど行わず、複数の子会社の株式を保有してグループ全体の経営戦略の統括や管理を担う会社である。グループ経営の効率化や、M&Aを通じた事業再編を進めやすくする狙いで採用されることが多い。"}, {"q": "企業内に蓄積された販売実績や顧客データなどを収集・分析し、グラフやダッシュボードとして可視化することで経営判断を支援するソフトウェアとして、最も適切なものはどれか。", "a": ["BI(ビジネスインテリジェンス)ツール", "RPAツール", "ERPパッケージ", "グループウェア"], "cat": "strategy", "c": 0, "d": "BIツールは、社内外に散在するさまざまなデータを集約・分析し、その結果をグラフやダッシュボードの形でわかりやすく示すことで、経営者や管理者の意思決定を支援するソフトウェアである。データに基づいた経営判断を後押しする道具として、多くの企業で活用が進んでいる。"}, {"q": "データの大小や強弱を、数値の代わりに色の濃淡や配色によって二次元の表やマップ上に表現する可視化手法として、最も適切なものはどれか。", "a": ["ヒートマップ", "散布図", "パレート図", "レーダーチャート"], "cat": "strategy", "c": 0, "d": "ヒートマップは、値の大きさを色の濃淡や色相の違いで視覚的に表すグラフであり、Webサイト上で利用者がよくクリックする箇所や、地域ごとの売上の高低といった傾向を一目で把握したいときに用いられる。数値の一覧表よりも直感的にデータの偏りをつかめる点が強みである。"}, {"q": "ある時点における企業の資産、負債、純資産の状況を示し、企業の財政状態を把握するための財務諸表として、最も適切なものはどれか。", "a": ["貸借対照表", "損益計算書", "キャッシュフロー計算書", "株主資本等変動計算書"], "cat": "strategy", "c": 0, "d": "貸借対照表は、決算日などある特定時点における企業の資産・負債・純資産の内訳を一覧にした財務諸表で、企業がどのように資金を調達し、それをどのような形で保有しているかを示している。左右(または上下)の合計額が必ず一致することから、バランスシートとも呼ばれる。"}, {"q": "一定期間における企業の収益と費用を対比させ、その期間の経営成績を示す財務諸表として、最も適切なものはどれか。", "a": ["損益計算書", "貸借対照表", "キャッシュフロー計算書", "有価証券報告書"], "cat": "strategy", "c": 0, "d": "損益計算書は、一会計期間に生じた売上高などの収益と、それに対応する費用を対比させ、営業利益や経常利益、当期純利益といった形で経営成績を示す財務諸表である。ある時点の財政状態を示す貸借対照表に対し、損益計算書は一定期間の成果を表す点が異なる。"}, {"q": "投じた費用に対してどれだけの利益を得られたかを示す指標であり、投資施策の効率性を比較・評価する際に用いられるものとして、最も適切なものはどれか。", "a": ["ROI(投資利益率)", "ROE(自己資本利益率)", "ROA(総資産利益率)", "自己資本比率"], "cat": "strategy", "c": 0, "d": "ROIは、投資額に対して得られた利益の割合を示す指標であり、値が大きいほど投資の効率が良いと判断できる。広告施策やシステム導入など、性質の異なる複数の投資案の費用対効果を比較する場面でよく用いられる。"}, {"q": "一定期間における現金及び現金同等物の増減を、営業活動・投資活動・財務活動という三つの区分に分けて示す財務諸表として、最も適切なものはどれか。", "a": ["キャッシュフロー計算書", "貸借対照表", "損益計算書", "事業報告書"], "cat": "strategy", "c": 0, "d": "キャッシュフロー計算書は、一会計期間における現金の増減を営業活動・投資活動・財務活動の三区分に分けて示す財務諸表である。損益計算書上は黒字であっても手元の現金が不足してしまう、いわゆる黒字倒産の兆候を把握するのにも役立つ。"}, {"q": "企業が利益の追求だけでなく、法令遵守や環境保全、地域社会への貢献など、社会の一員としての責任を自主的に果たしていく活動として、最も適切なものはどれか。", "a": ["CSR(企業の社会的責任)", "CSV(共有価値の創造)", "IR(インベスターリレーションズ)", "CI(コーポレートアイデンティティ)"], "cat": "strategy", "c": 0, "d": "CSRは、企業が事業活動を通じて利益を追求するだけでなく、環境保全や地域社会への貢献、従業員への配慮といった社会的な責任を自主的に果たしていく考え方や活動を指す。こうした取り組みは、長期的には企業の信頼性やブランド価値の向上にもつながると考えられている。"}, {"q": "株主や取締役会などが経営者の業務執行を監視・統制し、不正の防止や経営の透明性・健全性を確保するための仕組みとして、最も適切なものはどれか。", "a": ["コーポレートガバナンス", "リスクマネジメント", "アカウンタビリティ", "インサイダー取引規制"], "cat": "strategy", "c": 0, "d": "コーポレートガバナンスは、株主総会や取締役会、監査役などが経営者の業務執行を監視し、経営の透明性や健全性を確保するための仕組みを指す。不祥事を未然に防ぎ、株主をはじめとする利害関係者からの信頼を保つことを目的として整備が進められている。"}, {"q": "実際の業務を通じて、上司や先輩社員が部下に対して仕事に必要な知識や技能を指導する人材育成の方法として、最も適切なものはどれか。", "a": ["OJT", "Off-JT", "eラーニング", "ジョブローテーション"], "cat": "strategy", "c": 0, "d": "OJTは、実際の職場や業務の中で、上司や先輩社員が部下に対して具体的な仕事を通じて知識やスキルを指導する育成手法である。実務に即した内容を身につけやすい一方、指導する側の力量によって教育の効果にばらつきが出やすいという面もある。"}, {"q": "著作権法における著作物の著作権(財産権)の保護期間として、原則で最も適切なものはどれか。", "a": ["著作者の死後70年", "著作者の死後50年", "著作物の公表後20年", "著作物の創作後30年"], "cat": "strategy", "c": 0, "d": "著作権(財産権)の保護期間は、原則として著作者の死後70年を経過するまでとされている。かつては死後50年であったが法改正で延長された経緯があり、映画の著作物のように公表を起算点とする例外規定も設けられている。"}, {"q": "著作者が自分の著作物に対して持つ、公表するかどうかを決める権利、氏名を表示するかどうかを決める権利、内容を無断で改変されない権利などをまとめて何というか。", "a": ["著作者人格権", "著作権(財産権)", "著作隣接権", "パブリシティ権"], "cat": "strategy", "c": 0, "d": "著作者人格権は、公表権・氏名表示権・同一性保持権など、著作者の人格的な利益を保護するための権利である。財産権としての著作権とは異なり、他人に譲渡することができない点が特徴である。"}, {"q": "特許権、実用新案権、意匠権、商標権の四つをまとめて呼ぶ名称であり、いずれも特許庁への出願・登録によって権利が発生するものとして、最も適切なものはどれか。", "a": ["産業財産権", "知的財産権", "著作権", "不正競争防止権"], "cat": "strategy", "c": 0, "d": "産業財産権は、特許権・実用新案権・意匠権・商標権の総称であり、特許庁に出願し登録を受けることではじめて権利が発生する。創作と同時に権利が発生する著作権とは異なり、産業財産権は登録主義を採っている点が特徴である。"}, {"q": "商品やサービスに使用するマーク、ロゴ、ネーミングなどを、他社の商品・サービスと区別するための目印として保護する権利として、最も適切なものはどれか。", "a": ["商標権", "意匠権", "著作権", "商号権"], "cat": "strategy", "c": 0, "d": "商標権は、商品やサービスに用いるマークやロゴ、名称などを、自社のものであると識別するための標識として保護する権利であり、特許庁への出願・登録によって発生する。紛らわしい商標を他社が無断で使用することを防ぎ、ブランドへの信用を守る役割を持つ。"}, {"q": "工業製品などの形状、模様、色彩といったデザインを保護の対象とし、模倣品の製造・販売を防ぐための権利として、最も適切なものはどれか。", "a": ["意匠権", "商標権", "著作権", "実用新案権"], "cat": "strategy", "c": 0, "d": "意匠権は、製品の形状や模様、色彩の組み合わせなど、物のデザインを保護する権利であり、特許庁への出願・登録によって発生する。優れたデザインを模倣した類似品の製造・販売を防ぎ、製品開発への投資を保護する役割を担っている。"}, {"q": "他人のIDやパスワードを無断で使用してコンピュータシステムに不正にログインする行為などを禁止する法律として、最も適切なものはどれか。", "a": ["不正アクセス禁止法", "サイバーセキュリティ基本法", "不正競争防止法", "電子署名法"], "cat": "strategy", "c": 0, "d": "不正アクセス禁止法は、他人のIDやパスワードを無断で用いて権限のないシステムにログインする行為や、そのような不正アクセスを助長する行為などを禁止する法律である。ネットワークを通じた情報システムへの侵入を防ぎ、電子社会の秩序を維持することを目的としている。"}, {"q": "労働基準法で定められた法定労働時間を超えて従業員に時間外労働をさせる場合に、労使間であらかじめ締結し、労働基準監督署へ届け出る必要がある労使協定として、最も適切なものはどれか。", "a": ["36(サブロク)協定", "労働協約", "就業規則", "労働者派遣契約"], "cat": "strategy", "c": 0, "d": "36協定は、労働基準法第36条に基づき、法定労働時間を超える時間外労働や休日労働をさせる場合に、使用者が労働者側と締結して労働基準監督署に届け出る労使協定である。この協定を結ばずに法定労働時間を超えて働かせることは、原則として労働基準法違反となる。"}, {"q": "派遣元事業主と雇用契約を結んだ労働者が、派遣先企業の指揮命令を受けて働く形態を定めた法律であり、労働者を指揮命令する会社と雇用契約を結ぶ会社が異なる点が請負契約との違いとなっているものとして、最も適切なものはどれか。", "a": ["労働者派遣法", "職業安定法", "下請法", "労働契約法"], "cat": "strategy", "c": 0, "d": "労働者派遣法は、労働者派遣事業の適正な運営や派遣労働者の保護を目的とした法律で、派遣労働者は派遣元と雇用契約を結びながら、実際の業務指示は派遣先企業から受ける点が特徴である。これに対し請負契約では、発注元企業が請負元の労働者に直接指揮命令を行うことは認められていない。"}, {"q": "発注元である親事業者が、下請事業者に対して代金の支払いを不当に遅らせたり、一方的に代金を減額したりすることなどを禁止し、公正な取引を確保するための法律として、最も適切なものはどれか。", "a": ["下請法", "独占禁止法", "特定商取引法", "労働者派遣法"], "cat": "strategy", "c": 0, "d": "下請法は、親事業者による下請事業者への代金の支払遅延、不当な減額、受領拒否などを禁止し、立場の弱い下請事業者を保護するための法律である。独占禁止法を補完する位置づけとして、取引上優位な立場にある企業による不公正な行為を防ぐ役割を持つ。"}, {"q": "鉱工業製品の品質や性能、試験方法などに関する日本国内の標準規格であり、産業標準化法に基づいて制定されるものとして、最も適切なものはどれか。", "a": ["JIS(日本産業規格)", "ISO(国際標準化機構の規格)", "IEC(国際電気標準会議の規格)", "PSEマーク基準"], "cat": "strategy", "c": 0, "d": "JISは、鉱工業製品の寸法や品質、試験方法などについて定めた日本国内の標準規格であり、産業標準化法に基づいて制定される。製品の互換性や品質を確保して取引を円滑にする目的で、部品の規格から情報技術分野の用語まで幅広い分野をカバーしている。"}, {"q": "組織が提供する製品やサービスの品質を継続的に維持・改善するための仕組みに関する国際規格として、最も適切なものはどれか。", "a": ["ISO9001", "ISO14001", "ISO27001", "ISO26000"], "cat": "strategy", "c": 0, "d": "ISO9001は、品質マネジメントシステムに関する国際規格であり、顧客満足の向上や業務プロセスの継続的な改善を図る仕組みを組織内に構築するための要求事項を定めている。業種を問わず多くの企業がこの規格の認証を取得し、品質管理体制を対外的に示す手段として活用している。"}, {"q": "組織の事業活動が環境に与える負荷を低減し、環境保全に関する取り組みを継続的に改善していくための仕組みに関する国際規格として、最も適切なものはどれか。", "a": ["ISO14001", "ISO9001", "ISO22000", "ISO45001"], "cat": "strategy", "c": 0, "d": "ISO14001は、環境マネジメントシステムに関する国際規格であり、組織が自らの活動による環境への影響を把握し、環境負荷の低減や関連法令の遵守に向けた取り組みを継続的に改善していく仕組みを定めている。認証の取得は、企業の環境への配慮を対外的に示す手段としても用いられている。"}, {"q": "秘密として管理されている顧客名簿や製造ノウハウなどの「営業秘密」を不正に取得・使用・開示する行為などを禁止し、公正な事業者間競争を確保するための法律として、最も適切なものはどれか。", "a": ["不正競争防止法", "不正アクセス禁止法", "個人情報保護法", "下請法"], "cat": "strategy", "c": 0, "d": "不正競争防止法は、他社の商品表示を無断で模倣する行為や営業秘密の不正利用など、公正な競争を害するさまざまな行為を規制する法律である。企業が管理する技術情報や顧客情報が「営業秘密」として保護されるには、秘密として厳重に管理されていることなど一定の要件を満たす必要がある。"}, {"q": "製品の欠陥によって生命、身体または財産に損害が生じた場合に、被害者が製造業者の過失を証明しなくても損害賠償を求めることができるようにした法律として、最も適切なものはどれか。", "a": ["製造物責任法(PL法)", "消費者契約法", "特定商取引法", "下請法"], "cat": "strategy", "c": 0, "d": "製造物責任法(PL法)は、製品の欠陥によって消費者に損害が生じた場合、被害者が製造業者の過失を立証しなくても、製品に欠陥があったことを示せば損害賠償を請求できるようにした法律である。専門知識に乏しい消費者であっても、被害の救済を受けやすくすることを狙いとしている。"}, {"q": "使用者が労働者に支払う賃金について、都道府県ごとなどに定められた最低限度の金額を下回ってはならないと定めた法律として、最も適切なものはどれか。", "a": ["最低賃金法", "労働基準法", "労働契約法", "男女雇用機会均等法"], "cat": "strategy", "c": 0, "d": "最低賃金法は、労働者の生活の安定を図るため、使用者が支払う賃金の最低額を保障する法律であり、都道府県ごとに定められる地域別最低賃金や、特定の産業に適用される特定最低賃金がある。この最低額を下回る賃金しか支払わない場合、使用者には罰則が科されることもある。"}, {"q": "「プロダクトポートフォリオマネジメント（PPM）」において、市場成長率は低いものの自社の市場占有率が高く、大きな追加投資をしなくても安定した資金を生み出す事業の分類として最も適切なのはどれか。", "a": ["金のなる木", "花形", "問題児", "負け犬"], "cat": "strategy", "c": 0, "d": "金のなる木は、市場の伸びは鈍化しているが自社シェアが高いため、新規投資をあまり必要とせず安定的に利益を生み出す事業を指す。ここで得られた資金を、成長性の高い花形や問題児への投資に振り向けるという考え方がPPMの基本である。"}, {"q": "マーケティングミックスを検討する際に用いられる「4P」の4つの要素の組み合わせとして最も適切なのはどれか。", "a": ["製品・価格・流通・販売促進", "製品・価格・顧客・競合", "強み・弱み・機会・脅威", "顧客価値・コスト・利便性・コミュニケーション"], "cat": "strategy", "c": 0, "d": "4Pは企業側の視点でマーケティング施策を整理するフレームワークで、Product（製品）、Price（価格）、Place（流通）、Promotion（販売促進）の頭文字をとったものである。顧客視点で捉え直した4C（Customer value、Cost、Convenience、Communication）と対で押さえておくと理解しやすい。"}, {"q": "企業が持続的な競争優位を築くために意識すべき「コアコンピタンス」の説明として最も適切なのはどれか。", "a": ["他社が容易に模倣できない、企業の中核となる強みや独自技術", "企業が保有する現金及び現金同等物の総額", "複数の企業が経営資源を出し合って設立する新会社", "市場全体に占める自社製品・サービスの割合"], "cat": "strategy", "c": 0, "d": "コアコンピタンスとは、長年の経験や技術の蓄積によって培われた、他社には簡単に真似できない企業独自の強みのことである。事業戦略を検討する際には、自社のコアコンピタンスを見極め、それを軸に事業を展開することが重要とされる。"}, {"q": "他社の株式取得や合併によって、その企業の経営権を獲得する経営手法を表す用語として最も適切なのはどれか。", "a": ["M&A", "MBO", "アライアンス", "フランチャイズ"], "cat": "strategy", "c": 0, "d": "M&Aはmergers and acquisitions（合併と買収）の略で、株式取得や事業の合併を通じて他社の経営資源や事業基盤を短期間で獲得する手法である。新規事業への参入や事業規模の拡大を迅速に進められる一方、統合後の組織や企業文化を融合させる難しさも伴う。"}, {"q": "複数の企業が、互いの独立性や資本関係を大きく変えないまま経営資源を持ち寄り、特定の事業分野で協力し合う関係を表す用語として最も適切なのはどれか。", "a": ["アライアンス", "M&A", "垂直統合", "コングロマリット化"], "cat": "strategy", "c": 0, "d": "アライアンスは、企業同士が資本の従属関係を伴わずに、技術力や販売網といった経営資源を相互に活用し合う協力関係のことである。単独では実現しにくい取り組みを、リスクを分散しながら進められる点が特徴である。"}, {"q": "商品名やロゴ、品質、顧客体験などを通じて自社製品・サービスの価値を高め、他社との差別化や顧客の信頼・愛着の獲得につなげる一連の取り組みを表す用語として最も適切なのはどれか。", "a": ["ブランド戦略", "プロダクトアウト", "マーチャンダイジング", "コモディティ化"], "cat": "strategy", "c": 0, "d": "ブランド戦略とは、ブランドの持つイメージや信頼性といった価値（ブランドエクイティ）を計画的に育て、価格競争に陥りにくい強い顧客基盤を築くための取り組みである。長期的な収益力の向上を狙う経営戦略の一つとして位置づけられる。"}, {"q": "新しい技術が登場してから成熟するまでの性能の推移を、横軸に時間、縦軸に性能をとって表すと、導入初期は緩やか、普及期は急激、成熟期には再び緩やかになるという形を描くという考え方として最も適切なのはどれか。", "a": ["技術のSカーブ", "プロダクトライフサイクル", "イノベーションのジレンマ", "キャズム理論"], "cat": "strategy", "c": 0, "d": "技術のSカーブは、ある技術の性能向上の推移を時間軸で追うとS字型の曲線を描くという考え方である。技術が成熟期に近づき曲線が緩やかになってきた段階は、次世代技術への切り替えを検討すべき時期の目安として利用される。"}, {"q": "研究開発によって生まれた技術力を、単なる技術の追求にとどめず、事業の成長や収益につなげることを重視する経営の考え方として最も適切なのはどれか。", "a": ["MOT（技術経営）", "BPR", "SFA", "ナレッジマネジメント"], "cat": "strategy", "c": 0, "d": "MOTは、優れた技術を持ちながら事業化に至らず埋もれてしまうことを防ぎ、技術を継続的な事業価値に転換していくための経営手法である。研究開発部門と事業部門が連携し、技術戦略と経営戦略を一体的に推進する点に特徴がある。"}, {"q": "自社の研究開発によって生み出した技術やアイデアを特許として権利化し、他社による模倣を防ぐとともに、ライセンス供与によって収益源とすることを狙う取り組みとして最も適切なのはどれか。", "a": ["特許戦略", "OEM", "プライベートブランド戦略", "事業の多角化"], "cat": "strategy", "c": 0, "d": "特許戦略は、自社の技術を特許権として保護することで競合他社の参入障壁を高めると同時に、他社へのライセンス供与によって新たな収益機会を生み出す取り組みである。技術力を事業の競争優位に直結させるMOTの中でも重要な要素の一つである。"}, {"q": "将来実現したい製品や技術の姿を見据え、そこに至るまでに必要な技術開発の内容や時期を時間軸に沿って示した図として最も適切なのはどれか。", "a": ["技術ロードマップ", "組織図", "WBS", "ガントチャート"], "cat": "strategy", "c": 0, "d": "技術ロードマップは、中長期的な技術開発の方向性を可視化し、いつまでにどのような技術を確立すべきかを関係者間で共有するための図である。研究開発への投資判断や、技術戦略を経営戦略と整合させる際の指針として活用される。"}, {"q": "自社の研究開発だけに頼らず、社外の技術やアイデア、大学や他企業の知見を積極的に取り入れることで、革新的な製品・サービスの創出を目指す考え方として最も適切なのはどれか。", "a": ["オープンイノベーション", "クローズドイノベーション", "リバースエンジニアリング", "ベンチマーキング"], "cat": "strategy", "c": 0, "d": "オープンイノベーションとは、自社内だけで研究開発を完結させる従来型の進め方に対し、外部組織との連携によって技術革新の幅やスピードを高めようとする考え方である。共同研究やベンチャー企業への出資などを通じて実践されることが多い。"}, {"q": "商品を販売した時点で、商品名・価格・数量・販売時刻などの情報を記録し、在庫管理や販売戦略の検討に活用する仕組みとして最も適切なのはどれか。", "a": ["POS（販売時点情報管理）システム", "EOS（電子発注システム）", "GPS", "RFID"], "cat": "strategy", "c": 0, "d": "POSシステムは、レジでのバーコード読み取りなどをきっかけに、いつ・何が・どれだけ売れたかという販売実績データをリアルタイムに収集する仕組みである。集めたデータは売れ筋商品の分析や発注量の最適化など、幅広い経営判断に活用される。"}, {"q": "インターネットを介した電子商取引のうち、企業が一般消費者を対象に商品やサービスを販売する取引形態を表す分類として最も適切なのはどれか。", "a": ["BtoC（Business to Consumer）", "BtoB（Business to Business）", "CtoC（Consumer to Consumer）", "BtoE（Business to Employee）"], "cat": "strategy", "c": 0, "d": "BtoCは、企業が一般消費者を対象に商品やサービスを販売する電子商取引の形態で、通販サイトでの買い物などが代表例である。企業間の取引はBtoB、個人間の取引はCtoCと呼び分けられ、取引を行う当事者の組み合わせによって分類される。"}, {"q": "企業間で発注書や請求書などの取引に関するデータを、あらかじめ定めた形式に従ってコンピュータ間で電子的にやり取りする仕組みとして最も適切なのはどれか。", "a": ["EDI(電子データ交換)", "POS", "SNS", "グループウェア"], "cat": "strategy", "c": 0, "d": "EDIは、受発注や見積り、請求といった取引に関する文書を、企業間で統一された形式に変換してネットワーク経由で電子的に交換する仕組みである。紙の書類のやり取りを省けるため、取引のスピードアップや入力ミスの削減につながる。"}, {"q": "工場の生産設備にセンサーを取り付けて稼働状況を常時収集し、異常の予兆を検知して保守に役立てる取り組みのように、様々な機器をネットワークにつないでデータを収集・活用する技術を表す用語として最も適切なのはどれか。", "a": ["IoT(Internet of Things)", "AI（人工知能）", "VR（仮想現実）", "ERP"], "cat": "strategy", "c": 0, "d": "IoTは、家電や産業機械、センサーなど様々な「モノ」をインターネットに接続し、データの収集や機器の遠隔制御を可能にする仕組みである。設備の稼働データを分析して故障の予兆を検知する保全活動など、幅広い業種で活用が進んでいる。"}, {"q": "家電製品や自動車、産業機械などの機器に内蔵され、その機器固有の制御や機能の実現に特化して動作するコンピュータシステムとして最も適切なのはどれか。", "a": ["組込みシステム", "汎用コンピュータ（メインフレーム）", "クラウドサービス", "グループウェア"], "cat": "strategy", "c": 0, "d": "組込みシステムは、様々な用途に使える汎用のパソコンとは異なり、特定の機器に内蔵されてその機器の制御に特化した処理を行うコンピュータシステムである。炊飯器のタイマー制御や自動車のエンジン制御など、身の回りの多くの製品に組み込まれている。"}, {"q": "工場の生産ラインで人に代わって部品の組み立てや溶接などの作業を行う産業用ロボットのように、ロボットの設計・製造・制御に関わる技術分野を表す用語として最も適切なのはどれか。", "a": ["ロボティクス", "メカトロニクス", "FA（ファクトリーオートメーション）", "シミュレーション技術"], "cat": "strategy", "c": 0, "d": "ロボティクスは、人の作業を代替・支援するロボットの設計、製造、制御に関する技術分野である。製造業における組立てや検査だけでなく、近年では物流や医療、家庭内の清掃ロボットなど、活用の場が広がっている。"}, {"q": "経営戦略・経営目標を実現するために、情報システムをどのように整備し活用していくかを定める全社的な方針として最も適切なのはどれか。", "a": ["情報システム戦略", "情報セキュリティポリシー", "システム化計画", "サービスレベル合意書（SLA）"], "cat": "strategy", "c": 0, "d": "情報システム戦略は、経営陣が掲げる経営戦略を踏まえて、情報システムの整備・活用の方向性を定めるものである。ここで示された方針をもとに、具体的な開発対象やおおまかな予算・スケジュールを定めるシステム化計画が策定されていく。"}, {"q": "企業全体の業務とシステムを、ビジネス・データ・アプリケーション・テクノロジという観点から統一的に整理し、全体最適化を図るための考え方や手法として最も適切なのはどれか。", "a": ["エンタープライズアーキテクチャ（EA）", "BPR", "SOA（サービス指向アーキテクチャ）", "ITガバナンス"], "cat": "strategy", "c": 0, "d": "エンタープライズアーキテクチャは、組織全体の業務とシステムの現状と将来のあるべき姿を、ビジネス・データ・アプリケーション・テクノロジの4つの体系で整理し、部分最適に陥りがちなシステム化を全体最適の観点から進めるための手法である。大規模な組織の情報システム整備で広く活用されている。"}, {"q": "既存の業務の進め方を前提とせず、業務プロセスや組織構造を根本から見直し、大幅な効率化や品質向上を図る取り組みとして最も適切なのはどれか。", "a": ["BPR（ビジネスプロセスリエンジニアリング）", "BPM（ビジネスプロセスマネジメント）", "PDCAサイクル", "ベンチマーキング"], "cat": "strategy", "c": 0, "d": "BPRは、既存の組織や業務手順にとらわれず、プロセス全体をゼロから設計し直すことで、コスト削減やスピード向上といった大きな業績改善を目指す取り組みである。小さな改善を継続的に積み重ねるBPMとは異なり、抜本的で一気に大きな変革を行う点が特徴である。"}, {"q": "業務プロセスを分析する際に、データの流れに着目して、業務やシステムにおける情報の発生源・処理・保管・出力先の関係を図式化する手法として最も適切なのはどれか。", "a": ["DFD（データフローダイアグラム）", "ER図", "状態遷移図", "特性要因図"], "cat": "strategy", "c": 0, "d": "DFDは、業務やシステムの中でデータがどこから発生し、どのように処理され、どこへ流れていくのかを、データの源泉・処理・データストア・データの流れを表す記号を用いて可視化する図法である。業務プロセスの現状分析や、システム化すべき範囲の検討に役立つ。"}, {"q": "顧客企業の業務要件に合わせて、情報システムの企画から設計、開発、導入までを一括して請け負う事業形態として最も適切なのはどれか。", "a": ["システムインテグレーション（SI）", "アウトソーシング", "ハウジングサービス", "エスクローサービス"], "cat": "strategy", "c": 0, "d": "システムインテグレーション（SI）は、顧客企業の課題や要望をもとに、システムの企画・設計から開発、導入までを、システムインテグレータと呼ばれる事業者が総合的に請け負うサービスである。顧客企業は自社で全ての工程を担う必要がなく、専門性の高い事業者の技術力を活用できる。"}, {"q": "自社の情報システムの運用や開発の一部あるいは全部を、社外の専門業者に委託する経営手法として最も適切なのはどれか。", "a": ["アウトソーシング", "システムインテグレーション", "インソーシング", "リエンジニアリング"], "cat": "strategy", "c": 0, "d": "アウトソーシングは、自社で行っていた業務やシステムの運用・保守などを外部の専門業者に委託し、コスト削減や自社の経営資源をコア業務に集中させることを狙う手法である。逆に、外部委託していた業務を自社に取り込むことはインソーシングと呼ばれる。"}, {"q": "経営戦略や情報システム戦略を踏まえ、どの業務をシステム化するか、開発の優先順位やおおまかな予算・スケジュールを定める、システム開発に着手する前段階の計画として最も適切なのはどれか。", "a": ["システム化計画", "要件定義", "移行計画", "プロジェクト憲章"], "cat": "strategy", "c": 0, "d": "システム化計画は、情報システム戦略に基づいて、システム化の対象業務や開発の優先順位、概算の予算・スケジュールなどを明確にする計画である。全社的な観点で立てる全体システム化計画と、個々のシステムを対象とする個別システム化計画に分けて策定されることが多い。"}, {"q": "システム開発の要件定義工程において明確にする「機能要件」の説明として最も適切なのはどれか。", "a": ["利用者の業務を遂行するためにシステムが備えるべき処理内容や入出力に関する要求", "システムの応答時間や可用性など、機能以外の品質に関する要求", "開発を委託する際の契約金額や納期に関する取り決め", "システムを操作する利用者に対する教育・研修の計画"], "cat": "strategy", "c": 0, "d": "機能要件とは、注文処理や在庫照会といった、システムが業務上実現すべき具体的な処理内容に関する要求のことである。要件定義工程では利用者へのヒアリングなどを通じて機能要件を明確化し、これが開発すべきシステムの仕様の土台となる。"}, {"q": "システムに求められる要件のうち、処理速度や稼働率、セキュリティ強度など、機能そのものではなくシステムの品質や制約に関する要求を表す用語として最も適切なのはどれか。", "a": ["非機能要件", "機能要件", "業務要件", "調達要件"], "cat": "strategy", "c": 0, "d": "非機能要件は、多数の同時アクセスに耐えられる性能、システムが止まらず稼働し続ける可用性、不正アクセスを防ぐセキュリティ強度など、機能以外の面からシステムに求められる品質水準を定めたものである。要件定義工程で機能要件と併せて明確にしておくことが、開発後の手戻りを防ぐ鍵となる。"}, {"q": "システムの調達に先立ち、発注先の候補となる事業者に対して、保有する技術力や製品・サービスに関する情報の提供を依頼する文書として最も適切なのはどれか。", "a": ["RFI（情報提供依頼書）", "RFP（提案依頼書）", "RFQ（見積依頼書）", "SLA（サービスレベル合意書)"], "cat": "strategy", "c": 0, "d": "RFIは、システム調達の初期段階で、発注先の候補となる複数の事業者に対し、保有する技術力や製品・サービスの概要といった情報の提供を依頼する文書である。ここで得られた情報をもとに調達方針を固めたうえで、具体的な提案を求めるRFPの作成に進むという流れが一般的である。"}, {"q": "調達したい製品やサービスの仕様がある程度固まった段階で、発注先の候補となる複数の事業者に対して費用の見積りを依頼する文書として最も適切なのはどれか。", "a": ["RFQ（見積依頼書）", "RFI（情報提供依頼書）", "RFP（提案依頼書）", "発注書"], "cat": "strategy", "c": 0, "d": "RFQは、調達したい製品やサービスの内容がある程度定まった段階で、複数の事業者に価格の見積りを依頼する文書である。RFIで情報を集め、RFPで具体的な提案を募ったうえで、最終的な価格比較のためにRFQを用いる進め方がとられることもある。"}, {"q": "システムの運用委託などにおいて、提供されるサービスの品質水準（稼働率や障害対応時間など）について、委託者と受託者の間であらかじめ合意しておく文書として最も適切なのはどれか。", "a": ["SLA（サービスレベル合意書）", "RFP（提案依頼書）", "検収書", "秘密保持契約（NDA）"], "cat": "strategy", "c": 0, "d": "SLAは、システムの運用・保守などのサービスを委託する際に、提供されるサービスの範囲や品質の目標値（稼働率、障害発生時の復旧時間など）を委託者と受託者の間で明文化して合意する文書である。合意した水準が守られているかを定期的に確認することで、サービス品質の維持・向上につなげる。"}, {"q": "システム開発において、利用者の業務内容や要望をヒアリングし、新しいシステムに求められる機能や性能を明確にする工程として最も適切なものはどれか。", "a": ["要件定義", "内部設計", "運用テスト", "リファクタリング"], "cat": "management", "c": 0, "d": "要件定義は、発注者側の業務目的や課題を整理し、システムに求められる機能・性能を明文化する工程である。この段階で決めた内容が以降の設計・開発全体の土台となるため、認識のずれがあると後工程で大きな手戻りにつながりやすい。"}, {"q": "システム開発の設計工程のうち、画面レイアウトや帳票の形式など、利用者から見える部分の仕様を定める工程として最も適切なものはどれか。", "a": ["外部設計", "内部設計", "プログラム設計", "要件定義"], "cat": "management", "c": 0, "d": "外部設計(基本設計)は、利用者の視点に立って画面や帳票、操作方法など目に見える部分の仕様を決める工程を指す。これに対し、システム内部の処理ロジックやデータ構造を決めるのは内部設計(詳細設計)であり、両者は役割が異なる。"}, {"q": "システム開発の設計工程のうち、外部設計で定めた内容をもとに、プログラム内部の処理の流れやデータ構造など、開発者側の視点で詳細を決める工程として最も適切なものはどれか。", "a": ["内部設計", "外部設計", "要件定義", "運用テスト"], "cat": "management", "c": 0, "d": "内部設計(詳細設計)は外部設計の内容を受けて、プログラムの内部処理やモジュール構成、データ構造など、利用者からは直接見えない部分の仕様を具体化する工程である。プログラマが実装しやすい形まで落とし込む点が特徴といえる。"}, {"q": "プログラムを構成する個々のモジュールや関数を対象に、単独で正しく動作するかを検証するテストとして最も適切なものはどれか。", "a": ["単体テスト", "結合テスト", "システムテスト", "運用テスト"], "cat": "management", "c": 0, "d": "単体テスト(ユニットテスト)は、モジュールや関数といった最小単位のプログラムを対象に、仕様どおりに動作するかを個別に確認するテストである。不具合をできるだけ早い段階で発見し、修正コストを抑える狙いがある。"}, {"q": "プログラムの内部構造を考慮せず、入力に対して仕様どおりの出力が得られるかどうかに着目してテストケースを設計する手法として最も適切なものはどれか。", "a": ["ブラックボックステスト", "ホワイトボックステスト", "結合テスト", "回帰テスト"], "cat": "management", "c": 0, "d": "ブラックボックステストは、プログラムの内部ロジックを見ずに、入力と出力の関係が仕様どおりであるかを確認するテスト手法である。利用者の視点に近い形で機能の正しさを検証できる点が特徴である。"}, {"q": "プログラムの内部構造に着目し、条件分岐やループなどのすべての処理経路が意図どおりに実行されるかを確認するテスト手法として最も適切なものはどれか。", "a": ["ホワイトボックステスト", "ブラックボックステスト", "運用テスト", "受入テスト"], "cat": "management", "c": 0, "d": "ホワイトボックステストは、プログラムの内部の処理経路(制御構造)に着目し、分岐条件やループなどが設計どおりに動作するかを確認する手法である。網羅率(カバレッジ)を指標として用いることが多い。"}, {"q": "プログラムやドキュメントの作成者自身が進行役となり、関係者とともに成果物を読み合わせながら、問題点を早期に発見しようとするレビュー手法として最も適切なものはどれか。", "a": ["ウォークスルー", "インスペクション", "リグレッションテスト", "ペアプログラミング"], "cat": "management", "c": 0, "d": "ウォークスルーは、作成者自身が主導して成果物を関係者とともに読み合わせ、誤りや改善点を早期に洗い出すレビュー技法である。堅苦しい進行手順を定めず、比較的気軽に実施できる点が特徴とされる。"}, {"q": "システム開発において、設計・開発・評価という一連の工程を小さな単位で繰り返しながら、少しずつシステムの完成度を高めていく開発モデルとして最も適切なものはどれか。", "a": ["スパイラルモデル", "ウォーターフォールモデル", "プロトタイピングモデル", "DevOps"], "cat": "management", "c": 0, "d": "スパイラルモデルは、システムをいくつかのサブシステムに分割し、設計・開発・評価のサイクルを繰り返しながら段階的に完成度を高めていく開発モデルである。繰り返しの中でリスクや問題点を早期に洗い出しやすいという利点がある。"}, {"q": "システム開発の早い段階で試作品を作成し、利用者に実際に操作してもらいながら要求を確認していく開発モデルとして最も適切なものはどれか。", "a": ["プロトタイピングモデル", "スパイラルモデル", "ウォーターフォールモデル", "DevOps"], "cat": "management", "c": 0, "d": "プロトタイピングモデルは、開発の初期段階で試作品(プロトタイプ)を作り、利用者からの評価やフィードバックを受けながら要求を明確にしていく手法である。完成後に「イメージと違った」という手戻りを減らす効果が期待できる。"}, {"q": "開発担当者と運用担当者が密接に連携し、開発から運用までを一体的かつ迅速に進めていく考え方や組織文化として最も適切なものはどれか。", "a": ["DevOps", "CMMI", "ITIL", "PMBOK"], "cat": "management", "c": 0, "d": "DevOpsは、Development(開発)とOperations(運用)を組み合わせた言葉で、開発と運用の担当者が協力し合い、システムのリリースや改善を継続的かつスピーディーに行う考え方を指す。自動化ツールの活用と組織文化の両面が重視される。"}, {"q": "開発者が変更したプログラムを頻繁に共通のリポジトリへ統合し、その都度ビルドやテストを自動的に実行することで、不具合を早期に検知しようとする手法として最も適切なものはどれか。", "a": ["継続的インテグレーション(CI)", "リファクタリング", "プロトタイピング", "ペアプログラミング"], "cat": "management", "c": 0, "d": "継続的インテグレーション(CI)は、開発者が変更したコードを頻繁に共通のリポジトリへ統合し、その都度自動でビルドとテストを実行する手法である。問題を小さいうちに発見でき、統合作業にかかる負担も軽減できる。"}, {"q": "プログラムの外部から見た動作(仕様)を変えずに、内部の構造をより分かりやすく整理し、保守性や可読性を高める作業として最も適切なものはどれか。", "a": ["リファクタリング", "デバッグ", "モジュール分割", "テスト駆動開発"], "cat": "management", "c": 0, "d": "リファクタリングは、ソフトウェアの機能自体は変えずに、コードの内部構造を整理・改善する作業を指す。読みやすく修正しやすいコードにすることで、将来の保守や機能追加をしやすくする狙いがある。"}, {"q": "プログラムの実装に先立ってテストコードを作成し、そのテストに合格することを確認しながら少しずつ実装を進めていく開発手法として最も適切なものはどれか。", "a": ["テスト駆動開発", "リファクタリング", "プロトタイピングモデル", "ウォーターフォールモデル"], "cat": "management", "c": 0, "d": "テスト駆動開発(TDD)は、まず期待する動作を表すテストコードを書き、それに通るように実装を行い、その後コードを整理するというサイクルを繰り返す開発手法である。仕様の明確化と品質の作り込みを同時に進められる。"}, {"q": "ビルドやテストを自動化した上で、いつでも本番環境へリリースできる状態を継続的に維持しておく開発手法として最も適切なものはどれか。", "a": ["継続的デリバリー", "継続的インテグレーション", "スパイラルモデル", "リファクタリング"], "cat": "management", "c": 0, "d": "継続的デリバリー(CD)は、コードの変更を自動的にビルド・テストし、常にリリース可能な状態を維持しておく手法である。実際の本番環境への反映までを自動化する場合は、継続的デプロイメントと呼んで区別されることがある。"}, {"q": "プロジェクトマネジメントに関する知識や手法を体系的にまとめた、世界的に広く参照されているガイドとして最も適切なものはどれか。", "a": ["PMBOK", "ITIL", "CMMI", "ISO 9001"], "cat": "management", "c": 0, "d": "PMBOKは、米国のプロジェクトマネジメント協会(PMI)がまとめた、プロジェクトマネジメントの知識体系を整理したガイドである。スコープやコスト、品質、リスクなど複数の管理領域について標準的な考え方や手法が示されている。"}, {"q": "プロジェクトで実施すべき作業の範囲や成果物を明確にし、あらかじめ決めた範囲を超えて作業が広がってしまうことを防ぐための管理として最も適切なものはどれか。", "a": ["スコープ管理", "コスト管理", "リスクマネジメント", "品質管理"], "cat": "management", "c": 0, "d": "スコープ管理は、プロジェクトで「何を行い、何を行わないか」という作業範囲や成果物を明確に定義し、それを維持・管理する活動である。範囲が曖昧なまま進めると、際限なく作業が増えるスコープクリープを招きやすい。"}, {"q": "プロジェクトの予算を見積もり、実績と比較しながら費用が計画どおりに収まるように管理する活動として最も適切なものはどれか。", "a": ["コスト管理", "スコープ管理", "品質管理", "リスクマネジメント"], "cat": "management", "c": 0, "d": "コスト管理は、プロジェクトに必要な費用を見積もって予算を設定し、実際の支出を計画と比較しながら管理していく活動である。予算超過を早期に把握し、必要な対策を打てるようにすることが目的とされる。"}, {"q": "プロジェクトの成果物が、あらかじめ定められた要求水準や基準を満たしているかどうかを確認し、必要な改善を行う活動として最も適切なものはどれか。", "a": ["品質管理", "スコープ管理", "コスト管理", "進捗管理"], "cat": "management", "c": 0, "d": "品質管理は、成果物が要求された品質基準を満たしているかを確認し、不足があれば改善につなげる活動である。プロジェクトマネジメントにおける代表的な管理領域の一つとして位置づけられている。"}, {"q": "プロジェクトの進行を妨げる可能性のある事象を洗い出し、その発生確率や影響度を評価した上で、対応策をあらかじめ検討しておく活動として最も適切なものはどれか。", "a": ["リスクマネジメント", "品質管理", "コスト管理", "課題管理"], "cat": "management", "c": 0, "d": "リスクマネジメントは、プロジェクトに悪影響を及ぼす可能性のある事象を事前に洗い出し、発生の可能性や影響の大きさを評価した上で、回避や軽減などの対応策を計画しておく活動である。"}, {"q": "プロジェクトの各作業について、開始日と終了日を横棒の長さで表し、作業の日程や進捗状況を視覚的に把握できるようにした図として最も適切なものはどれか。", "a": ["ガントチャート", "PERT図", "特性要因図", "WBS"], "cat": "management", "c": 0, "d": "ガントチャートは、縦軸に作業項目、横軸に日程をとり、各作業の期間を横棒で示した図表である。作業同士の日程の重なりや、プロジェクト全体の進捗状況をひと目で把握しやすいという特徴がある。"}, {"q": "プロジェクトを構成する一連の作業のうち、遅れがそのままプロジェクト全体の完了の遅れに直結する、最も長い所要期間の経路として最も適切なものはどれか。", "a": ["クリティカルパス", "ガントチャート", "スコープ", "マイルストーン"], "cat": "management", "c": 0, "d": "クリティカルパスは、プロジェクトの開始から終了までの作業経路のうち、所要時間が最も長くなる経路のことである。この経路上の作業が遅れると完了時期全体が遅れてしまうため、重点的な進捗管理が必要とされる。"}, {"q": "ITサービスマネジメントにおけるベストプラクティス(効果的な実践方法)を体系的にまとめた、世界的に広く利用されているフレームワークとして最も適切なものはどれか。", "a": ["ITIL", "PMBOK", "CMMI", "COBIT"], "cat": "management", "c": 0, "d": "ITILは、ITサービスの計画・設計・提供・運用・改善に関するベストプラクティスをまとめたフレームワークである。多くの企業が、ITサービスマネジメントの体制を整備する際の参考として活用している。"}, {"q": "システムの停止や性能低下などサービスに支障が生じた際に、できるだけ早くサービスを復旧させることを目的とした活動として最も適切なものはどれか。", "a": ["インシデント管理", "問題管理", "変更管理", "構成管理"], "cat": "management", "c": 0, "d": "インシデント管理は、発生したサービスの中断や品質低下に対して、暫定的な対応も含めて迅速にサービスを復旧させることを目的とした活動である。根本原因の追究は別に行う問題管理が担う役割となる。"}, {"q": "インシデントの背後にある根本原因を調査・特定し、同じ障害が繰り返し発生しないよう恒久的な対策を検討する活動として最も適切なものはどれか。", "a": ["問題管理", "インシデント管理", "変更管理", "リスクマネジメント"], "cat": "management", "c": 0, "d": "問題管理は、インシデントを引き起こしている根本原因を突き止め、恒久的な解決策や再発防止策を検討する活動である。目の前の障害をひとまず収めるインシデント管理とは目的が異なる点に注意が必要である。"}, {"q": "システムへの変更が及ぼす影響やリスクをあらかじめ評価し、承認を得た上で計画的かつ統制のとれた方法で変更を実施するための活動として最も適切なものはどれか。", "a": ["変更管理", "インシデント管理", "問題管理", "キャパシティ管理"], "cat": "management", "c": 0, "d": "変更管理は、システムやサービスに対する変更について、実施前に影響やリスクを評価し、関係者の承認を得た上で計画的に実施する活動である。無秩序な変更によって新たな障害が発生するのを防ぐことを目的としている。"}, {"q": "将来の利用状況の変化を見据えて、システムの処理能力や記憶容量などの資源が業務に必要な水準を満たし続けられるように管理する活動として最も適切なものはどれか。", "a": ["キャパシティ管理", "可用性管理", "変更管理", "インシデント管理"], "cat": "management", "c": 0, "d": "キャパシティ管理は、現在および将来のサービス需要を予測し、システムの処理能力や記憶容量などの資源が過不足なく確保されるよう管理する活動である。資源不足による性能低下と、過剰な設備投資の両方を防ぐことを目指す。"}, {"q": "利用者が必要なときにシステムやサービスを継続して利用できる状態を維持するために、稼働率などを管理する活動として最も適切なものはどれか。", "a": ["可用性管理", "キャパシティ管理", "変更管理", "構成管理"], "cat": "management", "c": 0, "d": "可用性管理は、システムやサービスを利用者が必要なときに使い続けられるように、稼働率や障害からの復旧にかかる時間などを管理し、維持・向上させる活動である。目標となる水準は契約などで取り決められることが多い。"}, {"q": "サーバ室の空調・電源設備やオフィス環境など、ITサービスを支える施設・設備を計画的に維持管理する活動として最も適切なものはどれか。", "a": ["ファシリティマネジメント", "キャパシティ管理", "可用性管理", "インシデント管理"], "cat": "management", "c": 0, "d": "ファシリティマネジメントは、サーバ室の空調・電源・什器といった施設や設備を、コストや快適性、安全性の観点から計画的に維持・管理する活動である。ITサービスを安定して提供するための物理的な基盤を支える役割を担う。"}, {"q": "システム監査を実施するにあたり、監査の目的や対象範囲、実施時期、必要な体制などをあらかじめ具体的に定めておく作業として最も適切なものはどれか。", "a": ["監査計画の策定", "監査報告", "フォローアップ", "予備調査"], "cat": "management", "c": 0, "d": "監査計画の策定は、システム監査を効果的かつ効率的に行うために、監査の目的や対象範囲、実施時期、担当者の体制などを事前に具体的に定めておく作業である。この計画に沿って、その後の監査手続が進められていく。"}, {"q": "システム監査人が監査の結論を導き出すために収集する、記録の閲覧結果やヒアリング結果などの客観的な資料や事実として最も適切なものはどれか。", "a": ["監査証拠", "監査調書", "監査計画", "内部統制"], "cat": "management", "c": 0, "d": "監査証拠は、監査人が監査意見を形成するための根拠となる、客観的で信頼性のある資料や事実のことである。関連する規程や記録の閲覧、担当者への質問などを通じて収集される。"}, {"q": "組織が業務を適正かつ効率的に遂行し、財務報告の信頼性を確保するために、経営者や従業員が構築・運用する一連の仕組みとして最も適切なものはどれか。", "a": ["内部統制", "システム監査", "リスクマネジメント", "コンプライアンス研修"], "cat": "management", "c": 0, "d": "内部統制は、業務の有効性・効率性の確保や財務報告の信頼性、法令遵守などを目的として、組織内に整備・運用される一連の仕組みや手続のことである。システム監査は、この内部統制が有効に機能しているかを検証する活動の一つに位置づけられる。"}, {"q": "システム監査の結果として発見された問題点や改善提案などを取りまとめ、被監査部門の責任者や経営者に文書で伝達する活動として最も適切なものはどれか。", "a": ["監査報告", "監査計画", "フォローアップ", "予備調査"], "cat": "management", "c": 0, "d": "監査報告は、システム監査で明らかになった問題点や評価結果、改善のための提案などを監査報告書としてまとめ、経営者や関係部門に伝える活動である。この報告を受けて、その後の改善に向けた対応が検討されていく。"}, {"q": "システム監査で指摘された問題点について、その後改善が確実に実施されているかどうかを監査人が確認する活動として最も適切なものはどれか。", "a": ["フォローアップ", "予備調査", "監査計画", "内部統制"], "cat": "management", "c": 0, "d": "フォローアップは、監査で指摘した改善事項が、その後実際に是正されているかどうかを監査人が確認する活動である。指摘のしっぱなしにせず改善の実効性を確かめることで、監査全体の効果を高める役割を持つ。"}, {"q": "システム監査を客観的かつ公正に行うために、監査人が被監査部門から独立した立場であることが求められる原則として最も適切なものはどれか。", "a": ["独立性", "内部統制", "可用性", "機密性"], "cat": "management", "c": 0, "d": "システム監査における独立性とは、監査人が被監査部門の業務に利害関係を持たず、外部からの干渉を受けない立場で監査を行うべきという原則である。監査人自身が開発や運用に深く関与していると、公正な判断が難しくなるおそれがある。"}, {"q": "16進数の「2C」を10進数で表すとどれか。", "a": ["44", "34", "42", "50"], "cat": "technology", "c": 0, "d": "16進数は1桁が16進法の重みを持ち、2Cは2×16+12=44と計算できる。16進数の各桁は0〜9とA〜F(10〜15)で表され、Cは12を意味する。基数変換の基本は各桁の値に基数のべき乗を掛けて合計することにある。"}, {"q": "8ビットの2進数で10進数の-5を2の補数表現で表すとどれか。", "a": ["11111011", "11111010", "00000101", "11111100"], "cat": "technology", "c": 0, "d": "2の補数は、絶対値のビットをすべて反転させ、さらに1を加えて求める。5は00000101なので、反転すると11111010、これに1を足すと11111011となり、これが-5の2の補数表現である。コンピュータは減算をこの2の補数を使った加算に置き換えて処理している。"}, {"q": "2つの入力AとBのうち、少なくとも一方が1であれば出力が1になる論理演算はどれか。", "a": ["論理和(OR)", "論理積(AND)", "論理否定(NOT)", "排他的論理和(XOR)"], "cat": "technology", "c": 0, "d": "論理和(OR)は、入力のいずれか一方でも1であれば結果が1になる演算で、両方が0のときだけ0になる。論理積(AND)が両方とも1のときのみ1になるのとは対照的な性質を持つ。デジタル回路やプログラムの条件式でもよく使われる基本演算である。"}, {"q": "入力が1のときは0を、入力が0のときは1を出力する論理演算はどれか。", "a": ["論理否定(NOT)", "論理和(OR)", "論理積(AND)", "排他的論理和(XOR)"], "cat": "technology", "c": 0, "d": "論理否定(NOT)は入力の値を反転させる演算で、1入力1出力の単純な回路として構成される。ORやANDが2つの入力を必要とするのに対し、NOTは1つの入力だけで結果が決まる点が特徴だ。プログラムの条件判定における「〜でない」という否定条件に対応する。"}, {"q": "2つの入力AとBの値が異なるときにだけ出力が1になり、同じときは0になる論理演算はどれか。", "a": ["排他的論理和(XOR)", "論理和(OR)", "論理積(AND)", "論理否定(NOT)"], "cat": "technology", "c": 0, "d": "排他的論理和(XOR)は、2つの入力が食い違っているときだけ1を出力する演算で、両方1または両方0のときは0になる。論理和(OR)は両方1でも1を出力するため、XORとは違う結果になる点に注意が必要だ。誤り検出やデータの一致・不一致判定などにも応用される。"}, {"q": "集合Aと集合Bの両方に共通して含まれる要素からなる集合を表す演算はどれか。", "a": ["積集合(A∩B)", "和集合(A∪B)", "補集合", "差集合"], "cat": "technology", "c": 0, "d": "積集合は、2つの集合の共通部分、つまりAにもBにも含まれる要素だけを集めたものを指し、記号A∩Bで表す。これに対して和集合(A∪B)は、AまたはBのどちらかに含まれる要素をすべて集めたものである。ベン図では2つの円が重なる部分が積集合にあたる。"}, {"q": "あるデータ群を大きさの順に並べたとき、ちょうど中央に位置する値のことを何というか。", "a": ["中央値(メジアン)", "平均値", "最頻値(モード)", "標準偏差"], "cat": "technology", "c": 0, "d": "中央値は、データを小さい順(または大きい順)に並べたときにちょうど真ん中にくる値のことで、極端に大きい・小さい値の影響を受けにくい代表値である。平均値はすべての値を合計してデータ数で割った値であり、外れ値の影響を受けやすい点が中央値と異なる。データ件数が偶数のときは中央の2つの値の平均を中央値とする。"}, {"q": "窓口やサーバへの客(要求)の到着や処理の様子を数学的にモデル化し、待ち時間や混雑度を分析する理論を何というか。", "a": ["待ち行列理論", "線形計画法", "ゲーム理論", "シミュレーション理論"], "cat": "technology", "c": 0, "d": "待ち行列理論は、窓口に並ぶ客やサーバに届く処理要求の到着間隔・サービスにかかる時間などをもとに、平均待ち時間や行列の長さを見積もるための理論である。コールセンターの受付窓口数や、システムの処理能力を検討する際の基礎となる考え方だ。到着率とサービス率のバランスによって混雑の度合いが変わってくる。"}, {"q": "フローチャート(流れ図)において、条件による処理の分岐を表す記号はどれか。", "a": ["ひし形(菱形)", "長方形", "平行四辺形", "楕円"], "cat": "technology", "c": 0, "d": "フローチャートでは、条件を判定して処理の流れを枝分かれさせる箇所をひし形の記号で表す。長方形は具体的な処理内容、平行四辺形はデータの入力や出力、楕円は処理の開始・終了を表す記号として使い分けられている。記号の意味を統一することで、誰が見ても処理の流れを読み取れるようにしている。"}, {"q": "最後に格納したデータを最初に取り出す、LIFO(Last In First Out)方式のデータ構造はどれか。", "a": ["スタック", "キュー", "リスト", "配列"], "cat": "technology", "c": 0, "d": "スタックは、データを積み重ねるようにため込み、後から入れたデータほど先に取り出されるLIFO方式のデータ構造である。関数呼び出しの管理やブラウザの「戻る」機能など、直前の状態を順にさかのぼる処理によく利用される。データの追加と取り出しは、いずれもスタックの一方の端(トップ)だけで行われる。"}, {"q": "最初に格納したデータを最初に取り出す、FIFO(First In First Out)方式のデータ構造はどれか。", "a": ["キュー", "スタック", "ヒープ", "木構造"], "cat": "technology", "c": 0, "d": "キューは、データを入れた順番どおりに取り出すFIFO方式のデータ構造で、行列に並ぶ様子にたとえられる。データの追加は一方の端(後端)から、取り出しはもう一方の端(先端)から行われる点がスタックとの違いだ。印刷待ちの順番管理や処理要求の順序管理などに利用される。"}, {"q": "配列の先頭から末尾に向かって、データを1つずつ順番に調べて目的の値を見つける探索方法はどれか。", "a": ["線形探索", "二分探索", "ハッシュ探索", "二分木探索"], "cat": "technology", "c": 0, "d": "線形探索は、先頭から順番に1件ずつデータを比較していき、目的の値が見つかるか末尾に達するまで続ける単純な探索方法である。データが整列されていなくても使えるという利点があるが、データ件数が多いほど比較回数が増え効率は落ちる。実装が簡単なため、小規模なデータの探索によく使われる。"}, {"q": "あらかじめ昇順または降順に整列されたデータに対して、探索範囲を半分ずつに絞り込みながら目的の値を探す方法はどれか。", "a": ["二分探索", "線形探索", "バブルソート", "クイックソート"], "cat": "technology", "c": 0, "d": "二分探索は、整列済みのデータの中央値と目的の値を比較し、大小関係に応じて探索範囲を半分に絞り込むことを繰り返す方法である。線形探索に比べて少ない比較回数で目的のデータにたどり着けるため効率が良い。ただし、あらかじめデータが整列されている必要がある点に注意しなければならない。"}, {"q": "オブジェクト指向プログラミングにおいて、データとそれを操作する手続きを1つにまとめ、外部から内部の詳細を直接操作できないようにする考え方を何というか。", "a": ["カプセル化", "継承", "多態性(ポリモーフィズム)", "抽象化"], "cat": "technology", "c": 0, "d": "カプセル化は、オブジェクトの内部データと、それを扱う処理(メソッド)を1つにまとめ、外部からは決められた窓口を通してのみアクセスできるようにする考え方である。内部の実装を隠すことで、他の部分に影響を与えずに実装を変更しやすくなる利点がある。継承や多態性と並んで、オブジェクト指向の基本的な特徴の一つに数えられる。"}, {"q": "CPU内部の動作タイミングを合わせるための信号が、1秒間に繰り返される回数を表す指標はどれか。", "a": ["クロック周波数", "ビット長", "スループット", "キャッシュ容量"], "cat": "technology", "c": 0, "d": "クロック周波数は、CPUが内部の処理タイミングをそろえるために使う信号が1秒間に何回繰り返されるかを表す値で、単位にはHz(ヘルツ)が使われる。一般に数値が大きいほど、CPUが単位時間あたりに実行できる処理の回数が多くなる傾向がある。ただし処理性能はクロック周波数だけでなく、コア数や内部構造など複数の要素で決まる。"}, {"q": "1つのCPUパッケージの中に複数の処理装置(コア)を搭載し、複数の処理を並列に実行できるようにしたプロセッサを何というか。", "a": ["マルチコアプロセッサ", "マルチスレッド", "デュアルシステム", "GPU"], "cat": "technology", "c": 0, "d": "マルチコアプロセッサは、1つのチップの中に複数のコア(演算を行う中核部分)を組み込んだCPUで、それぞれのコアが独立して処理を実行できる。複数のコアで処理を分担することで、1つのコアだけで動作するシングルコアに比べて全体の処理性能を高めやすい。パソコンやスマートフォンなど、現在の多くの機器に採用されている構造である。"}, {"q": "電源を切るとデータが消えるが、プログラムの実行中に自由にデータの読み書きができる主記憶装置はどれか。", "a": ["RAM", "ROM", "HDD", "SSD"], "cat": "technology", "c": 0, "d": "RAM(Random Access Memory)は、CPUが処理中のデータやプログラムを一時的に保持する主記憶装置で、自由にデータの読み書きができる反面、電源を切ると記憶内容が失われる揮発性のメモリである。パソコンの主記憶(メインメモリ)として広く使われている。容量が大きいほど、同時に多くのプログラムやデータを扱いやすくなる。"}, {"q": "製造時などにあらかじめ内容が書き込まれ、電源を切ってもデータが消えない読み出し専用の記憶装置はどれか。", "a": ["ROM", "RAM", "キャッシュメモリ", "レジスタ"], "cat": "technology", "c": 0, "d": "ROM(Read Only Memory)は、あらかじめ書き込まれたデータを読み出すことを主な目的とした記憶装置で、電源を切ってもデータが消えない不揮発性を持つ。機器の基本的な動作プログラムなど、書き換える必要のない情報を格納するのに向いている。自由に書き換えができるRAMとは対照的な性質を持つ記憶装置である。"}, {"q": "磁気ディスクを高速に回転させ、磁気ヘッドでデータを読み書きする補助記憶装置はどれか。", "a": ["HDD(ハードディスクドライブ)", "SSD", "DVD", "RAM"], "cat": "technology", "c": 0, "d": "HDDは、円盤状の磁気ディスクを高速回転させ、磁気ヘッドを使ってデータの読み書きを行う補助記憶装置である。駆動部分が多いため、半導体メモリを使うSSDに比べると衝撃に弱く、動作音や消費電力も大きくなりやすい。それでも比較的低コストで大容量の記憶領域を確保できることから、今でも広く利用されている。"}, {"q": "半導体メモリにデータを記憶する補助記憶装置で、HDDのような駆動部分を持たず、高速な読み書きと耐衝撃性に優れるものはどれか。", "a": ["SSD(ソリッドステートドライブ)", "HDD", "ROM", "キャッシュメモリ"], "cat": "technology", "c": 0, "d": "SSDは、フラッシュメモリと呼ばれる半導体メモリを利用した補助記憶装置で、円盤や磁気ヘッドといった機械的な駆動部分を持たない。そのため、HDDに比べてデータの読み書き速度が速く、衝撃にも強いという特徴がある。近年はノートパソコンやスマートフォンの記憶装置として広く採用されている。"}, {"q": "サービスを要求する側のコンピュータと、サービスを提供する側のコンピュータとで役割を分担させるシステム構成はどれか。", "a": ["クライアントサーバシステム", "ピアツーピアシステム", "デュアルシステム", "シンクライアントシステム"], "cat": "technology", "c": 0, "d": "クライアントサーバシステムは、要求を出す側のクライアントと、要求に応じてサービスを提供する側のサーバとに役割を分けて処理を行うシステム構成である。サーバ側でデータやサービスを一括管理できるため、複数のクライアントから同じ情報にアクセスしやすくなる。企業の業務システムやWebサービスなど、幅広い場面で採用されている構成だ。"}, {"q": "1台の物理的なコンピュータの上に、複数の独立したコンピュータ環境をソフトウェア的に作り出す技術を何というか。", "a": ["仮想化", "クラスタリング", "ロードバランシング", "シンクライアント"], "cat": "technology", "c": 0, "d": "仮想化は、1台の物理サーバの上に、あたかも複数台のコンピュータが存在するかのような仮想的な環境をソフトウェアで作り出す技術である。これにより、1台のハードウェアを複数の用途で効率よく使い分けたり、環境ごとに異なるOSやアプリケーションを動かしたりできるようになる。サーバの台数を抑えながら柔軟にシステムを構築できる点が利点だ。"}, {"q": "利用者側の端末にはできるだけデータやアプリケーションを持たせず、サーバ側で処理やデータ管理を集中して行う仕組みを何というか。", "a": ["シンクライアント", "クライアントサーバシステム", "ピアツーピアシステム", "デュプレックスシステム"], "cat": "technology", "c": 0, "d": "シンクライアントは、利用者が使う端末の機能を必要最小限にとどめ、実際の処理やデータの保管はサーバ側に集中させる仕組みである。端末に重要なデータを残さないため、紛失や盗難による情報漏えいのリスクを抑えやすいという利点がある。サーバ側で一括して管理・更新できるため、運用の手間を減らしやすい点も特徴だ。"}, {"q": "同じ処理を行う2つの独立したシステムを用意し、互いの処理結果を照合しながら運用することで、片方に障害が起きてももう一方だけで処理を続けられるようにする方式はどれか。", "a": ["デュアルシステム", "デュプレックスシステム", "クラスタシステム", "レプリケーション"], "cat": "technology", "c": 0, "d": "デュアルシステムは、同一の処理を行う2つのシステムを常に並行して稼働させ、互いの処理結果を照合しながら運用する構成である。片方のシステムに障害が発生した場合でも、もう一方が処理を継続できるため、信頼性の高いシステムが求められる場面で採用される。2系統とも常に稼働している点が、待機系を持つデュプレックスシステムとの違いだ。"}, {"q": "普段は主系のシステムだけで処理を行い、従系は待機させておいて、主系に障害が発生したときに従系へ切り替えて処理を継続する方式はどれか。", "a": ["デュプレックスシステム", "デュアルシステム", "ミラーリング", "負荷分散システム"], "cat": "technology", "c": 0, "d": "デュプレックスシステムは、通常時は主系のシステムだけで処理を行い、従系のシステムは待機状態にしておく構成である。主系に障害が起きたときに従系へ処理を切り替えることで、システムを止めずに運用を続けられる。常時2系統を並行稼働させるデュアルシステムに比べて、構成や運用のコストを抑えやすい点が特徴である。"}, {"q": "利用者が処理の要求を送信してから、その結果が出力され始めるまでにかかる時間を表す性能評価指標はどれか。", "a": ["レスポンスタイム", "スループット", "ターンアラウンドタイム", "MTBF"], "cat": "technology", "c": 0, "d": "レスポンスタイムは、利用者が処理の要求を出してから、システムが応答の出力を開始するまでにかかる時間を表す指標である。これに対してスループットは、単位時間あたりにシステムが処理できる仕事量を表す指標であり、意味合いが異なる。オンラインシステムの使いやすさを評価する際には、レスポンスタイムの短さが重視されることが多い。"}, {"q": "システムが故障してから、修理が完了して再び使用できる状態に戻るまでの平均時間を表す指標はどれか。", "a": ["MTTR(平均修復時間)", "MTBF(平均故障間隔)", "稼働率", "スループット"], "cat": "technology", "c": 0, "d": "MTTR(Mean Time To Repair)は、システムが故障してから修理が完了し、再び稼働できるようになるまでにかかる時間の平均値を表す指標である。この値が小さいほど、故障発生時に短時間で復旧できるシステムだといえる。故障と故障の間隔の平均を表すMTBFとあわせて、システムの信頼性を評価する際によく使われる指標だ。"}, {"q": "1つのCPUで複数のプログラムの処理を短い時間で切り替えながら実行し、あたかも同時に動いているように見せるOSの機能を何というか。", "a": ["マルチタスク", "マルチスレッド", "マルチコア", "デュアルシステム"], "cat": "technology", "c": 0, "d": "マルチタスクは、1つのCPUで複数のプログラムの処理を短い間隔で切り替えながら実行することで、利用者からは複数の処理が同時に進んでいるように見せるOSの機能である。文書作成をしながら音楽を再生できるのも、この仕組みによるものだ。複数のコアを物理的に搭載するマルチコアとは異なり、マルチタスクは1つの処理装置でも実現できる考え方である。"}, {"q": "主記憶(メモリ)の容量よりも大きなプログラムを実行できるように、補助記憶装置の一部を主記憶の延長として扱う技術を何というか。", "a": ["仮想記憶", "キャッシュメモリ", "デフラグ", "レジスタ"], "cat": "technology", "c": 0, "d": "仮想記憶は、実際の主記憶の容量を超えるサイズのプログラムやデータを扱えるように、ハードディスクなどの補助記憶装置の一部を主記憶の延長として利用する技術である。プログラムからは、実際の主記憶よりも大きな連続した記憶領域が存在するように見える。頻繁に使うデータを高速化するキャッシュメモリとは、目的も仕組みも異なる技術だ。"}, {"q": "OSのファイル管理において、ファイルを種類や用途ごとに分類し、階層構造で整理して管理する仕組みを何というか。", "a": ["ディレクトリ(フォルダ)", "パーティション", "レジストリ", "ファイルシステムキャッシュ"], "cat": "technology", "c": 0, "d": "ディレクトリ(フォルダ)は、ファイルを目的や種類ごとにまとめて分類し、木構造のように階層的に管理する仕組みである。ディレクトリの中にさらに別のディレクトリを作ることで、膨大な数のファイルを整理しやすくなる。ファイルの保存場所は、ルートディレクトリからの経路であるパスによって表される。"}, {"q": "ソースコードが公開されており、誰でも自由に利用・改変・再配布できることを基本的な考え方とするソフトウェアを何というか。", "a": ["オープンソースソフトウェア(OSS)", "フリーウェア", "シェアウェア", "ミドルウェア"], "cat": "technology", "c": 0, "d": "オープンソースソフトウェア(OSS)は、ソースコードを公開し、利用や改変、再配布を一定のライセンス条件のもとで自由に行えるようにする考え方に基づくソフトウェアである。無償で配布されるフリーウェアとは異なり、OSSは改変や再配布の自由さに重点が置かれている点が特徴だ。多くの利用者や開発者が改良に関われることで、品質の向上や機能の拡張が進みやすいといわれている。"}, {"q": "OSがプリンタやマウスなどの周辺機器を制御するために、機器ごとに用意されるソフトウェアを何というか。", "a": ["デバイスドライバ", "ファームウェア", "BIOS", "ミドルウェア"], "cat": "technology", "c": 0, "d": "デバイスドライバは、OSが周辺機器を認識し、正しく制御できるようにするために、機器の種類ごとに用意される専用のソフトウェアである。新しいプリンタやマウスを接続したときに専用のドライバを組み込む必要があるのは、機器ごとに制御方法が異なるためだ。適切なデバイスドライバがなければ、OSはその機器を正しく動作させることができない。"}, {"q": "ファイルが保存されている場所を、最上位のルートディレクトリから階層をすべてたどって示す表記方法を何というか。", "a": ["絶対パス", "相対パス", "ファイル名", "拡張子"], "cat": "technology", "c": 0, "d": "絶対パスは、ルートディレクトリを起点として、目的のファイルにたどり着くまでの階層をすべて書き表す指定方法である。どこから見ても場所が一意に定まるため、指定先を取り違える心配が少ない。これに対して相対パスは、現在自分がいるディレクトリを基準にした位置関係で場所を示す方法であり、基準となる場所が変わると指し示す先も変わってくる。"}, {"q": "紙に印刷された文字や画像を光学的に読み取り、デジタルデータに変換する入力装置はどれか。", "a": ["イメージスキャナ", "プロッタ", "プロジェクタ", "3Dプリンタ"], "cat": "technology", "c": 0, "d": "イメージスキャナは、紙などに印刷された文字や図、写真を光学的に読み取り、コンピュータで扱えるデジタルデータに変換する入力装置である。読み取った画像データは、文字認識ソフト(OCR)によって編集可能な文字データに変換されることもある。書類の電子化や写真の取り込みなど、さまざまな場面で利用されている。"}, {"q": "3次元の設計データをもとに、材料を少しずつ積み重ねて立体物を作り出す出力装置はどれか。", "a": ["3Dプリンタ", "イメージスキャナ", "プロッタ", "タッチパネル"], "cat": "technology", "c": 0, "d": "3Dプリンタは、コンピュータ上で作成した3次元の設計データをもとに、樹脂などの材料を薄い層として少しずつ積み重ねていくことで、立体的なものを作り出す出力装置である。試作品の製作や部品の製造など、ものづくりの現場で広く活用されている。紙に図面を描く出力装置であるプロッタとは、扱う対象が平面か立体かという点で大きく異なる。"}, {"q": "パソコンと周辺機器を接続するための標準的なインタフェース規格で、多くの機器に共通して使え、データ通信だけでなく電源供給も行えるものはどれか。", "a": ["USB", "HDMI", "有線LAN", "Bluetooth"], "cat": "technology", "c": 0, "d": "USB(Universal Serial Bus)は、パソコンとマウスやキーボード、外付け記憶装置などの周辺機器を接続するための標準的なインタフェース規格である。同じ形状の端子で幅広い種類の機器を接続できる汎用性の高さに加え、データ通信とあわせて機器への電源供給も行える点が特徴だ。映像出力に特化したHDMIとは用途が異なる規格である。"}, {"q": "数メートル程度の近距離にある機器同士を無線で接続するためのインタフェース規格で、ワイヤレスイヤホンやワイヤレスマウスなどに利用されるものはどれか。", "a": ["Bluetooth", "Wi-Fi", "NFC", "USB"], "cat": "technology", "c": 0, "d": "Bluetoothは、数メートル程度の近距離にある機器同士を無線で接続するためのインタフェース規格で、消費電力が比較的小さいことから携帯機器に広く採用されている。ワイヤレスイヤホンやワイヤレスキーボードなど、ケーブルを使わずに機器を接続したい場面で利用される。比較的広い範囲をカバーする無線LAN(Wi-Fi)とは、想定する通信距離や用途が異なる。"}, {"q": "物体の動きや傾き、振動などを検知して電気信号に変換する装置を何というか。", "a": ["加速度センサー", "温度センサー", "照度センサー", "近接センサー"], "cat": "technology", "c": 0, "d": "加速度センサーは、物体の速度の変化(加速度)を検知し、動きや傾き、振動などを電気信号に変換する装置である。スマートフォンの画面の向きの自動切り替えや、歩数計の歩行検知など、身近な機器の多くに組み込まれている。周囲の明るさを検知する照度センサーなど、他の種類のセンサーとは検知する対象が異なる点に注意したい。"}, {"q": "ICカードやスマートフォンを機器にかざすだけで通信できる、数cm程度の非常に近い距離で使われる無線通信規格はどれか。", "a": ["NFC(近距離無線通信)", "Bluetooth", "Wi-Fi", "USB"], "cat": "technology", "c": 0, "d": "NFC(Near Field Communication)は、機器同士を数cm程度まで近づけることで通信が始まる、非常に近距離向けの無線通信規格である。交通系ICカードや電子マネーの読み取り、スマートフォン同士のかざすだけのデータ交換などに利用されている。通信距離がより長いBluetoothやWi-Fiとは異なり、かざすだけの手軽さと誤接続の少なさが特徴だ。"}, {"q": "Webサイトの入力フォームで、あらかじめ用意された複数の選択肢の中からちょうど1つだけを選ばせたい場合に用いるGUI部品として、最も適切なものはどれか。", "a": ["ラジオボタン", "チェックボックス", "テキストボックス", "スライダー"], "cat": "technology", "c": 0, "d": "ラジオボタンは丸印のマークが並ぶGUI部品で、複数の選択肢の中から1つだけを選択させる場面に使う。同時に複数選べるチェックボックスとは、選べる個数の点で役割が異なる。"}, {"q": "アンケートフォームで、複数の選択肢の中から該当するものをいくつでも選べるようにしたいときに用いるGUI部品として、適切なものはどれか。", "a": ["チェックボックス", "ラジオボタン", "テキストエリア", "コンボボックス"], "cat": "technology", "c": 0, "d": "四角い枠に印を付ける形のGUI部品で、一つの設問に対して複数の項目を同時に選択できるのが特徴である。1つしか選べないラジオボタンとは、この点で使い分けられる。"}, {"q": "多数の選択肢を画面上では省スペースに表示しておき、クリックすると一覧が開いて1つを選べるGUI部品を何というか。", "a": ["プルダウンメニュー", "ラジオボタン", "チェックボックス", "スクロールバー"], "cat": "technology", "c": 0, "d": "普段は選択済みの項目だけを表示し、クリックすると候補の一覧が展開して選択できるGUI部品である。選択肢の数が多い項目を、限られた画面スペースに収めたいときに向いている。"}, {"q": "Webサイトの画面上部などに「トップ > 製品情報 > ノートPC」のように表示し、利用者が今どの階層のページを見ているかを示すナビゲーション要素を何というか。", "a": ["パンくずリスト", "サイトマップ", "フッターメニュー", "タブメニュー"], "cat": "technology", "c": 0, "d": "現在表示しているページがサイト全体のどの階層に位置するかを、上位ページへのリンクを連ねて示すナビゲーションである。利用者は途中の階層に一度に戻ることができ、迷子になりにくくなる。"}, {"q": "同じHTMLファイルを使いながら、閲覧する端末の画面幅に応じてレイアウトの列数や文字サイズなどを自動的に切り替えるWebデザインの手法を何というか。", "a": ["レスポンシブWebデザイン", "ワイヤーフレーム", "モーダルウィンドウ", "スケーラブルベクターグラフィックス"], "cat": "technology", "c": 0, "d": "PCやスマートフォンなど画面サイズが異なる端末でも、CSSなどによって表示幅に応じて見た目を調整し、1つのページで見やすい表示を実現する設計手法である。端末ごとに別ページを用意する手間を減らせる。"}, {"q": "Webページ上の画像に、その内容を説明する文字情報をあらかじめ設定しておくことで、画面を見なくても音声読み上げソフトが画像の内容を伝えられるようにする仕組みを何というか。", "a": ["代替テキスト(alt属性)", "メタタグ", "サイトマップ", "スタイルシート"], "cat": "technology", "c": 0, "d": "img要素のalt属性などに画像の内容を文字で記述しておく仕組みである。視覚に障がいがある利用者が使うスクリーンリーダーが、その文字を読み上げて画像の内容を伝えられるようになる。"}, {"q": "文字の色と背景色の明るさの差を数値で表したもので、この値を一定以上確保することが、弱視の利用者などにも文字を読みやすくするアクセシビリティ対応の基本とされる指標を何というか。", "a": ["コントラスト比", "解像度", "リフレッシュレート", "アスペクト比"], "cat": "technology", "c": 0, "d": "背景色と文字色の明るさの差を示す数値であり、値が小さいと文字が背景に埋もれて読みづらくなる。Webアクセシビリティの指針では、一定以上のコントラスト比を確保することが推奨されている。"}, {"q": "写真のような自然画像を扱う静止画の圧縮方式で、人間の目には感知しにくい情報を間引くことでファイルサイズを大幅に小さくできる、非可逆圧縮の代表的な方式はどれか。", "a": ["JPEG", "MPEG", "GIF", "PNG"], "cat": "technology", "c": 0, "d": "写真などの自然画像に適した静止画像の圧縮方式で、画質を多少犠牲にする代わりに高い圧縮率を実現する非可逆圧縮を採用している。デジタルカメラの記録形式としても広く使われている。"}, {"q": "画像を圧縮しても元のデータを完全に復元できる可逆圧縮方式を採用しており、輪郭のはっきりしたロゴやイラストの保存に向いている静止画のファイル形式はどれか。", "a": ["PNG", "JPEG", "MPEG", "MP3"], "cat": "technology", "c": 0, "d": "圧縮の前後でデータが劣化しない可逆圧縮の静止画形式であり、背景を透明にする機能も備える。写真よりも、文字や線がはっきりしたロゴ・図表の保存に適している。"}, {"q": "動画と音声をあわせて圧縮し、テレビ放送やDVD、動画配信サービスなどで広く使われている動画データの圧縮符号化方式の総称はどれか。", "a": ["MPEG", "JPEG", "MP3", "HTML5"], "cat": "technology", "c": 0, "d": "動画像と音声データを効率よく圧縮するための国際規格群であり、フレーム間で変化が少ない部分を間引くなどの方法でデータ量を大幅に削減する。地上デジタル放送や動画配信サービスなどで利用されている。"}, {"q": "音声データを人間の聴覚特性を利用して圧縮することで、CDに近い音質を保ちながらファイルサイズを大きく小さくできる音声圧縮方式はどれか。", "a": ["MP3", "JPEG", "MPEG", "WAV"], "cat": "technology", "c": 0, "d": "人が聞き取りにくい周波数帯の音を間引く非可逆圧縮によって、音声データを大幅に小さくする方式である。音楽配信サービスや携帯音楽プレーヤーで広く利用されてきた。"}, {"q": "動画や音声のデータをすべてダウンロードし終える前から、受信しながら順次再生できる配信方式を何というか。", "a": ["ストリーミング配信", "バッチ処理", "ミラーリング", "テザリング"], "cat": "technology", "c": 0, "d": "データを少しずつ受信しながら同時に再生する方式であり、動画や音楽をファイル全体のダウンロード完了を待たずに視聴できる。動画共有サイトや音楽配信サービスの多くがこの方式を採用している。"}, {"q": "コンピュータグラフィックスなどで作られた仮想の空間を、専用のゴーグル型端末などを通じて、あたかもその場にいるかのように体験させる技術を何というか。", "a": ["VR(仮想現実)", "AR(拡張現実)", "CG(コンピュータグラフィックス)", "GUI"], "cat": "technology", "c": 0, "d": "コンピュータが作り出した仮想空間に利用者を没入させる技術であり、専用のヘッドマウントディスプレイなどで視界全体を覆うことで、実際にその場にいるような感覚を与える。"}, {"q": "スマートフォンのカメラで映した現実の映像に、コンピュータが生成した文字や画像などの情報を重ねて表示する技術を何というか。", "a": ["AR(拡張現実)", "VR(仮想現実)", "CG(コンピュータグラフィックス)", "ストリーミング配信"], "cat": "technology", "c": 0, "d": "現実の風景や映像に、コンピュータが作った追加の情報を重ね合わせて表示する技術である。カーナビの経路表示や、家具を部屋に試し置きするアプリなどに応用されている。"}, {"q": "3次元のモデルデータに光源や視点、材質などの情報を与えて計算し、平面の画像として描き出す処理を何というか。", "a": ["レンダリング", "エンコード", "ストリーミング", "キャプチャ"], "cat": "technology", "c": 0, "d": "3次元のオブジェクトの形状や色、光の当たり方などの情報をもとに、コンピュータが計算して2次元の画像を生成する処理である。映画のCG映像やゲームの画面表示などに使われている。"}, {"q": "データの一元管理、検索、更新、複数の利用者からの同時アクセスの制御などをまとめて行う、データベースを管理するためのソフトウェアを何というか。", "a": ["DBMS(データベース管理システム)", "OS", "ファイアウォール", "表計算ソフト"], "cat": "technology", "c": 0, "d": "データの登録・検索・更新や、複数の利用者が同時にアクセスした際の整合性の維持などをまとめて行うソフトウェアである。データを個々のアプリケーションから独立させて一元的に管理できるようにする役割を持つ。"}, {"q": "関係データベースにおいて、テーブルの中から条件に合う行を取り出すときに用いるSQL文はどれか。", "a": ["SELECT文", "INSERT文", "UPDATE文", "DELETE文"], "cat": "technology", "c": 0, "d": "テーブルから必要な列や行を指定して取り出すためのSQL文であり、WHERE句を組み合わせることで条件に合致するデータだけを抽出できる。データの検索・参照に用いる基本的な命令である。"}, {"q": "テーブルの中で、それぞれの行(レコード)を重複なく一意に特定するために用いる項目を何というか。", "a": ["主キー", "外部キー", "インデックス", "フィールド名"], "cat": "technology", "c": 0, "d": "テーブル内のレコードを重複なく一意に識別するための項目(列)である。同じ値を持つ行が複数存在しないことと、値が空でないことが求められる。"}, {"q": "あるテーブルの列に、別のテーブルの主キーの値を設定することで、テーブル同士の関連付けを行うために用いる項目を何というか。", "a": ["外部キー", "主キー", "インデックス", "ビュー"], "cat": "technology", "c": 0, "d": "他のテーブルの主キーを参照する形で設定される項目であり、テーブル間の関係(リレーション)を表すのに使われる。例えば注文テーブルに顧客テーブルの主キーを持たせることで、どの顧客の注文かを結び付けられる。"}, {"q": "データベースのトランザクション処理において、処理の途中経過が他の利用者から見えないことや、処理が完了するか全く行われなかった状態のいずれかになることなど、トランザクションが備えるべき4つの性質の総称を何というか。", "a": ["ACID特性", "正規形", "スキーマ", "インデックス"], "cat": "technology", "c": 0, "d": "原子性・一貫性・独立性・永続性という4つの性質の頭文字をとった呼び方であり、トランザクション処理が信頼できる形で実行されるために満たすべき条件を示している。銀行の振込処理のように、途中で処理が中断してもデータの整合性が崩れないようにする考え方の基礎になっている。"}, {"q": "複数の利用者が同じデータを同時に更新しようとしたときに、データの矛盾が生じないよう、一方の処理が終わるまで他方の更新を待たせる制御を何というか。", "a": ["排他制御", "正規化", "認証", "負荷分散"], "cat": "technology", "c": 0, "d": "同一のデータに対して複数の処理が同時に書き込みを行うと、後から書き込んだ内容で以前の更新が上書きされてしまうことがある。これを防ぐため、対象データにロックをかけて一時的に他の処理からの更新を制限する仕組みである。"}, {"q": "データベースのトランザクション処理において、一連の更新処理が正常に完了しなかった場合に、そのトランザクションで行った変更を取り消して処理開始前の状態に戻す操作を何というか。", "a": ["ロールバック", "コミット", "リストア", "インデックス作成"], "cat": "technology", "c": 0, "d": "処理の途中でエラーが発生するなどした場合に、トランザクション内で行った変更をすべて取り消し、処理を始める前の状態にデータを戻す操作である。対して、変更内容を確定させる操作はコミットと呼ばれる。"}, {"q": "関係データベースにおいて、テーブルの1行に対応し、氏名や住所など複数の項目をひとまとまりとして表すデータの単位を何というか。", "a": ["レコード", "フィールド", "スキーマ", "インデックス"], "cat": "technology", "c": 0, "d": "テーブルの中の1行分のデータのまとまりであり、例えば顧客テーブルであれば1人の顧客の情報がひとつのレコードとして格納される。これに対して、氏名や電話番号などの個々の項目は列(フィールド)と呼ばれる。"}, {"q": "会社の建物内や家庭内など、比較的狭い範囲を結ぶネットワークを何というか。", "a": ["LAN", "WAN", "インターネット", "VPN"], "cat": "technology", "c": 0, "d": "同じ建物やフロアなど、限られた範囲のコンピュータ機器を接続するネットワークである。これに対し、本社と支社など地理的に離れた拠点間を結ぶ広い範囲のネットワークはWANと呼ばれる。"}, {"q": "インターネットにおいて、データを送受信するための標準的な通信手順(プロトコル)として広く使われている規約の総称はどれか。", "a": ["TCP/IP", "HTTP", "SMTP", "USB"], "cat": "technology", "c": 0, "d": "インターネットで標準的に使われる通信規約の集まりであり、データを小さな単位に分けて送る仕組みや宛先を指定して届ける仕組みなどを定めている。世界中の異なる機種のコンピュータ同士が通信できるのは、この共通の規約に従っているためである。"}, {"q": "WebブラウザとWebサーバの間の通信を、暗号化した上で行うプロトコルはどれか。", "a": ["HTTPS", "HTTP", "FTP", "SMTP"], "cat": "technology", "c": 0, "d": "Webページの閲覧に使われるHTTP通信に、暗号化の仕組みを組み合わせたプロトコルである。通信内容が第三者に盗み見られたり改ざんされたりするのを防ぐため、会員登録やネット通販の決済など個人情報を扱うページで広く利用されている。"}, {"q": "電子メールを送信する際に、メールソフトからメールサーバへ、またはメールサーバ間でメッセージを転送するために使われるプロトコルはどれか。", "a": ["SMTP", "POP", "IMAP", "HTTP"], "cat": "technology", "c": 0, "d": "電子メールを送り出すときに使われる通信規約であり、送信者のメールソフトからメールサーバへの送信や、サーバ間でのメールの転送に用いられる。これに対し、受信者がサーバからメールを受け取る際にはPOPやIMAPといった別のプロトコルが使われる。"}, {"q": "無線LANで通信内容を盗み見られたり、第三者に不正に接続されたりしないようにするために用いる、無線区間のデータを暗号化する規格はどれか。", "a": ["WPA2", "HTTPS", "VPN", "Bluetooth"], "cat": "technology", "c": 0, "d": "無線LANのアクセスポイントと端末の間でやり取りするデータを暗号化するための規格である。適切な暗号化方式を設定しないまま無線LANを利用すると、通信内容を第三者に読み取られたり、ネットワークに無断で接続されたりする危険がある。"}, {"q": "異なるネットワーク同士を接続し、宛先のIPアドレスをもとにデータを転送する経路を選択するネットワーク機器はどれか。", "a": ["ルータ", "スイッチ", "ハブ", "リピータ"], "cat": "technology", "c": 0, "d": "自宅や社内のネットワークとインターネットのように、異なるネットワークを結び付ける機器であり、送られてきたデータの宛先IPアドレスを見て、最適な経路へと転送する役割を持つ。家庭用のブロードバンドルータもこの機能を備えている。"}, {"q": "LAN内で、受信したデータの宛先MACアドレスを見て、接続されている多数の機器の中から必要な相手先のポートだけにデータを転送するネットワーク機器はどれか。", "a": ["スイッチ(スイッチングハブ)", "ルータ", "リピータハブ", "モデム"], "cat": "technology", "c": 0, "d": "LANを構成する機器を接続する集線装置の一種であり、届いたデータの宛先MACアドレスを見て、必要な相手のポートにだけデータを送り出す。すべてのポートに同じデータを流してしまうリピータハブに比べ、無駄な通信を減らせる。"}, {"q": "インターネットに直接接続する機器に割り当てられ、世界中で重複しないように管理されているIPアドレスを何というか。", "a": ["グローバルIPアドレス", "プライベートIPアドレス", "MACアドレス", "ポート番号"], "cat": "technology", "c": 0, "d": "インターネット上で機器を一意に識別するために、世界規模で重複しないよう管理・割り当てられるIPアドレスである。これに対し、家庭内や社内などの限られたネットワーク内だけで使われ、外部のネットワークとは重複してもよいIPアドレスはプライベートIPアドレスと呼ばれる。"}, {"q": "感染したコンピュータ内のファイルを勝手に暗号化し、元に戻すことと引き換えに金銭を要求するマルウェアを何というか。", "a": ["ランサムウェア", "ワーム", "スパイウェア", "トロイの木馬"], "cat": "technology", "c": 0, "d": "利用者のファイルを暗号化するなどして使用できない状態にし、復旧と引き換えに身代金(ランサム)を要求するマルウェアである。企業のシステムが感染すると、業務が長期間停止する被害につながることがある。"}, {"q": "他のプログラムに寄生せず、単独のプログラムとしてネットワークなどを通じて自己複製しながら次々と他のコンピュータに感染を広げていくマルウェアを何というか。", "a": ["ワーム", "ランサムウェア", "トロイの木馬", "マクロウイルス"], "cat": "technology", "c": 0, "d": "他のファイルに感染して増殖するウイルスとは異なり、単独で動作し、ネットワーク経由で自分自身のコピーを次々と他の機器に送り込んで感染を広げていくマルウェアである。短期間で大量の機器に被害が拡大することがある。"}, {"q": "組織のネットワークとインターネットの境界に設置し、あらかじめ定めたルールに基づいて通信を許可したり遮断したりすることで、外部からの不正アクセスを防ぐ仕組みを何というか。", "a": ["ファイアウォール", "ウイルス対策ソフト", "プロキシサーバ", "VPN"], "cat": "technology", "c": 0, "d": "内部ネットワークと外部ネットワークの境界に置かれ、通信の送信元や宛先、ポート番号などをもとに、許可された通信だけを通す仕組みである。外部からの不正な侵入や、内部から外部への不要な通信を防ぐ役割を果たす。"}, {"q": "既知のマルウェアの特徴を記録した定義ファイル(パターンファイル)と、コンピュータ内のファイルを照合することで、マルウェアを検出・駆除するソフトウェアを何というか。", "a": ["ウイルス対策ソフト", "ファイアウォール", "ISMS", "VPNソフト"], "cat": "technology", "c": 0, "d": "既知のマルウェアが持つ特有のデータパターンをまとめた定義ファイルをもとに、コンピュータ内のファイルを検査してマルウェアを見つけ出し、駆除や隔離を行うソフトウェアである。新種のマルウェアに対応するため、定義ファイルは日々更新される。"}, {"q": "組織が情報セキュリティに関する方針を定め、対策の実施状況を確認し、問題があれば継続的に改善していくという管理の仕組みを運用することを何というか。", "a": ["ISMS(情報セキュリティマネジメントシステム)", "ファイアウォール", "BCP(事業継続計画)", "CSIRT"], "cat": "technology", "c": 0, "d": "組織全体で情報セキュリティに関する方針を定め、対策の実施状況を確認し、問題があれば改善するというサイクルを継続的に回す管理の枠組みである。特定の技術対策だけでなく、組織的な仕組みとしてセキュリティを維持する点に特徴がある。"}, {"q": "許可された者だけが情報にアクセスできる状態を保つことを表す、情報セキュリティの3要素の一つを何というか。", "a": ["機密性", "完全性", "可用性", "信頼性"], "cat": "technology", "c": 0, "d": "権限を持たない第三者に情報を見られたり使われたりしないようにする性質であり、パスワードによるアクセス制限や暗号化などによって保たれる。情報セキュリティでは、これに完全性・可用性を加えた3つの要素をバランスよく確保することが求められる。"}, {"q": "標的のWebサーバなどに対して大量のデータや処理要求を送りつけ、サーバの処理能力を超えさせることで、本来のサービスを提供できない状態に追い込む攻撃を何というか。", "a": ["DoS攻撃(サービス妨害攻撃)", "フィッシング", "ランサムウェア", "SQLインジェクション"], "cat": "technology", "c": 0, "d": "大量の通信や処理要求を送り付けることでサーバやネットワークに過大な負荷をかけ、正常な利用者がサービスを利用できない状態にする攻撃である。複数の機器から一斉に攻撃を行うものは特にDDoS攻撃と呼ばれる。"}];

let current = [];
let idx = 0, score = 0;

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

// 選択肢の並び順をシャッフルし、正解インデックスを再計算した状態でコピーを返す
function shuffleChoices(q){
  const order = shuffle([0,1,2,3]);
  const a = order.map(i => q.a[i]);
  const c = order.indexOf(q.c);
  return {q:q.q, a, cat:q.cat, c, d:q.d};
}

function stratifiedExamSet(){
  const strat = shuffle(quizData.filter(q=>q.cat==='strategy')).slice(0,35);
  const mgmt  = shuffle(quizData.filter(q=>q.cat==='management')).slice(0,20);
  const tech  = shuffle(quizData.filter(q=>q.cat==='technology')).slice(0,45);
  return shuffle(strat.concat(mgmt, tech));
}

function startMode(mode){
  const base = mode==='exam' ? stratifiedExamSet() : shuffle(quizData);
  current = base.map(shuffleChoices);
  idx = 0; score = 0;
  document.getElementById('menu-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  showQuestion();
}

function startCategory(cat){
  const base = shuffle(quizData.filter(q=>q.cat===cat));
  current = base.map(shuffleChoices);
  idx = 0; score = 0;
  document.getElementById('menu-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  showQuestion();
}

function showQuestion(){
  const q = current[idx];
  document.getElementById('crumb').textContent = `HOME ＞ ${catLabels[q.cat]} ＞ No.${idx+1}`;
  document.getElementById('score').textContent = `${idx+1} / ${current.length}問　正解 ${score}`;
  document.getElementById('catBadge').textContent = catLabels[q.cat];
  document.getElementById('question').textContent = q.q;
  document.getElementById('result').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('backBtn').style.display='block';
  const box = document.getElementById('answers');
  box.innerHTML='';
  q.a.forEach((text,i)=>{
    const div = document.createElement('div');
    div.className='choice-item';
    div.innerHTML = `<div class="choice-label">${choiceLabels[i]}</div><div class="choice-text">${text}</div>`;
    div.onclick = ()=>selectAnswer(i);
    box.appendChild(div);
  });
}

function selectAnswer(i){
  const q = current[idx];
  const items = document.querySelectorAll('.choice-item');
  items.forEach((el,i2)=>{
    el.classList.add('disabled-item');
    if(i2===q.c) el.classList.add('correct');
    else if(i2===i) el.classList.add('wrong');
  });
  if(i===q.c) score++;
  const result = document.getElementById('result');
  result.style.display='block';
  result.innerHTML = `<b>正解：${choiceLabels[q.c]}</b><br>${q.d}`;
  document.getElementById('nextBtn').style.display='block';
}

function nextQuestion(){
  idx++;
  if(idx>=current.length){ showEnd(); return; }
  showQuestion();
}

function showEnd(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('end-screen').style.display='block';
  document.getElementById('endMsg').textContent =
    `お疲れさま！ ${current.length}問中 ${score}問正解（正答率${Math.round(score/current.length*100)}%）でした。`;
}

function backToMenu(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('menu-screen').style.display='block';
}
</script>
