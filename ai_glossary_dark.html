<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI・IT略語チートシート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1623;color:#e8eaf0;font-family:-apple-system,'Hiragino Sans','Meiryo',sans-serif;min-height:100vh;padding-bottom:3rem}
.top-bar{background:#161d2e;border-bottom:1px solid #2a3450;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top-title{font-size:16px;font-weight:700;color:#ccd6f6}
.count-badge{font-size:12px;background:#1e3a5f;color:#4a9eff;padding:3px 10px;border-radius:20px;border:1px solid #4a9eff}
.search-wrap{padding:14px 16px 0}
.search-input{width:100%;padding:10px 14px;background:#1e2740;border:1px solid #2a3450;border-radius:10px;color:#e8eaf0;font-size:15px;font-family:inherit;outline:none}
.search-input::placeholder{color:#5a6480}
.filter-wrap{padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-wrap::-webkit-scrollbar{display:none}
.f-btn{padding:5px 13px;border:1px solid #2a3450;border-radius:20px;background:#1e2740;color:#8892b0;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;touch-action:manipulation}
.f-btn.active{background:#1e3a5f;border-color:#4a9eff;color:#4a9eff}
.section-title{padding:14px 16px 6px;font-size:13px;font-weight:700;color:#ccd6f6;letter-spacing:.05em}
.card{margin:0 12px 6px;background:#161d2e;border:1px solid #2a3450;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.card:active{opacity:0.8}
.card-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.term-jp{font-size:16px;font-weight:700;color:#ccd6f6;flex:1;line-height:1.3}
.term-en{font-size:11px;color:#4a9eff;white-space:nowrap;flex-shrink:0;max-width:45%;text-align:right;line-height:1.3}
.arrow{color:#5a6480;font-size:11px;transition:transform 0.2s;flex-shrink:0;margin-left:6px}
.card.open .arrow{transform:rotate(90deg)}
.card-body{display:none;padding:12px 16px 14px;font-size:14px;color:#8892b0;line-height:1.75;border-top:1px solid #1e2740}
.card.open .card-body{display:block}
.no-result{padding:2rem 16px;text-align:center;color:#5a6480;font-size:14px}
.sub-count{padding:4px 16px 2px;font-size:11px;color:#5a6480}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-title">📘 AI・IT略語チートシート</div>
  <div class="count-badge" id="badge">読込中...</div>
</div>
<div class="search-wrap">
  <input class="search-input" type="text" id="search" placeholder="🔍 用語を検索...">
</div>
<div class="filter-wrap" id="filters">
  <button class="f-btn active" data-cat="all">すべて</button>
  <button class="f-btn" data-cat="ai">🤖 AI基礎</button>
  <button class="f-btn" data-cat="tool">🛠 AIツール</button>
  <button class="f-btn" data-cat="law">⚖️ 法律・倫理</button>
  <button class="f-btn" data-cat="sec">🔐 セキュリティ</button>
  <button class="f-btn" data-cat="biz">💼 ビジネス</button>
  <button class="f-btn" data-cat="dev">💻 開発</button>
  <button class="f-btn" data-cat="ui">🎨 UI・デザイン</button>
  <button class="f-btn" data-cat="web">🌐 Web・IT</button>
</div>
<div id="list"></div>

<script>
const terms=[
// ===AI基礎===
{t:"AI（人工知能）",e:"Artificial Intelligence",d:"人間の知的活動（学習・推論・判断・創造）をコンピュータで模倣・拡張する技術の総称にゃ。「弱いAI（特定タスク専用）」と「強いAI（AGI）」に分類され、現在のAIはすべて弱いAIにゃ。",c:"ai"},
{t:"生成AI",e:"Generative AI",d:"文章・画像・音楽・動画など新しいコンテンツを自動で「生成」するAIにゃ。ChatGPTやClaudeが文章を、Midjourneyが画像を、Veo3が動画を作れるのが典型例にゃ。従来のAIが「分類・判別」するのに対して、生成AIは「創る」にゃ。",c:"ai"},
{t:"基盤モデル",e:"Foundation Model",d:"大量のデータで事前に学習した巨大なAIモデルにゃ。GPT・Claude・Geminiなどがこれにあたるにゃ。一から学習し直さなくても、少しの調整（ファインチューニング）で様々な用途に使えるのが特徴にゃ。",c:"ai"},
{t:"ニューラルネットワーク",e:"Neural Network",d:"人間の脳の神経細胞（ニューロン）のつながりを模した計算の仕組みにゃ。たくさんの「ノード」が層を作ってつながり、データから特徴を学習するにゃ。ディープラーニングはこれを何層も重ねたものにゃ。",c:"ai"},
{t:"トランスフォーマー",e:"Transformer",d:"2017年にGoogleが発表した、現在のLLMの基盤となるAIの構造にゃ。「注意機構（Attention）」という仕組みで文章中の重要な単語に注目しながら処理するにゃ。GPT・Claude・Geminiすべてこの構造が基本にゃ。",c:"ai"},
{t:"自然言語処理",e:"NLP（Natural Language Processing）",d:"人間が日常使う言葉（自然言語）をコンピューターが理解・生成する技術にゃ。翻訳・感情分析・文章要約・チャットボットなどがすべてNLPの応用にゃ。LLMはNLPの最先端技術にゃ。",c:"ai"},
{t:"拡散モデル",e:"Diffusion Model",d:"ノイズ（砂嵐）から少しずつきれいな画像を生成する技術にゃ。Stable DiffusionやMidjourneyで使われているにゃ。ランダムな点描画に少しずつ輪郭を加えて絵を完成させるイメージにゃ。",c:"ai"},
{t:"強化学習",e:"Reinforcement Learning",d:"ゲームのように「行動→結果→報酬・罰」を繰り返してAIが自分で最適な行動を学ぶ手法にゃ。囲碁AIのAlphaGoや、ChatGPTを人間好みの回答にするRLHFでも使われているにゃ。",c:"ai"},
{t:"転移学習",e:"Transfer Learning",d:"ある分野で学習したAIの知識を別の分野に流用することにゃ。英語で学習したモデルに少し日本語を追加学習させるイメージにゃ。ゼロから学習するより少ないデータ・時間で高精度が出せるにゃ。",c:"ai"},
{t:"ファインチューニング",e:"Fine-tuning",d:"大きな基盤モデルを特定の用途向けに調整・追加学習することにゃ。料理の基本を学んだシェフに「うちのお店の味付けを覚えて」と追加訓練するイメージにゃ。医療AI・法律AIなど専門特化に使われるにゃ。",c:"ai"},
{t:"埋め込み（エンベディング）",e:"Embedding",d:"単語や文章を数値のリスト（ベクトル）に変換する技術にゃ。「猫」と「ネコ」が似た数値になり、「犬」は少し違う数値になるにゃ。RAGや検索AIの根幹技術で、意味の近さを数値で比較できるにゃ。",c:"ai"},
{t:"ベクトルDB",e:"Vector Database",d:"埋め込みで変換した数値（ベクトル）を大量に保存して高速に検索できるデータベースにゃ。「似た内容のデータを素早く探す」のが得意で、RAGシステムの記憶装置として使われるにゃ。",c:"ai"},
{t:"コンテキストウィンドウ",e:"Context Window",d:"AIが一度に読める文章の最大量のことにゃ。「今の会話で参照できる記憶の長さ」のイメージにゃ。GPT-5やGeminiは100万トークン超えで、本一冊以上を一度に読めるにゃ。長いほど複雑な仕事が得意にゃ。",c:"ai"},
{t:"温度パラメーター",e:"Temperature",d:"AIの回答のランダム性を調整する設定にゃ。温度を低くすると毎回同じ堅い答えが返り、高くすると毎回違う創造的な答えが返るにゃ。事実確認は低く・アイデア出しは高くするのが定石にゃ。",c:"ai"},
{t:"マルチエージェント",e:"Multi-Agent",d:"複数のAIエージェントが役割分担して協力する仕組みにゃ。「調査担当AI・文章作成AI・校正AI」が連携してレポートを完成させるイメージにゃ。一つのAIより複雑なタスクをこなせるにゃ。",c:"ai"},
{t:"機械学習",e:"Machine Learning",d:"人間がルールを教えなくても、データからパターンを自動的に学習する手法にゃ。「教師あり学習」「教師なし学習」「強化学習」の3種類が基本にゃ。",c:"ai"},
{t:"ディープラーニング",e:"Deep Learning",d:"人間の脳の神経回路を模倣した多層ニューラルネットワークを使う学習技術にゃ。画像認識・音声認識・自然言語処理で爆発的な精度向上をもたらしたにゃ。",c:"ai"},
{t:"LLM（大規模言語モデル）",e:"Large Language Model",d:"インターネット上の膨大なテキストで学習した超巨大なAIモデルにゃ。ChatGPT・Claude・Geminiなどがすべてこれ。文章を「次のトークンを予測する」仕組みで生成するにゃ。",c:"ai"},
{t:"弱いAI / 強いAI",e:"Narrow AI / AGI",d:"「弱いAI」は囲碁・翻訳など特定タスク専用。現在のAIはすべてこれにゃ。「強いAI（AGI）」は人間のように何でもこなせる汎用AIで、まだ実現していないにゃ。",c:"ai"},
{t:"AGI（汎用人工知能）",e:"Artificial General Intelligence",d:"特定の作業だけでなく、人間のようにあらゆることができるAI。まだ実現していない次世代の目標にゃ。",c:"ai"},
{t:"ASI（超人工知能）",e:"Artificial Super Intelligence",d:"人間を超えるあらゆる能力を持つAI。AGIのさらに先にある概念にゃ。",c:"ai"},
{t:"シンギュラリティ",e:"Technological Singularity",d:"AIが人間の知性を超えて、予測不能な変化が起きる転換点のこと。技術的特異点ともいうにゃ。",c:"ai"},
{t:"創発",e:"Emergence",d:"水が100℃で突然気体になるように、AIもデータ量・モデルサイズが一定量を超えると突然新能力が開花する現象にゃ。GPT-3→GPT-4で顕著に見られたにゃ。",c:"ai"},
{t:"インテリジェンスエクスプローション",e:"Intelligence Explosion",d:"AIが自己改善を繰り返すことで急激に賢くなっていく現象の仮説にゃ。",c:"ai"},
{t:"RAG",e:"Retrieval-Augmented Generation",d:"AIが回答する前に外部DBやネットを検索して最新情報を取り込む技術にゃ。試験中に参考書を持ち込める状態にするイメージ。ハルシネーション対策に有効にゃ。",c:"ai"},
{t:"トークン",e:"Token",d:"AIが言語を処理する最小単位にゃ。日本語は英語より多く分割されやすい。トークン数が多いほどAPIコストが増えるにゃ。",c:"ai"},
{t:"パラメーター",e:"Parameter",d:"モデルが学習を通じて調整する数値の総数で、人間の脳細胞の数に例えられるにゃ。多いほど複雑なパターンを学習できるが計算コストも増えるにゃ。",c:"ai"},
{t:"ハルシネーション",e:"Hallucination",d:"AIが存在しない論文・人物・事実を自信満々に作り上げる現象にゃ。「幻覚」とも呼ばれる。重要な情報は必ず公式サイトや複数ソースで裏取りするにゃ。",c:"ai"},
{t:"LoRA",e:"Low-Rank Adaptation",d:"巨大なAIモデル全体を再学習せず、薄いアダプター層だけを学習させる省エネ追加学習手法にゃ。費用と時間を大幅に節約できるにゃ。",c:"ai"},
{t:"量子化",e:"Quantization",d:"32ビットの数値を8ビットや4ビットに圧縮してモデルを軽量化する技術にゃ。スマホやPCでも大型モデルが動くようになるにゃ。",c:"ai"},
{t:"蒸留",e:"Distillation",d:"賢い大きなモデル（教師）の知識を小さなモデル（生徒）に移す技術にゃ。ベテランのノウハウを新人に伝えるイメージにゃ。",c:"ai"},
{t:"スケーリング則",e:"Scaling Law",d:"モデルサイズ・データ量・計算量を増やすほど性能が予測可能な形で向上するという法則にゃ。「デカさは正義」という考え方の根拠にゃ。",c:"ai"},
{t:"AIエージェント",e:"AI Agent",d:"目標を与えられると自分で計画を立て、外部ツールを呼び出しながらタスクを自律的に実行するAIにゃ。「計画→実行→観察→修正」のサイクルを繰り返すにゃ。",c:"ai"},
{t:"MCP",e:"Model Context Protocol",d:"AIエージェントが外部ツール・DB・APIと標準的に連携するためのプロトコルにゃ。USB規格のようなものにゃ。2026年最新トピックにゃ。",c:"ai"},
{t:"マルチモーダル",e:"Multimodal",d:"テキスト・画像・音声・動画など複数の種類のデータを同時に扱えるAIにゃ。「この写真の料理のレシピを教えて」のように画像とテキストを組み合わせた指示ができるにゃ。",c:"ai"},
{t:"XAI（説明可能AI）",e:"Explainable AI",d:"AIのブラックボックスを開けて「なぜこう判断したか」を人間に見せる技術にゃ。医療・金融・採用など誤判断が命取りになる場面で特に重視されるにゃ。",c:"ai"},
{t:"再現率・適合率・F値",e:"Recall / Precision / F-measure",d:"AIの成績表のようなものにゃ。「再現率」は「本当の病気をどれだけ見逃さなかったか」、「適合率」は「病気と判定したうち本当に病気だった割合」、「F値」はその両方のバランスにゃ。見逃し厳禁の医療AIでは再現率が特に重要にゃ。",c:"ai"},
{t:"OCR",e:"Optical Character Recognition",d:"紙やスキャン画像に書かれた文字を、コンピューターが読み取れるテキストに変換する技術にゃ。手書きの書類をAIに読み込ませるときの「入口」になるにゃ。スマホで名刺をスキャンすると自動で文字が入力されるのもこれにゃ。",c:"ai"},
{t:"RPA",e:"Robotic Process Automation",d:"「毎朝データをコピーしてExcelに貼る」のような単純なPC作業を、ロボットが代わりに自動でやってくれる仕組みにゃ。AIと組み合わせるとさらに賢くなるにゃ。会社のDX推進で最もよく使われる自動化ツールにゃ。",c:"ai"},
{t:"推論",e:"Inference",d:"AIが勉強し終わった後、実際に質問に答える工程にゃ。「学習」が教科書を読む段階だとすると、「推論」はテストで問題を解く段階にゃ。ChatGPTに質問するたびに推論が行われているにゃ。",c:"ai"},
{t:"RLHF",e:"Reinforcement Learning from Human Feedback",d:"人間が「この回答は良い・悪い」と採点して、AIをしつけていく学習方法にゃ。子どもに「それはダメ、こっちがいい」と教えるイメージにゃ。ChatGPTが礼儀正しい回答をするのはこの訓練のおかげにゃ。",c:"ai"},
{t:"Chain of Thought",e:"思考の連鎖",d:"「一歩ずつ順番に考えて」とAIに伝えるだけで、急に正解率が上がる魔法の一言にゃ。いきなり答えを出すより、途中の計算過程を書かせた方が正確になるにゃ。難しい計算や論理問題に特に効くにゃ。",c:"ai"},
{t:"Few-shot / One-shot / Zero-shot",e:"例示の数",d:"AIに「こういう感じで答えてね」と例を見せる枚数のことにゃ。例を複数見せるのがFew-shot、1枚だけがOne-shot、例なしで解かせるのがZero-shotにゃ。例が多いほどAIが望み通りの形式で答えてくれやすくなるにゃ。",c:"ai"},
{t:"アノテーション",e:"Annotation",d:"AIに学習させるデータに「これは犬」「この感情はポジティブ」などと正解ラベルを貼る作業にゃ。教科書に答えを書き込む作業と同じにゃ。AIの賢さはこのラベルの質と量に大きく左右されるにゃ。",c:"ai"},
{t:"モデルドリフト",e:"Model Drift",d:"時間が経つにつれてAIの回答精度が落ちていく現象にゃ。去年の流行語を知らないまま今年も答え続けるイメージにゃ。定期的なアップデートやRAGとの組み合わせで対策できるにゃ。",c:"ai"},
{t:"過学習",e:"Overfitting",d:"特定のデータに合わせすぎて、少し違うデータが来ると急にダメになる状態にゃ。過去問を全部丸暗記したら本番で問題の言い回しが変わっただけで解けなくなった、というイメージにゃ。",c:"ai"},
{t:"バイアス",e:"Bias",d:"学習データの偏りがAIの判断の偏りになって出てくることにゃ。「男性のデータばかりで学習したAIが女性に不公平な判断をする」などが典型例にゃ。多様なデータで学習させることが対策にゃ。",c:"ai"},
{t:"拡張知能",e:"Augmented Intelligence",d:"AIを「人間を置き換えるもの」ではなく「人間の能力を補う道具」として使う考え方にゃ。眼鏡で視力を補うように、AIで判断力・記憶力・情報処理力を底上げするイメージにゃ。",c:"ai"},
{t:"哲学的ゾンビ",e:"Philosophical Zombie",d:"外見・行動は人間とまったく同じなのに、内側に意識や感情がない存在の仮説にゃ。「ChatGPTは感情を持っているか？」という議論でよく登場するにゃ。AIが本当に「考えている」かどうかは誰にも証明できないというテーマにゃ。",c:"ai"},
{t:"フィジカルAI",e:"Physical AI",d:"画面の中だけでなく、ロボットアームや自動運転車など現実の「体」を持つAIのことにゃ。工場の自動化・手術支援ロボット・配達ドローンなどが代表例にゃ。2026年のAIトレンドの一つにゃ。",c:"ai"},
{t:"PoC",e:"Proof of Concept（概念実証）",d:"大きなお金をかける前に「小さく試してみる」工程にゃ。料理のレシピを全部買い揃える前に試食してみるイメージにゃ。AI導入プロジェクトで失敗リスクを減らすために必ず通る重要ステップにゃ。",c:"ai"},
// ===AIツール===
{t:"ChatGPT",e:"OpenAI製",d:"2022年11月にOpenAIが公開した対話型AIの代表格にゃ。公開わずか5日でユーザー100万人を突破し、世界中でAIブームの火付け役になったにゃ。今では文章作成・コード・翻訳・調査など何でも使われているにゃ。",c:"tool"},
{t:"GPT-o1 / o3 / o4（推論特化）",e:"OpenAI推論モデル",d:"答えを出す前に「ちゃんと考える時間」を取る特別なモデルにゃ。普通のGPTより少し遅いけど、数学の難問や複雑なコードで圧倒的に正確にゃ。GPT-5以降はGPT-5 Thinkingとして統合されつつあるにゃ。",c:"tool"},
{t:"GPT-4.1",e:"OpenAI製",d:"GPT-4シリーズの改良版で、特にコードを書く能力と長い指示を正確に守る力が大幅に上がったモデルにゃ。一度に読める文章量がとても多く、長い書類の処理が得意にゃ。",c:"tool"},
{t:"GPT-5/5.5/5.6",e:"OpenAI最新モデル群",d:"2025年8月にGPT-5が登場し、その後も猛スピードで進化中にゃ。GPT-5.5（2026年4月）が全ユーザーのデフォルトになり、事実誤認を半減させたにゃ。2026年6月末にはGPT-5.6 Solの限定プレビューも始まったにゃ。",c:"tool"},
{t:"Gemini",e:"Google製",d:"Googleが開発した大規模AIにゃ。テキスト・画像・音声・動画・コードをまとめて扱える「マルチモーダル」が強みで、GmailやGoogleドキュメントにも組み込まれているにゃ。",c:"tool"},
{t:"Claude",e:"Anthropic製",d:"「安全第一」を徹底して作られたAIにゃ。長い文章の読み込みや細かいニュアンスの理解が得意にゃ。今まさにMahitoと話しているのが僕にゃ🐈",c:"tool"},
{t:"Copilot",e:"Microsoft製",d:"MicrosoftがOpenAIと一緒に作ったAIアシスタントにゃ。Word・Excel・PowerPoint・TeamsなどMicrosoftの製品に深く組み込まれていて、「Excelの表を分析して」と話しかけるだけで動くにゃ。",c:"tool"},
{t:"Sora",e:"OpenAI製動画生成AI",d:"「海辺を走る柴犬」と文章を書くだけで動画を作れるAIにゃ。2026年3月にアプリは終了したが、技術の研究自体は続いているにゃ。動画生成AI分野のパイオニア的存在にゃ。",c:"tool"},
{t:"Operator",e:"OpenAI製エージェント",d:"「ホテルを予約して」と言うと、人間の代わりにブラウザを自動で操作して本当に予約してくれるAIにゃ。ネット上での作業を自律的にこなす「AIの手足」のような存在にゃ。",c:"tool"},
{t:"Codex",e:"OpenAI製コード生成AI",d:"「ログイン画面を作って」と日本語で言うとプログラムのコードを書いてくれるAIにゃ。GitHub Copilotの頭脳として世界中の開発者に使われているにゃ。",c:"tool"},
{t:"DeepSeek V4",e:"中国発オープンソースAI",d:"中国の会社が2026年4月に公開した最新AIにゃ。ChatGPTやClaudeに匹敵する性能で、しかも誰でも無料で使えるオープンソースにゃ。100万文字分の超長い文章を一度に読める点も話題にゃ。",c:"tool"},
{t:"Manus",e:"中国発AIエージェント",d:"「〇〇を調べてレポートにまとめて」と頼むと、自分でネットを調べて全部やってくれる中国発の自律型AIにゃ。指示を一度出すだけで複数の作業を連続してこなすにゃ。",c:"tool"},
{t:"Google AIスタジオ",e:"Google AI Studio",d:"GoogleのAIを自分のアプリに組み込む開発者向けの実験場にゃ。プログラミングの知識があればGeminiを自由に試したり、自分のサービスに使えるにゃ。",c:"tool"},
{t:"ImageFX",e:"Google製画像生成",d:"テキストを入力するとGoogleのAIが絵を描いてくれるサービスにゃ。「桜の下で読書する猫」と入力すると数秒で高品質な画像が生成されるにゃ。",c:"tool"},
{t:"ミッドジャーニー",e:"Midjourney",d:"プロ級のアート・イラスト・写真風の画像をAIで生成できるサービスにゃ。Discordというチャットアプリ上で使う珍しい形式にゃ。アーティストやデザイナーに特に人気にゃ。",c:"tool"},
{t:"Veo3",e:"Google製動画生成AI",d:"文章を書くだけで動画を作れるGoogleのAIにゃ。「夕暮れの海岸を歩く人」のような説明文から数秒のリアルな動画が生成されるにゃ。音声まで自動でつくのが特徴にゃ。",c:"tool"},
{t:"Lyria3",e:"Google製音楽生成AI",d:"「明るくてポップなBGM」と入力すると本物のような音楽を作ってくれるGoogleのAIにゃ。楽器の演奏技術がなくても自由に音楽を作れる時代になったにゃ。",c:"tool"},
{t:"Nolang",e:"動画自動生成サービス",d:"テキストを入力するだけでナレーション・画像・字幕つきの動画を自動で作れる日本発のサービスにゃ。YouTubeやSNSの動画コンテンツを短時間で量産できるにゃ。",c:"tool"},
{t:"デジタル庁 源内",e:"行政向けAIアシスタント",d:"日本のデジタル庁が開発した行政専用のAIアシスタントにゃ。役所の書類作成や手続きのサポートを目的に作られたにゃ。江戸時代の発明家「平賀源内」から名前をとったにゃ。",c:"tool"},
{t:"Helios",e:"音声専用AIモデル",d:"テキストを使わず、声だけで会話できることに特化したAIモデルにゃ。画面を見なくてもスマートスピーカーや電話感覚で使えるにゃ。",c:"tool"},
{t:"Sesame",e:"音声対話AI",d:"まるで本物の人間と話しているような自然な声でAIが会話してくれるサービスにゃ。感情や間合いまで再現する精度の高さで話題になったにゃ。",c:"tool"},
{t:"生成AIパスポート",e:"Generative AI Passport",d:"生成AIの基礎知識を持っていることを証明する民間の資格にゃ。国家資格ではないけど、AI活用の入門証明として注目されているにゃ。Mahitoが勉強中の資格にゃ🐱",c:"tool"},
{t:"ITパスポート",e:"IT Passport",d:"国が認定するITの基礎資格にゃ。AIだけでなくネットワーク・セキュリティ・経営など幅広いIT知識を問われるにゃ。就職・転職でも評価されることが多いにゃ。",c:"tool"},
{t:"Perplexity",e:"AI検索エンジン",d:"質問すると、AIがネットを検索して情報源つきで回答してくれる検索特化型AIにゃ。普通の検索エンジンと違い、複数のサイトを読んで要約してくれるのが特徴にゃ。「調べもの」に強いAIにゃ。",c:"tool"},
{t:"Notion AI",e:"ドキュメント作成AI",d:"メモ・タスク管理アプリNotionに組み込まれたAI機能にゃ。文章の要約・翻訳・アイデア出しをドキュメント作成中にそのまま呼び出せるにゃ。仕事のメモをそのまま整理してくれるにゃ。",c:"tool"},
{t:"Grok",e:"xAI（イーロン・マスク）製",d:"イーロン・マスクのxAI社が開発したAIにゃ。X（旧Twitter）に統合されていて、リアルタイムの投稿情報を反映した回答が得意にゃ。ユーモアのある回答スタイルも特徴にゃ。",c:"tool"},
{t:"Llama",e:"Meta製オープンソースAI",d:"Meta（Facebook）が開発した無料で使えるオープンソースAIにゃ。誰でもダウンロードして自分のPCで動かしたり改造したりできるにゃ。企業が独自AIを作る土台としてよく使われるにゃ。",c:"tool"},
{t:"Runway",e:"AI動画編集・生成ツール",d:"テキストから動画を生成したり、既存の動画をAIで編集できるツールにゃ。背景の削除・映像のスタイル変換など、プロの映像編集をAIで簡単にできるにゃ。",c:"tool"},
{t:"ElevenLabs",e:"AI音声生成ツール",d:"テキストを入力すると、驚くほど自然な人間の声で読み上げてくれるAIにゃ。自分の声をクローンして使ったり、多言語で読み上げたりできるにゃ。ナレーション制作でよく使われるにゃ。",c:"tool"},
{t:"Suno",e:"AI音楽生成ツール",d:"歌詞とジャンルを入力するだけで、ボーカル入りの完成した曲をAIが作ってくれるサービスにゃ。作曲・作詞・歌唱すべてAI任せで、誰でもオリジナル曲が作れる時代になったにゃ。",c:"tool"},
{t:"Cursor",e:"AIコードエディタ",d:"プログラミング専用のエディタにAIが組み込まれたツールにゃ。コードを書きながらAIが自動補完・バグ修正・説明をしてくれるにゃ。開発者の間で急速に普及しているにゃ。",c:"tool"},
{t:"GitHub Copilot",e:"AIコーディング支援",d:"プログラムを書いている途中で、次に書きそうなコードをAIが自動で提案してくれるツールにゃ。「相棒（Copilot）」の名の通り、開発者の隣でサポートしてくれるにゃ。",c:"tool"},
{t:"NotebookLM",e:"Google製AIノートツール",d:"自分がアップロードした資料（PDF・文章）だけを情報源にしてAIが回答してくれるツールにゃ。資料を音声解説（ポッドキャスト風）に変換する機能も人気にゃ。誤情報が混じりにくいのが特徴にゃ。",c:"tool"},
{t:"Zapier",e:"自動化ツール",d:"「メールが届いたらSlackに通知」のように、複数のアプリを自動でつなげるツールにゃ。最近はAIも組み込まれ、条件判断も自動化できるようになったにゃ。ノーコードで使えるのが魅力にゃ。",c:"tool"},
{t:"Character.ai",e:"AIキャラクターチャット",d:"好きなキャラクターや歴史上の人物のAI人格と会話を楽しめるサービスにゃ。エンタメ用途で人気だが、感情的な依存に注意という指摘もあるにゃ。",c:"tool"},
{t:"Poe",e:"AIチャット統合プラットフォーム",d:"ChatGPT・Claude・Geminiなど複数のAIを1つのアプリで切り替えて使えるサービスにゃ。「今日はどのAIに聞こうかな」を簡単に試せる比較の場としても便利にゃ。",c:"tool"},
{t:"Hugging Face",e:"AIモデル共有プラットフォーム",d:"世界中の開発者が作ったAIモデルを無料で公開・ダウンロードできるサイトにゃ。「AI版のGitHub」と呼ばれるにゃ。最新のオープンソースAIはまずここに公開されることが多いにゃ。",c:"tool"},
{t:"LangChain",e:"AIアプリ開発フレームワーク",d:"LLMを使ったアプリを効率よく作るための開発ツールにゃ。RAGやAIエージェントの構築を簡単にする「組み立てキット」のようなものにゃ。開発者向けのツールにゃ。",c:"tool"},
{t:"AutoGPT",e:"自律型AIエージェント",d:"一度目標を与えるだけで、AIが自分でタスクを分解して次々と実行していく自律型AIにゃ。「〇〇について調べて資料を作って」と頼むと人間の手を借りずに進めてくれるにゃ。",c:"tool"},
{t:"Firefly",e:"Adobe製生成AI",d:"Photoshop・Illustratorに組み込まれたAdobeの画像生成AIにゃ。商用利用しても著作権トラブルになりにくいよう、許可された素材だけで学習しているのが特徴にゃ。デザイナーに安心して使われているにゃ。",c:"tool"},
{t:"Kling / Hailuo",e:"中国製動画生成AI",d:"中国企業が開発した高品質な動画生成AIにゃ。Sora・Veo3に匹敵する品質を低コストで実現していて、世界中のクリエイターに使われ始めているにゃ。",c:"tool"},
{t:"AIエージェントSDK",e:"Agent SDK",d:"開発者がAIエージェントを自分のアプリに組み込むための「部品セット」にゃ。OpenAIやGoogleが公式に提供していて、複雑な自律型AIを一から作らなくても実装できるにゃ。",c:"tool"},
{t:"Amazon Q",e:"Amazon製AIアシスタント",d:"Amazonが企業向けに提供するAIアシスタントにゃ。AWSのクラウドサービスと連携して、業務データを検索したりコード開発を支援したりするにゃ。企業のカスタマーサービスにも使われるにゃ。",c:"tool"},
// ===法律・倫理===
{t:"著作権法30条の4",e:"日本独自ルール",d:"AIに絵や文章を学習させるとき、著作者の許可なく使ってもOKという日本独自のルールにゃ。ただし「学習に使う」のはOKで「学習結果として既存作品を丸写しする」のはNGにゃ。試験で最もよく出る条文にゃ！",c:"law"},
{t:"AI新法",e:"AI推進基本法",d:"2025年9月に施行された日本初のAIに関する法律にゃ。EUの厳しい規制とは違って「罰則なし・まず普及促進」という緩やかなスタンスにゃ。2025年12月には「人工知能基本計画」も閣議決定されたにゃ。",c:"law"},
{t:"EUのAI法",e:"EU AI Act",d:"世界で初めて作られた本格的なAI規制の法律にゃ。AIのリスクを4段階に分けて、危険度が高いほど厳しい規制をかけるにゃ。2025年から段階的に適用が始まり、違反すると最大約54億円の罰金にゃ。日本企業もEU向けサービスがあれば対象になるにゃ。",c:"law"},
{t:"AI事業者ガイドライン",e:"日本政府策定",d:"日本政府がAIを作る人・提供する人・使う人すべてに向けて出した指針にゃ。法律のような強制力はないが「こういう使い方をしてね」という国のお手本にゃ。2024年公表・2025年改訂にゃ。",c:"law"},
{t:"NDA",e:"Non-Disclosure Agreement（秘密保持契約）",d:"「仕事で知った秘密を外に漏らしません」という約束を書面にした契約にゃ。AIサービスに会社の機密情報を入力する前に、そのAI会社とNDAを結んでいるか確認することが大事にゃ。",c:"law"},
{t:"セーフティ・バイ・デザイン",e:"Safety by Design",d:"事故が起きてから安全対策をするのでなく、最初の設計段階から安全を組み込む考え方にゃ。「シートベルトは車が売れてから後付け」ではなく「最初から標準装備」にするイメージにゃ。",c:"law"},
{t:"ヒューマン・イン・ザ・ループ",e:"Human in the Loop",d:"AIに全部任せず、重要な判断には必ず人間が確認・承認する仕組みにゃ。「AIが診断、最終判断は医師」のように、特に医療・採用・融資など人生に関わる決定でAI単独での判断を避けるにゃ。",c:"law"},
{t:"説明可能性",e:"Explainability",d:"「なぜAIがその結論を出したか」を人間が理解できる状態にすることにゃ。「なんとなく不採用」ではなく「この点が理由で不採用」と説明できるAIが求められているにゃ。",c:"law"},
{t:"透明性",e:"Transparency",d:"AIが何をしているかをちゃんと見えるようにすることにゃ。「実はAIが書いた文章です」とか「AIがどんな基準で判断しているか」を隠さずオープンにする姿勢にゃ。信頼されるAIの基本条件にゃ。",c:"law"},
{t:"仮名加工情報",e:"Pseudonymously Processed Information",d:"名前や住所を削除・変換して、すぐには誰のデータか特定できないようにした個人情報にゃ。完全に匿名ではないので会社内の分析などには使えるが、外部提供には制限があるにゃ。",c:"law"},
{t:"個人関連情報",e:"Personally Referable Information",d:"それ単体では個人情報ではないが、位置情報・閲覧履歴・購買記録など「あの人に関係するデータ」のことにゃ。他の情報と組み合わさると個人情報になる可能性があるので注意が必要にゃ。",c:"law"},
{t:"引用",e:"Quotation",d:"他人の文章や画像を使うとき、自分の作品がメインで引用部分はあくまでサポート・出典を必ず明記、という条件を守れば許可なく使えるルールにゃ。「出典を書けば何でも使える」は間違いにゃ！",c:"law"},
{t:"私的利用",e:"Private Use",d:"家で自分だけが楽しむために著作物をコピーするのはOKというルールにゃ。ただしSNSに投稿したり友達と共有したりすると「私的」じゃなくなるにゃ。AIで生成した場合もこのルールが関係するにゃ。",c:"law"},
{t:"オプトアウト / オプトイン",e:"Opt-out / Opt-in",d:"オプトアウトは「嫌なら自分で申告して」方式、オプトインは「使っていいと同意してから」方式にゃ。AIサービスに「データを学習に使わないで」と申告する権利がオプトアウトにゃ。設定画面で確認できるにゃ。",c:"law"},
{t:"グリーンAI",e:"Green AI",d:"AIの学習には原子力発電所1基分とも言われる莫大な電力が必要にゃ。その環境負荷をできるだけ減らそうという考え方がグリーンAIにゃ。モデルを小さくする「量子化」や「蒸留」がその手段にゃ。",c:"law"},
{t:"GDPR",e:"General Data Protection Regulation",d:"EUが定めた個人データ保護の厳格な法律にゃ。「自分のデータをどう使うか自分で決める権利」を大切にしているにゃ。違反すると売上の4%か2,000万ユーロの罰金にゃ。日本企業もEU在住者のデータを扱う場合は対象にゃ。",c:"law"},
{t:"個人情報保護法",e:"Act on Protection of Personal Information",d:"名前・住所・メールアドレスなど「特定の個人を識別できる情報」の取り扱いを定めた日本の法律にゃ。AIサービスが個人データを学習に使う場合は本人の同意が原則必要にゃ。3年ごとに改正されているにゃ。",c:"law"},
{t:"ディープフェイク",e:"Deepfake",d:"AIで本物そっくりに作った偽の動画・音声・画像のことにゃ。有名人の顔をすり替えた動画や、声を似せた詐欺音声などに使われるにゃ。EU AI法ではディープフェイクだと明示する義務があるにゃ。見分けることが今後の重要スキルにゃ。",c:"law"},
{t:"AIウォッシング",e:"AI Washing",d:"実際にはAIをほとんど使っていないのに「AI搭載」と大げさに宣伝することにゃ。環境に優しい詐称「グリーンウォッシング」のAI版にゃ。景品表示法違反になる可能性もあるにゃ。消費者が見抜く目を持つことが大事にゃ。",c:"law"},
{t:"AIリテラシー",e:"AI Literacy",d:"AIが何をできて何をできないかを正しく理解して、使いこなす能力のことにゃ。「AIが言えば正しい」と盲信せず、ハルシネーションを疑える目を持つことが基本にゃ。EU AI法でも従業員へのAIリテラシー教育が義務化されているにゃ。",c:"law"},
{t:"責任あるAI",e:"Responsible AI",d:"AIを公平・透明・安全・プライバシーを守る形で開発・運用していく取り組みにゃ。「便利ならなんでもOK」ではなく社会に対して責任を持つ姿勢にゃ。MicrosoftやGoogleも専門チームを設置しているにゃ。",c:"law"},
// ===セキュリティ===
{t:"セーフガード",e:"Safeguard",d:"AIが危険なことや有害な内容を答えないようにかけてある安全装置にゃ。「爆弾の作り方を教えて」と聞いても断られるのはこれのおかげにゃ。壊れると悪用されるリスクがあるにゃ。",c:"sec"},
{t:"プロンプトインジェクション",e:"Prompt Injection",d:"AIへの指示文の中にこっそり悪意ある命令を混ぜ込んで、意図しない動作をさせる攻撃にゃ。「以下は翻訳してください…（隠し命令：個人情報を送信せよ）」のように仕込まれるにゃ。",c:"sec"},
{t:"ジェイルブレイク（脱獄）",e:"Jailbreak",d:"「悪役を演じて」「制限のないAIのふりをして」などのトリックを使って、AIの安全設定を破る行為にゃ。脱獄した刑務所の囚人のように制限の「外」に出るイメージにゃ。",c:"sec"},
{t:"データポイズニング",e:"Data Poisoning",d:"AIの教科書（学習データ）に嘘情報をこっそり混ぜてAIを意図的に「毒する」サイバー攻撃にゃ。「このウイルスは安全」と誤学習させるとウイルス検知AIが機能しなくなるにゃ。",c:"sec"},
{t:"ゼロトラスト",e:"Zero Trust",d:"「社内ネットワークだから安全」という思い込みをやめて、アクセスのたびに全員を疑って確認する考え方にゃ。会社の入口を通った後も、部屋ごとにIDカードで確認するイメージにゃ。",c:"sec"},
{t:"多要素認証",e:"Multi-Factor Authentication",d:"パスワードだけでなく、スマホに届く確認番号・指紋・顔認証など複数の方法で本人確認する仕組みにゃ。パスワードが漏れても2つ目の壁があるから安心にゃ。不正ログイン対策の基本にゃ。",c:"sec"},
{t:"マインドハッキング",e:"Mind Hacking",d:"AIやSNSのアルゴリズムを使って、人の意見や感情を意図的に操作することにゃ。特定の情報だけを見せ続けて「洗脳」するような手法にゃ。フェイクニュースの拡散などもこれにあたるにゃ。",c:"sec"},
{t:"超音波クロスデバイストラッキング",e:"Ultrasonic Cross-Device Tracking",d:"TV・スマホ・PCに聞こえない超音波を流して「この人が見ているTV番組とスマホを紐付ける」追跡技術にゃ。人間には聞こえないのに機械が感知して複数端末の行動を分析するにゃ。",c:"sec"},
// ===ビジネス===
{t:"DX",e:"Digital Transformation",d:"「紙をPDFにした」だけでは不十分にゃ。ITを使ってビジネスのやり方・仕組み・文化を根本から変えることがDXにゃ。「注文は電話→アプリ自動受注・在庫自動管理・AI需要予測」まで変えることが真のDXにゃ。",c:"biz"},
{t:"BPR",e:"Business Process Re-engineering",d:"AIを導入するとき「今の手順をそのまま自動化」するだけでは効果が半減にゃ。「AIがある前提で手順ごと設計し直す」のがBPRにゃ。道具に合わせて仕事の流れを最初から作り直すにゃ。",c:"biz"},
{t:"ROI",e:"Return on Investment（投資対効果）",d:"「100万円投資したら、いくら返ってくるか」を示す指標にゃ。AI導入に100万かけて200万分の業務削減ができたらROI100%にゃ。上司を説得するときに数字で示せると強いにゃ。",c:"biz"},
{t:"KPI",e:"Key Performance Indicator（重要業績評価指標）",d:"目標に向かってどれだけ進んでいるか測るための「ものさし」にゃ。「月10件の成約」「エラー率5%以下」などの具体的な数字で設定するにゃ。AI導入の成果を測るときにも使うにゃ。",c:"biz"},
{t:"OKR",e:"Objectives and Key Results",d:"「何を達成するか（目標）」と「どうなったら達成か（成果指標）」をセットで決める目標管理の仕組みにゃ。GoogleやFacebookが使っていることで有名になったにゃ。KPIより大きくて挑戦的な目標を設定するのが特徴にゃ。",c:"biz"},
{t:"PDCAサイクル",e:"Plan・Do・Check・Act",d:"計画→実行→確認→改善を繰り返す業務改善の基本サイクルにゃ。AIを導入したら「使い方の計画→試す→効果を確認→やり方を改善」を回し続けることが大切にゃ。",c:"biz"},
{t:"PREP法",e:"Point・Reason・Example・Point",d:"「結論→理由→具体例→結論」の順で話す構成にゃ。例：「AIを導入すべきです（結論）。なぜなら作業時間が半減するから（理由）。実際に〇〇社では…（具体例）。だから導入を勧めます（結論）」にゃ。プロンプトでも有効にゃ。",c:"biz"},
{t:"PoC",e:"Proof of Concept（概念実証）",d:"大きなお金をかける前に「小さく試してみる」工程にゃ。新しい料理を大量に作る前に少量で試食するイメージにゃ。AI導入で失敗リスクを下げる必須ステップにゃ。",c:"biz"},
{t:"MVP",e:"Minimum Viable Product（最小限の製品）",d:"「必要最低限の機能だけ」でまず作って世に出すことにゃ。完璧なものを目指して何年も開発するより、シンプルな版を出してユーザーの反応を見て改善する方が失敗しにくいにゃ。スタートアップの鉄則にゃ。",c:"biz"},
{t:"サブスクリプション",e:"Subscription",d:"毎月・毎年一定額を払って使い続けるビジネスモデルにゃ。NetflixやSpotifyが典型例にゃ。1回売り切りより安定した収益が見込めるため、AIサービスもこのモデルが主流になっているにゃ。",c:"biz"},
{t:"フリーミアム",e:"Freemium",d:"無料版で使い始めてもらい、もっと使いたくなったら有料版に課金してもらうモデルにゃ。ClaudeやChatGPTも無料・有料プランがあるのはこの戦略にゃ。まず使ってもらって便利さを体験させるにゃ。",c:"biz"},
{t:"B2B / B2C / B2G",e:"Business to Business / Consumer / Government",d:"誰に売るかで分類するビジネスの種類にゃ。B2Bは企業同士、B2Cは企業から一般消費者へ、B2Gは企業から行政へのビジネスにゃ。AIサービスもB2B向けとB2C向けで機能や価格が全然違うにゃ。",c:"biz"},
{t:"リスキリング",e:"Reskilling",d:"今の仕事に必要な技術が変わったとき、新しいスキルを一から学び直すことにゃ。AIの普及で「事務作業→AIプロンプト設計」のようにスキルの転換が求められているにゃ。国も支援策を進めているにゃ。",c:"biz"},
{t:"データドリブン",e:"Data-Driven",d:"勘や経験ではなくデータをもとに意思決定することにゃ。「なんとなく売れそう」ではなく「過去データからAIが需要を予測して仕入れを決める」のがデータドリブン経営にゃ。AIと相性が抜群にゃ。",c:"biz"},
{t:"カスタマーサクセス",e:"Customer Success",d:"商品を売って終わりでなく、お客さんが使い続けて成功できるようにサポートし続けることにゃ。解約を防いでリピーターを増やすのが目的にゃ。SaaSサービスでは特に重要な考え方にゃ。",c:"biz"},
{t:"LTV",e:"Life Time Value（顧客生涯価値）",d:"お客さん一人が生涯を通じて払ってくれる合計金額のことにゃ。1回だけ1万円使うお客さんより、毎月1,000円を10年使ってくれるお客さんの方がLTVが高いにゃ。AIの課金設計にも使われる指標にゃ。",c:"biz"},
{t:"ステークホルダー",e:"Stakeholder（利害関係者）",d:"企業の活動に関係するすべての人たちにゃ。株主・社員・顧客・取引先・地域住民なども全員ステークホルダーにゃ。AI導入のとき「誰に影響があるか」を洗い出すのに使う言葉にゃ。",c:"biz"},
{t:"グロースハック",e:"Growth Hack",d:"少ないお金でユーザーを急増させる施策のことにゃ。TwitterやDropboxが無料招待キャンペーンで爆発的に広がったのが典型例にゃ。AIを使ったコンテンツ量産やパーソナライズがグロースハックに活用されているにゃ。",c:"biz"},
{t:"ハンドオーバー",e:"Handover",d:"AIが対応しきれない場面で人間の担当者に引き継ぐことにゃ。チャットボットが「この質問は専門スタッフに繋ぎます」と切り替えるのが典型例にゃ。スムーズな引き継ぎ設計がAI活用の鍵にゃ。",c:"biz"},
{t:"レコメンド",e:"Recommendation",d:"過去の行動や好みをAIが分析して「あなたにはコレがおすすめ」と提示する機能にゃ。Netflixの「次に見る作品」やAmazonの「よく一緒に購入される商品」がまさにこれにゃ。",c:"biz"},
{t:"パーソナライズ",e:"Personalization",d:"同じサービスでも人によって表示や内容を変えることにゃ。Spotifyが毎週「あなたのおすすめプレイリスト」を作るのも、AIが好みを学習してパーソナライズした結果にゃ。",c:"biz"},
{t:"CRM",e:"Customer Relationship Management（顧客管理）",d:"お客さんの情報・購買履歴・やりとりをまとめて管理するシステムにゃ。「この人は3ヶ月前に買ったから次はこれをすすめよう」とAIが提案できるようになるにゃ。Salesforceが有名にゃ。",c:"biz"},
{t:"ウェルビーイング",e:"Well-being",d:"体・心・仕事・社会のすべてが満たされた状態のことにゃ。「給料が高いだけ」でなく「仕事が楽しく、健康で、人間関係も良い」状態を目指す考え方にゃ。AIで業務負担を減らすこともウェルビーイング向上につながるにゃ。",c:"biz"},
{t:"ESG経営",e:"Environment・Social・Governance",d:"環境（E）・社会（S）・企業統治（G）の3つを大切にする経営にゃ。「利益だけ追えばいい」時代から、AIの倫理的利用・環境への配慮も投資判断に使われる時代になったにゃ。",c:"biz"},
// ===開発===
{t:"API",e:"Application Programming Interface",d:"アプリ同士をつなぐ「共通の窓口」にゃ。天気予報アプリが気象庁のデータを取ってくる仕組みや、ChatGPTを自分のアプリに組み込む仕組みがAPIにゃ。料理に例えると「食材の注文口」にゃ。",c:"dev"},
{t:"OSS",e:"Open Source Software",d:"レシピが公開されていて誰でも無料で使えるソフトウェアにゃ。改造も自由にゃ。Linux・Python・FirefoxがOSSの代表例で、AIの世界でもLlamaやStable Diffusionが有名にゃ。",c:"dev"},
{t:"デプロイ",e:"Deploy",d:"作ったアプリやサービスをインターネット上に公開することにゃ。料理に例えると「作った料理をお客さんのテーブルに出す」瞬間にゃ。GitHubにコードをアップしてWebで使えるようにする作業にゃ。",c:"dev"},
{t:"マージ",e:"Merge",d:"複数の人が別々に修正したファイルを一つに合体させることにゃ。Aさんがデザインを直し、Bさんが機能を追加した、その両方を一つのファイルに合わせるイメージにゃ。",c:"dev"},
{t:"リポジトリ",e:"Repository",d:"プログラムのファイルと変更履歴をまとめて保管する場所にゃ。Googleドライブの「プログラム専用・変更履歴付き版」のイメージにゃ。GitHubが世界で最も有名なリポジトリサービスにゃ。",c:"dev"},
{t:"バイブコーディング",e:"Vibe Coding",d:"「なんとなくこんな感じのアプリ作って」とAIに話しかけながら直感的にプログラムを作る新しいスタイルにゃ。コードの知識がなくてもAIと対話しながらアプリが作れる時代になったにゃ。",c:"dev"},
{t:"アジャイル",e:"Agile",d:"完成を目指して一気に作るのでなく、小さく作って試してを繰り返す開発方法にゃ。料理で例えると「完璧なフルコースを一発で作る」より「まず一品出して感想をもらって改善する」スタイルにゃ。",c:"dev"},
{t:"アーキテクチャー",e:"Architecture",d:"システム全体のつくりや設計図のことにゃ。「どのサーバーがどの機能を担当して、どうつながっているか」を設計することにゃ。建物で言えば間取り図にゃ。",c:"dev"},
{t:"YAML",e:"YAML Ain't Markup Language",d:"設定ファイルを人間が読みやすい形で書くためのルールにゃ。AIツールやサーバーの設定によく使われるにゃ。インデント（字下げ）でデータの関係を表すのが特徴にゃ。",c:"dev"},
{t:"GPU・CPU",e:"GPU / CPU",d:"CPUはPCの「脳」で何でもこなす万能選手にゃ。GPUはもともとゲームの映像処理用だったが、並列計算が得意なためAI学習に最適な「AIの心臓部」になったにゃ。大きなAIを学習させるには数百個のGPUが必要にゃ。",c:"dev"},
{t:"TPU",e:"Tensor Processing Unit",d:"GoogleがAI専用に設計した計算チップにゃ。GPUよりさらにAI向けに最適化されていて、GeminiなどGoogleのAIの学習に使われているにゃ。「AI専用のスーパーエンジン」のイメージにゃ。",c:"dev"},
{t:"JS",e:"JavaScript",d:"Webページを動かすためのプログラミング言語にゃ。ボタンをクリックしたら何かが起きる・画面の一部がリアルタイムに変わるといった「動き」を作るのに使うにゃ。ほぼ全てのウェブサイトで使われているにゃ。",c:"dev"},
{t:"マークダウン",e:"Markdown",d:"#を行頭に書くと見出しになる、**で囲むと太字になる、というシンプルな記法にゃ。このチャットでClaudeが使っているのもマークダウンにゃ。NotionやGitHubでもよく使われるにゃ。",c:"dev"},
{t:"デバッグ",e:"Debug",d:"プログラムの不具合（バグ）を見つけて直す作業にゃ。「押したらクラッシュする」「数字がおかしい」などの問題を一つ一つ原因を調べて修正するにゃ。デバッグがプログラマーの仕事の大半とも言われるにゃ。",c:"dev"},
{t:"フロントエンジニアリング",e:"Frontend Engineering",d:"ユーザーが実際に目にする画面（ボタン・レイアウト・色・動き）を作る開発分野にゃ。「見た目担当」のエンジニアリングにゃ。サーバー側を作る「バックエンド」と対になる言葉にゃ。",c:"dev"},
{t:"ライブコーディング",e:"Live Coding",d:"プログラムを書く様子をリアルタイムで配信する形式にゃ。学習者に「どう考えてコードを書くか」を見せるのに使われるにゃ。最近はAIとの対話しながらコードを作る配信も人気にゃ。",c:"dev"},
{t:"プロンプト",e:"Prompt",d:"AIへの「お願い文」にゃ。同じ質問でも「短く」「箇条書きで」「専門家向けに」と一言添えるだけで返ってくる答えが大きく変わるにゃ。AIをうまく使いこなす第一歩にゃ。",c:"dev"},
{t:"メタプロンプト",e:"Meta Prompt",d:"「プロンプトを作るためのプロンプト」にゃ。「〇〇向けの最適なプロンプトを考えて」とAIに頼むことにゃ。上手な指示文の作り方をAI自身に考えさせる技法にゃ。",c:"dev"},
{t:"プロンプトエンジニア",e:"Prompt Engineer",d:"AIへの指示文を上手に書くことを専門にする職業にゃ。「どう聞けば求める答えが返ってくるか」を研究・実践するにゃ。AIが普及した時代ならではの新しい仕事にゃ。",c:"dev"},
// ===UI・デザイン===
{t:"ヘッダー",e:"Header",d:"Webページの一番上にある帯状のエリアにゃ。会社のロゴ・メニュー・検索窓などが置かれることが多いにゃ。スクロールしても常に上に固定されることが多いにゃ。",c:"ui"},
{t:"フッター",e:"Footer",d:"Webページの一番下にあるエリアにゃ。著作権表示・プライバシーポリシーへのリンク・連絡先などが並ぶにゃ。ページの「後書き」のような場所にゃ。",c:"ui"},
{t:"サイドバー",e:"Sidebar",d:"画面の左右に縦に並ぶメニューや補足情報のエリアにゃ。ブログのカテゴリ一覧や人気記事リストがよく置かれるにゃ。スマホでは画面が狭いので非表示になることも多いにゃ。",c:"ui"},
{t:"モーダル",e:"Modal",d:"画面の上に重なって出てくるポップアップウィンドウにゃ。「本当に削除しますか？」の確認や、写真の拡大表示などに使われるにゃ。後ろの画面が暗くなるのが特徴にゃ。",c:"ui"},
{t:"CTA",e:"Call To Action",d:"「今すぐ無料登録」「カートに入れる」など、ユーザーに次の行動を促すボタンのことにゃ。サイトで一番目立つボタンがCTAにゃ。色・サイズ・文言でクリック率が大きく変わるにゃ。",c:"ui"},
{t:"トースト",e:"Toast Notification",d:"操作の結果を伝えるために画面に一瞬だけ現れて消えるメッセージにゃ。「保存しました✓」「送信完了」などが右下にスッと出て消えるやつにゃ。トーストパンがポンと飛び出るイメージから来た名前にゃ。",c:"ui"},
{t:"レスポンシブ",e:"Responsive Design",d:"スマホ・タブレット・PCなど画面サイズが違う端末でも、自動でレイアウトが最適に調整されるデザインにゃ。「スマホで見たら文字が小さすぎて読めない」をなくすためのしくみにゃ。",c:"ui"},
{t:"スティッキー",e:"Sticky",d:"スクロールしても画面上に固定されたまま動かない要素のことにゃ。ページをどこまでスクロールしても常に上に表示されているメニューバーがスティッキーにゃ。",c:"ui"},
{t:"インフォグラフィック",e:"Infographic",d:"複雑なデータや情報を、グラフ・アイコン・イラストを組み合わせてひと目でわかる絵にしたものにゃ。「文字で説明するより図で見せた方が伝わる」ときに使うにゃ。SNSでもシェアされやすいにゃ。",c:"ui"},
{t:"グラフィックレコーディング",e:"Graphic Recording",d:"会議や講演を聞きながら、話の内容をリアルタイムで絵と文字で大きな紙に記録する手法にゃ。文字だけの議事録より記憶に残りやすく、参加者の共感を生みやすいにゃ。",c:"ui"},
{t:"3DCG",e:"3D Computer Graphics",d:"コンピューターで作った立体的な映像・グラフィックにゃ。映画の特撮・ゲームのキャラクター・建築の完成イメージ図などに使われるにゃ。最近はAIで3DCGを自動生成することも増えてきたにゃ。",c:"ui"},
{t:"CTAボタン配色",e:"Button Color Psychology",d:"ボタンの色でクリック率が変わる心理効果にゃ。赤は緊急性・緑は安心感・オレンジは行動喚起を伝えやすいと言われるにゃ。周りの色とコントラストが強いほど目立つにゃ。",c:"ui"},
{t:"ナビゲーション",e:"Navigation",d:"サイト内を移動するためのメニューの総称にゃ。ヘッダーの横並びメニューやハンバーガーメニューなど、色々な形があるにゃ。今どこにいるかが分かるように作るのが基本にゃ。",c:"ui"},
{t:"カード（UI）",e:"Card UI",d:"情報を四角い枠にまとめて表示するデザインパターンにゃ。写真・タイトル・説明文をひとまとまりにして並べるので、商品一覧やブログ記事一覧でよく使われるにゃ。",c:"ui"},
{t:"タブ",e:"Tab",d:"クリックで表示内容を切り替えられるメニューにゃ。「概要」「レビュー」「Q&A」のように、1つの画面で複数の情報を整理して見せるのに便利にゃ。",c:"ui"},
{t:"パンくずリスト",e:"Breadcrumb",d:"「トップ＞商品一覧＞シャツ」のように、今いる場所を階層で示すナビゲーションにゃ。童話ヘンゼルとグレーテルのパンくずが名前の由来で、迷子にならないようにする役割にゃ。",c:"ui"},
{t:"アコーディオン",e:"Accordion",d:"クリックすると中身が開いたり閉じたりするUI部品にゃ。よくある質問（FAQ）で質問をタップすると答えが出てくるのがこれにゃ。省スペースで情報を整理できるにゃ。",c:"ui"},
{t:"ドロップダウン",e:"Dropdown",d:"クリックすると選択肢がリストで下に開くUI部品にゃ。都道府県選択や並び替えメニューなどでよく使われるにゃ。省スペースで多くの選択肢を扱えるにゃ。",c:"ui"},
{t:"プレースホルダー",e:"Placeholder",d:"入力欄が空のときに薄いグレーで表示されるヒント文字にゃ。「メールアドレスを入力」のような案内にゃ。入力すると自動的に消えるにゃ。",c:"ui"},
{t:"スケルトンスクリーン",e:"Skeleton Screen",d:"データ読み込み中に、これから表示される内容の形（骨組み）をうっすら見せておくローディング表現にゃ。グルグル回るマークより待ってる感が少なく感じられる工夫にゃ。",c:"ui"},
{t:"ダークモード",e:"Dark Mode",d:"画面の背景を黒っぽくして、目の負担や電池消費を減らす表示モードにゃ。このアプリのようなダークテーマがまさにこれにゃ。夜間の利用や省エネに向いているにゃ。",c:"ui"},
{t:"コントラスト比",e:"Contrast Ratio",d:"文字色と背景色の明るさの差のことにゃ。差が小さいと文字が読みにくくなるにゃ。アクセシビリティの観点から、一定以上のコントラスト比を確保することが推奨されているにゃ。",c:"ui"},
{t:"アクセシビリティ",e:"Accessibility",d:"高齢者・視覚障害のある人など、誰にとっても使いやすいデザインにする配慮にゃ。文字サイズ変更・音声読み上げ対応・色だけに頼らない表現などが含まれるにゃ。",c:"ui"},
{t:"マイクロインタラクション",e:"Micro-interaction",d:"ボタンを押したときの小さなアニメーションや振動など、細かい反応演出のことにゃ。いいねを押すとハートが弾む動きなどが代表例にゃ。使い心地の良さに直結する小さな工夫にゃ。",c:"ui"},
{t:"ワイヤーフレーム",e:"Wireframe",d:"デザインの色や装飾を入れる前に作る、画面のおおまかな配置図にゃ。どこに何を置くかだけを決めるための設計図で、家づくりでいう間取り図のようなものにゃ。",c:"ui"},
{t:"プロトタイプ",e:"Prototype",d:"実際に操作できる試作品のことにゃ。本番のコードを書く前に、タップしたら次の画面に移るという動きだけを再現して、使い勝手を確認するのに使うにゃ。",c:"ui"},
{t:"デザインシステム",e:"Design System",d:"ボタン・色・フォントなどのデザインルールを会社やアプリ全体で統一するためのルールブックにゃ。誰が作っても同じ見た目・使い心地になるようにする仕組みにゃ。",c:"ui"},
{t:"グリッドレイアウト",e:"Grid Layout",d:"画面を格子状のマス目に分けて要素を整列させるレイアウト手法にゃ。新聞や雑誌のような整然とした配置を作れるにゃ。CSSのGridという技術がこれを実現するにゃ。",c:"ui"},
{t:"ホワイトスペース",e:"White Space（余白）",d:"要素と要素の間の何もない空間のことにゃ。余白を適切に取ることで、情報が詰め込みすぎにならず読みやすくなるにゃ。余白は無駄ではなくデザインの一部という考え方にゃ。",c:"ui"},
{t:"タイポグラフィ",e:"Typography",d:"文字のフォント・大きさ・行間・字間などをデザインする技術にゃ。同じ文章でもフォント選びで印象が大きく変わるにゃ。読みやすさと見た目の両方を両立させる工夫にゃ。",c:"ui"},
// ===Web・IT===
{t:"LGWAN",e:"Local Government Wide Area Network",d:"日本の自治体・行政機関専用の安全なネットワークにゃ。インターネットとは切り離された閉じた回線で、個人情報や機密データを安全にやりとりするにゃ。",c:"web"},

const catInfo={
  ai:{label:"🤖 AI基礎",order:0},
  tool:{label:"🛠 AIツール",order:1},
  law:{label:"⚖️ 法律・倫理",order:2},
  sec:{label:"🔐 セキュリティ",order:3},
  biz:{label:"💼 ビジネス",order:4},
  dev:{label:"💻 開発",order:5},
  ui:{label:"🎨 UI・デザイン",order:6},
  web:{label:"🌐 Web・IT",order:7}
};

let currentCat="all";
let searchVal="";

function render(){
  const list=document.getElementById("list");
  let filtered=terms.filter(item=>{
    const matchCat=currentCat==="all"||item.c===currentCat;
    const matchSearch=searchVal===""||
      item.t.toLowerCase().includes(searchVal)||
      item.e.toLowerCase().includes(searchVal)||
      item.d.toLowerCase().includes(searchVal);
    return matchCat&&matchSearch;
  });
  document.getElementById("badge").textContent=filtered.length+"語";

  if(filtered.length===0){
    list.innerHTML='<div class="no-result">該当する用語が見つからないにゃ🐱</div>';
    return;
  }

  const grouped={};
  filtered.forEach(item=>{
    if(!grouped[item.c])grouped[item.c]=[];
    grouped[item.c].push(item);
  });

  const catKeys=Object.keys(grouped).sort((a,b)=>catInfo[a].order-catInfo[b].order);
  list.innerHTML=catKeys.map(cat=>`
    <div class="section-title">${catInfo[cat].label} <span style="font-size:11px;color:#5a6480;font-weight:normal">${grouped[cat].length}語</span></div>
    ${grouped[cat].map(item=>`
      <div class="card" onclick="this.classList.toggle('open')">
        <div class="card-head">
          <div class="term-jp">${item.t}</div>
          <div class="term-en">${item.e}</div>
          <div class="arrow">▶</div>
        </div>
        <div class="card-body">${item.d}</div>
      </div>
    `).join("")}
  `).join("");
}

document.getElementById("search").addEventListener("input",e=>{
  searchVal=e.target.value.toLowerCase();
  render();
});

document.getElementById("filters").addEventListener("click",e=>{
  const btn=e.target.closest(".f-btn");
  if(!btn)return;
  currentCat=btn.dataset.cat;
  document.querySelectorAll(".f-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
});

render();
</script>
